      : `<div class="card muted">${esc(tr('auto_rules.none'))}</div>`}
    <div class="card">
      <div class="row">
        <h3 class="grow" style="margin:0">${esc(tr('auto_rules.preview_title'))}</h3>
        <button class="ghost action" id="arPreview">${esc(tr('auto_rules.preview_button'))}</button>
      </div>
      <div class="muted">${esc(tr('auto_rules.preview_hint'))}</div>
      <div id="arPreviewOut">${arPreviewHtml()}</div>
    </div>
    <div class="card">
      <h3 style="margin-top:0">${esc(tr('auto_rules.log_title'))}</h3>
      ${arLogHtml(logRows)}
    </div>`;

  const saveSettings = async body => {
    try { await api('/api/auto-rules/settings', { method: 'PUT', body: JSON.stringify(body) }); }
    catch (e) { alert(e.message); }
    renderAutoRules();
  };
  $('#arEnabled').onchange = e => saveSettings({ enabled: e.target.checked });
  $('#arCap').onchange = e => saveSettings({ daily_cap: Math.max(0, Number(e.target.value) || 0) });
  const openEditor = async (id, rule) => {
    autoRulesView.editing = id;
    autoRulesView.draft = JSON.parse(JSON.stringify(rule));
    if (!autoRulesView.team) {
      try { autoRulesView.team = await api('/api/team'); } catch (e) { autoRulesView.team = { party: [], box: [] }; }
    }
    renderAutoRules();
  };
  $('#arNew').onclick = () => openEditor('new', {
    name: '', enabled: true,
    conditions: { types_mode: 'any', catch_chance_ball: 'poke_ball' },
    actions: { mode: 'defeat', team: 'current', ball: 'cheapest_chance', ball_key: 'poke_ball',
               chance_min: 60, max_balls: 3, on_fail: 'leave', buy_ball: null, buy_below: 5,
               buy_up_to: 20, money_reserve: 0 },
  });
  el.querySelectorAll('.arTemplate').forEach(btn => {
    btn.onclick = async () => {
      try { await api(`/api/auto-rules/templates/${encodeURIComponent(btn.dataset.key)}`, { method: 'POST' }); }
      catch (e) { alert(e.message); }
      renderAutoRules();
    };
  });
  const ruleById = id => rules.find(r => r.id === id);
  el.querySelectorAll('[data-rule]').forEach(card => {
    const id = Number(card.dataset.rule);
    const rule = ruleById(id);
    card.querySelector('.arToggle').onchange = async e => {
      try { await api(`/api/auto-rules/${id}`, { method: 'PUT', body: JSON.stringify({ ...rule, id: undefined, position: undefined, enabled: e.target.checked }) }); }
      catch (err) { alert(err.message); }
      renderAutoRules();
    };
    card.querySelectorAll('.arMove').forEach(btn => {
      btn.onclick = async () => {
        const ids = rules.map(r => r.id);
        const i = ids.indexOf(id), j = i + Number(btn.dataset.dir);
        [ids[i], ids[j]] = [ids[j], ids[i]];
        try { await api('/api/auto-rules/order', { method: 'PUT', body: JSON.stringify({ ids }) }); }
        catch (e) { alert(e.message); }
        renderAutoRules();
      };
    });
    card.querySelector('.arEdit').onclick = () => openEditor(id, rule);
    card.querySelector('.arDelete').onclick = async () => {
      if (!confirm(tr('auto_rules.delete_confirm', { name: rule.name }))) return;
      try { await api(`/api/auto-rules/${id}`, { method: 'DELETE' }); }
      catch (e) { alert(e.message); }
      if (autoRulesView.editing === id) autoRulesView.editing = null;
      renderAutoRules();
    };
  });
  const editor = $('#arEditor');
  if (editor) {
    const rerender = () => { arReadForm(editor, autoRulesView.draft); renderAutoRules(); };
    AR_ACTION_FIELDS.filter(f => f.rerender).forEach(f => {
      const node = editor.querySelector(`[data-ar="act"][data-key="${f.key}"]`);
      if (node) node.onchange = rerender;
    });
    $('#arCancel').onclick = () => { autoRulesView.editing = null; renderAutoRules(); };
    $('#arSave').onclick = async () => {
      const draft = arReadForm(editor, autoRulesView.draft);
      const body = { name: (draft.name || '').trim(), enabled: draft.enabled,
                     conditions: draft.conditions, actions: draft.actions };
      const id = autoRulesView.editing;
      try {
        await api(id === 'new' ? '/api/auto-rules' : `/api/auto-rules/${id}`,
                  { method: id === 'new' ? 'POST' : 'PUT', body: JSON.stringify(body) });
        autoRulesView.editing = null;
        autoRulesView.preview = null;
        renderAutoRules();
      } catch (e) { $('#arEditorMsg').textContent = e.message; }
    };
  }
  $('#arPreview').onclick = async () => {
    try { autoRulesView.preview = (await api('/api/auto-rules/preview')).encounters; }
    catch (e) { alert(e.message); return; }
    $('#arPreviewOut').innerHTML = arPreviewHtml();
  };
}

const admApi = (path, options) => fetch(BASE + path, {

}).then(async r => {

      ? d.map(x => `${(x.loc || []).slice(1).join('.')}: ${x.msg}`).join('; ')
      : (d || r.statusText);
    throw new Error(msg);
  }
  return body;
});

      <div class="row" style="margin-top:8px">
        <label class="muted">${tr('admin.level')} <input type="number" id="admLevel" min="1" max="100" value="5" style="width:5em"></label>
        <label class="muted">${tr('admin.shiny')} <input type="checkbox" id="admShiny"></label>

      <div class="row" style="margin-top:8px">

      </div>
      <div class="log" id="admSpawnOut" style="margin-top:6px"></div>
    </div>`;

  admWireSpeciesSearch(box, sp => { adminState.species = sp; admRenderPicked(); });

      adminState.species = await admApi('/api/admin/species/random');
      admRenderPicked();

      species_id: adminState.species.id,

      shiny: $('#admShiny').checked
    };

  $('#admSpawnQueue').onclick = async () => {
    const out = $('#admSpawnOut');

      const r = await admApi('/api/admin/encounters', admSend('POST', spawnPayload()));
      out.textContent = tr('admin.spawned_to_queue', { id: r.encounter_id, name: admName(adminState.species) });

    const out = $('#admSpawnOut');

      if (!userId) throw new Error(tr('admin.no_player_selected'));
      const body = { ...spawnPayload(), placement: $('#admGivePlace').value };

      const who = $('#admGiveUser').selectedOptions[0].textContent;
      out.textContent = tr('admin.given_to', { name: admName(adminState.species), who }) + ' ' +
        (r.party_slot ? tr('admin.team_slot_sentence', { slot: r.party_slot }) : tr('admin.in_box')) +
        (r.placed_in_box_because_party_full ? ' ' + tr('admin.party_was_full') : '');
    } catch (e) { out.textContent = e.message; }
  };
}

// --------------------------------------------------------- Game settings
// Household-wide gameplay values, grouped, with the default next to each one.
// Saving sends only the changed values through PATCH /api/settings (the
// validation lives there); "reset" restores the defaults server-side.
async function admRenderGameSettings(box) {
  const data = await admApi('/api/admin/settings');
  const groups = data.groups.slice().sort((a, b) =>
    ADM_SETTING_GROUPS.indexOf(a.key) - ADM_SETTING_GROUPS.indexOf(b.key));
  const labelOf = key => STRINGS['settings.' + key] || key;
  const fmtDefault = s => s.type === 'bool' ? tr(s.default ? 'admin.bool_on' : 'admin.bool_off')
    : s.type === 'json' ? admJsonText(s.default) : String(s.default);
  const modifiedCount = groups.reduce((n, g) => n + g.settings.filter(s => s.modified).length, 0);

  const rowHtml = s => {
    const input = s.type === 'bool'
      ? `<input type="checkbox" data-key="${esc(s.key)}"${s.value ? ' checked' : ''}>`
      : s.type === 'number'
        ? `<input type="number" step="any" data-key="${esc(s.key)}" value="${esc(s.value)}" size="8">`
        : `<span class="muted">${esc(admJsonText(s.value))}</span>`;
    return `<div class="row" style="padding:6px 0" data-setting="${esc(s.key)}">
      <div class="grow">${esc(labelOf(s.key))}
        <div class="muted">${tr('admin.settings_default', { value: esc(fmtDefault(s)) })}</div></div>
      ${s.modified ? `<span class="pill">${tr('admin.settings_modified')}</span>` : ''}${input}</div>`;
  };

  box.innerHTML = `
    <div class="card">
      <div class="row">
        <div class="grow">
          <h3 style="margin:0">${tr('admin.settings_title')}</h3>
          <div class="muted">${tr('admin.settings_hint')} ${tr('admin.settings_modified_count', { count: modifiedCount })}</div>
        </div>
        <button class="action" id="admSettingsSave">${tr('common.save')}</button>
        <button class="ghost action" id="admSettingsResetAll" style="border-color:var(--accent);color:var(--accent)">${tr('admin.settings_reset_all')}</button>
      </div>
    </div>` + groups.map(g => `
    <div class="card" data-group="${esc(g.key)}">
      <div class="row">
        <h3 class="grow" style="margin:0">${tr('admin.settings_group.' + g.key)}</h3>
        <button class="ghost action admGroupReset" data-group="${esc(g.key)}">${tr('admin.settings_reset_group')}</button>
      </div>
      ${g.key === 'rarity' ? `<div class="muted" style="margin:6px 0">${tr('admin.settings_group_hint.rarity')}</div>
        <div id="admRarityPreview" style="margin-bottom:6px"></div>` : ''}
      ${g.settings.map(rowHtml).join('')}
    </div>`).join('');

  const known = Object.fromEntries(groups.flatMap(g => g.settings.map(s => [s.key, s])));
  const fail = e => alert(e.message);

  $('#admSettingsSave').onclick = async () => {
    const payload = {};
    for (const input of box.querySelectorAll('input[data-key]')) {
      const s = known[input.dataset.key];
      const value = input.type === 'checkbox' ? input.checked : input.value === '' ? null : Number(input.value);
      if (value === null || Number.isNaN(value)) { alert(tr('admin.settings_invalid_number', { label: labelOf(s.key) })); return; }
      if (value !== s.value) payload[s.key] = value;
    }
    if (!Object.keys(payload).length) { alert(tr('admin.settings_nothing_changed')); return; }
    try {
      await admApi('/api/settings', admSend('PATCH', payload));
      alert(tr('settings.saved_alert'));
      admRenderGameSettings(box);
    } catch (e) { fail(e); }
  };

  const reset = async group => {
    const msg = group ? tr('admin.settings_reset_group_confirm', { group: tr('admin.settings_group.' + group) })
      : tr('admin.settings_reset_all_confirm');
    if (!confirm(msg)) return;
    try {
      await admApi('/api/admin/settings/reset', admSend('POST', { group }));
      admRenderGameSettings(box);
    } catch (e) { fail(e); }
  };
  // Live preview of the rarity weights: the tier shares are relative to the sum.
  const preview = box.querySelector('#admRarityPreview');
  if (preview) {
    const inputs = [...box.querySelectorAll('input[data-key^="rarity_weight_"]')];
    const update = () => {
      // Inputs are rendered in rarity.TIERS order (see SETTING_GROUPS in api/admin.py),
      // so a later tier weighing more than any earlier one silently grabs most of the
      // spawns once normalised - flag it (mirrors rarity.out_of_order_tiers).
      const values = inputs.map(i => [i.dataset.key.replace('rarity_weight_', ''), Math.max(0, Number(i.value) || 0)]);
      const sum = values.reduce((n, [, v]) => n + v, 0);
      const shares = values.map(([tier, v]) =>
        `${tr('rarity.' + tier)} ${fmtPercent(sum ? 100 * v / sum : 0)}`).join(' · ');
      let highestSoFar = 0;
      const outOfOrder = [];
      for (const [tier, v] of values) {
        if (highestSoFar > 0 && v > highestSoFar) outOfOrder.push(tier);
        highestSoFar = Math.max(highestSoFar, v);
      }
      const warning = outOfOrder.length
        ? `<div class="muted" style="color:var(--warn)">${tr('admin.settings_rarity_order_warning',
            { tiers: outOfOrder.map(t => tr('rarity.' + t)).join(', ') })}</div>` : '';
      preview.innerHTML = `<strong>${tr('admin.settings_rarity_preview', { shares: esc(shares) })}</strong>${warning}`;
    };
    inputs.forEach(i => i.addEventListener('input', update));
    update();
  }
  $('#admSettingsResetAll').onclick = () => reset(null);
  box.querySelectorAll('.admGroupReset').forEach(btn => { btn.onclick = () => reset(btn.dataset.group); });
}

// Fetches the selected player and draws the editor. Section switches and list
// filters redraw from `adminState.detail` without another request.
async function admRenderUser() {
  const box = $('#admUserDetail');
  if (!box) return;
  if (!adminState.userId) { box.innerHTML = `<div class="card muted">${tr('admin.no_players_yet')}</div>`; return; }
  try {
    adminState.detail = await admApi(admUserUrl(adminState.userId));
    // A concurrent redraw (e.g. two renders of the settings tab) replaced the box.
    if (!box.isConnected) return;
    admDrawUser(box);
  } catch (e) {
    box.innerHTML = `<div class="card">${tr('header.error', { message: esc(e.message) })}</div>`;
  }
}

function admDrawUser(box) {
  const meta = adminState.meta, d = adminState.detail, u = d.user;
  const partyCount = d.pokemon.filter(p => p.party_slot).length;
  const sections = [
    ['account', tr('admin.section_account')],
    ['team', `${tr('admin.section_team')} (${partyCount}/${meta.party_size})`],
    ['box', `${tr('admin.section_box')} (${d.pokemon.length - partyCount})`],
    ['items', `${tr('admin.section_items')} (${d.inventory.length})`],
    ['dex', tr('admin.section_dex')],
    ['achievements', tr('admin.section_achievements')],
    ['raw', tr('admin.section_raw')],
  ];
  if (!sections.some(([key]) => key === adminState.section)) adminState.section = 'account';
  box.innerHTML = `
    <div class="card">
      <div class="row">
        <strong class="grow">${esc(admUserLabel(u))}</strong>
        ${u.money != null ? `<span class="pill">${esc(fmtMoney(u.money))}</span>` : ''}
      </div>
      <div class="muted">${tr('admin.id_label')} ${esc(u.id)} · ${tr('admin.starter_label')} ${u.starter_species_id ? '#' + esc(u.starter_species_id) : tr('admin.not_chosen_yet')}
        · ${tr('admin.since')} ${esc(new Date(u.created_at).toLocaleDateString(jsLocale()))}
        · ${tr('admin.last_seen')} ${esc(new Date(u.last_seen_at).toLocaleString(jsLocale()))}</div>
      <div class="row" style="margin-top:10px">
        ${sections.map(([key, label]) => `<button class="ghost action secBtn admSecBtn${adminState.section === key ? ' active' : ''}" data-section="${key}">${esc(label)}</button>`).join('')}
      </div>
    </div>
    <div id="admSection"></div>`;
  box.querySelectorAll('.admSecBtn').forEach(btn => {
    btn.onclick = () => { adminState.section = btn.dataset.section; admDrawUser(box); };
  });
  const section = $('#admSection');
  ({ account: admSectionAccount, team: admSectionTeam, box: admSectionBox, items: admSectionItems,
     dex: admSectionDex, achievements: admSectionAchievements, raw: admSectionRaw }[adminState.section])(section, d);
}

const admFail = e => alert(e.message);
const admFieldLabel = key => tr('admin.field.' + key);

function admSectionAccount(box, d) {
  const u = d.user;
  const who = admUserLabel(u);
  const partyCount = d.pokemon.filter(p => p.party_slot).length;
  const fields = Object.entries(d.editable_fields || {});
  // Only fields with a reset value are touched by "wipe save data" (money, ...).
  const resetFields = fields.filter(([, spec]) => 'reset' in spec);
  const userId = u.id;

  const fieldInputs = fields.map(([key, spec]) => {
    const v = u[key];
    let input;
    if (spec.type === 'bool') {
      input = `<input type="checkbox" data-field="${esc(key)}"${v ? ' checked' : ''}>`;
    } else if (spec.type === 'choice') {
      // Option labels reuse the player settings' keys (region_lock.region, language.de, ...).
      input = `<select data-field="${esc(key)}">${(spec.options || []).map(o => admOpt(o, tr(key + '.' + o), o === v)).join('')}</select>`;
    } else if (spec.type === 'int') {
      input = `<input type="number" step="1" data-field="${esc(key)}" value="${esc(v)}"` +
        (spec.min != null ? ` min="${esc(spec.min)}"` : '') +
        (spec.max != null ? ` max="${esc(spec.max)}"` : '') + ' style="width:9em">';
    } else {
      input = `<input data-field="${esc(key)}" value="${esc(v)}">`;
    }
    return `<label class="muted">${esc(admFieldLabel(key))} ${input}</label>`;
  }).join('');

  box.innerHTML = `
    <div class="card">
      <h3 style="margin-top:0">${tr('admin.account')}</h3>
      ${fields.length ? `<div class="row">${fieldInputs}
        <button class="action" id="admSaveUser">${tr('common.save')}</button></div>
        ${'god_mode' in d.editable_fields ? `<div class="muted" style="margin-top:6px">${tr('admin.god_mode_hint')}</div>` : ''}` : `<div class="muted">${tr('admin.no_editable_fields')}</div>`}
    </div>
    <div class="card">
      <h3 style="margin-top:0">${tr('admin.danger_zone')}</h3>
      <div class="row">
        <label class="muted"><input type="checkbox" id="admKeepMons" checked> ${tr('admin.keep_pokemon')}</label>
        <button class="ghost action" id="admResetStarter">${tr('admin.reset_starter')}</button>
      </div>
      <div class="row" style="margin-top:8px">
        <label class="muted"><input type="checkbox" id="admDeleteUser"> ${tr('admin.also_remove_user')}</label>
        <button class="ghost action" id="admWipe" style="border-color:var(--accent);color:var(--accent)">${tr('admin.wipe_save')}</button>
      </div>
    </div>`;

  const saveBtn = box.querySelector('#admSaveUser');
  if (saveBtn) saveBtn.onclick = async () => {
    const payload = {};
    box.querySelectorAll('[data-field]').forEach(input => {
      const spec = d.editable_fields[input.dataset.field] || {};
      payload[input.dataset.field] = spec.type === 'bool' ? input.checked
        : spec.type === 'int' ? (input.value === '' ? null : Number(input.value))
        : input.value;
    });
    try { await admApi(admUserUrl(userId), admSend('PATCH', payload)); admRenderUser(); }
    catch (e) { admFail(e); }
  };

  box.querySelector('#admResetStarter').onclick = async () => {
    const keep = box.querySelector('#admKeepMons').checked;
    const msg = keep
      ? tr('admin.reset_starter_keep_confirm', { who, count: partyCount })
      : tr('admin.reset_starter_wipe_confirm', { who, count: d.pokemon.length });
    if (!confirm(msg)) return;
    try {
      await admApi(admUserUrl(userId) + '/reset-starter', admSend('POST', { keep_pokemon: keep }));
      admRenderUser();
    } catch (e) { admFail(e); }
  };

  box.querySelector('#admWipe').onclick = async () => {
    const deleteUser = box.querySelector('#admDeleteUser').checked;
    const typed = prompt(
      tr('admin.wipe_confirm', { who, count: d.pokemon.length }) +
      (resetFields.length ? tr('admin.wipe_confirm_fields', { fields: resetFields.map(([k]) => admFieldLabel(k)).join(', ') }) : '') + '.' +
      (deleteUser ? ' ' + tr('admin.wipe_confirm_delete_user') : '') +
      '\n\n' + tr('admin.wipe_confirm_type_name', { name: u.name }));
    if (typed === null) return;
    if (typed.trim() !== u.name) { alert(tr('admin.name_mismatch')); return; }
    try {
      await admApi(admUserUrl(userId) + '/data?delete_user=' + (deleteUser ? 'true' : 'false'),
        { method: 'DELETE' });
      if (deleteUser) adminState.userId = null;
      render('admin');
    } catch (e) { admFail(e); }
  };
}

// Team = the (at most 6) party slots, in slot order.
function admSectionTeam(box, d) {
  const party = d.pokemon.filter(p => p.party_slot);
  box.innerHTML = party.length
    ? party.map(p => admPokemonRow(p, adminState.meta)).join('')
    : `<div class="card muted">${tr('admin.no_pokemon')}</div>`;
  admWirePokemonCards(box, d);
}

// Box = everything not in the party, with search + sort + paging (a box can
// hold hundreds of Pokémon).
function admSectionBox(box, d) {
  const boxMons = d.pokemon.filter(p => !p.party_slot);
  const sorts = [['dex', tr('admin.sort_dex')], ['level', tr('admin.sort_level')], ['name', tr('admin.sort_name')]];
  box.innerHTML = `
    <div class="card row">
      <input class="grow" id="admBoxQ" placeholder="${tr('admin.box_filter_placeholder')}" value="${esc(adminState.boxQuery)}">
      <label class="muted">${tr('admin.sort_by')}
        <select id="admBoxSort">${sorts.map(([v, label]) => admOpt(v, label, v === adminState.boxSort)).join('')}</select></label>
    </div>
    <div id="admBoxList"></div>`;

  const nameKey = p => (p.nickname || admName(p.species)).toLocaleLowerCase();
  const drawList = () => {
    const q = adminState.boxQuery.trim().toLocaleLowerCase().replace(/^#/, '');
    let list = boxMons.filter(p => !q || [
      p.nickname, p.species && p.species.name, p.species && p.species.name_en, p.species && p.species.name_de,
      String(p.species_id), String(p.id),
    ].some(v => v && String(v).toLocaleLowerCase().includes(q)));
    list = list.slice().sort(adminState.boxSort === 'level' ? (a, b) => b.level - a.level || a.id - b.id
      : adminState.boxSort === 'name' ? (a, b) => nameKey(a).localeCompare(nameKey(b))
      : (a, b) => a.species_id - b.species_id || a.id - b.id);
    const key = 'admin:box:' + d.user.id;
    const page = pageSlice(key, list, 12);
    const el = $('#admBoxList');
    el.innerHTML = (list.length ? page.items.map(p => admPokemonRow(p, adminState.meta)).join('') +
        pagerHtml(key, page.page, page.totalPages)
      : `<div class="card muted">${boxMons.length ? tr('common.nothing_found') : tr('admin.no_pokemon')}</div>`);
    wirePager(el, drawList);
    admWirePokemonCards(el, d);
  };
  $('#admBoxQ').oninput = e => { adminState.boxQuery = e.target.value; pageState['admin:box:' + d.user.id] = 0; drawList(); };
  $('#admBoxSort').onchange = e => { adminState.boxSort = e.target.value; drawList(); };
  drawList();
}

// Inventory grouped by item category, with category filter + search + paging.
function admSectionItems(box, d) {
  const meta = adminState.meta;
  const userId = d.user.id;
  const info = key => meta.items[key] || (meta.balls[key] ? { ...meta.balls[key], category: 'ball' } : null);
  const items = d.inventory.map(i => {
    const it = info(i.item_key);
    return { ...i, category: it ? it.category : 'other', label: it ? (pick(it, 'label') || i.item_key) : i.item_key };
  });
  const cats = [...new Set(items.map(i => i.category))]
    .sort((a, b) => sectionRank(a) - sectionRank(b) || a.localeCompare(b));
  if (adminState.itemCategory && !cats.includes(adminState.itemCategory)) adminState.itemCategory = '';
  const catBtn = (value, label, count) =>
    `<button class="ghost action secBtn admCatBtn${value === adminState.itemCategory ? ' active' : ''}" data-cat="${esc(value)}">${esc(label)} (${count})</button>`;

  box.innerHTML = `
    <div class="card">
      <h3 style="margin-top:0">${tr('admin.inventory')}</h3>
      <div class="row">
        <input id="admInvKey" class="grow" list="admItemKeys" placeholder="${tr('admin.item_key_placeholder')}">
        <datalist id="admItemKeys">${meta.item_keys.map(k => `<option value="${esc(k)}">`).join('')}</datalist>
        <input type="number" id="admInvQty" min="0" step="1" value="1" style="width:7em">
        <button class="action" id="admInvAdd">${tr('admin.set')}</button>
      </div>
      <div class="muted">${tr('admin.quantity_zero_hint')}</div>
    </div>
    <div class="card row" style="flex-wrap:wrap">
      ${catBtn('', tr('shop.section_all'), items.length)}
      ${cats.map(c => catBtn(c, itemCategoryLabel(c), items.filter(i => i.category === c).length)).join('')}
      <input class="grow" id="admItemQ" placeholder="${tr('common.filter_placeholder')}" value="${esc(adminState.itemQuery)}">
    </div>
    <div id="admItemList"></div>`;

  const setItem = async (key, quantity) => {
    await admApi(admUserUrl(userId) + '/inventory/' + encodeURIComponent(key), admSend('PUT', { quantity }));
    admRenderUser();
  };
  const drawList = () => {
    const q = adminState.itemQuery.trim().toLocaleLowerCase();
    const list = items
      .filter(i => (!adminState.itemCategory || i.category === adminState.itemCategory) &&
        (!q || i.label.toLocaleLowerCase().includes(q) || i.item_key.includes(q)))
      .sort((a, b) => sectionRank(a.category) - sectionRank(b.category) ||
        a.category.localeCompare(b.category) || a.label.localeCompare(b.label));
    const key = 'admin:inventory:' + userId;
    const page = pageSlice(key, list, 15);
    let lastCat = null;
    const el = $('#admItemList');
    el.innerHTML = list.length ? `<div class="card">` + page.items.map(i => {
      const header = i.category !== lastCat
        ? `<div class="muted" style="margin-top:6px"><strong>${esc(itemCategoryLabel(i.category))}</strong></div>` : '';
      lastCat = i.category;
      return header + `<div class="row admInvRow" data-key="${esc(i.item_key)}" style="padding:4px 0">
        <div class="grow">${esc(i.label)} <span class="muted">${esc(i.item_key)}</span></div>
        <input type="number" min="0" step="1" class="admQty" value="${esc(i.quantity)}" style="width:7em">
        <button class="ghost action admInvSave">${tr('admin.set')}</button>
      </div>`;
    }).join('') + `</div>` + pagerHtml(key, page.page, page.totalPages)
      : `<div class="card muted">${items.length ? tr('common.nothing_found') : tr('admin.empty')}</div>`;
    wirePager(el, drawList);
    el.querySelectorAll('.admInvRow').forEach(row => {
      row.querySelector('.admInvSave').onclick = () =>
        setItem(row.dataset.key, Number(row.querySelector('.admQty').value)).catch(admFail);
    });
  };
  box.querySelectorAll('.admCatBtn').forEach(btn => {
    btn.onclick = () => { adminState.itemCategory = btn.dataset.cat; pageState['admin:inventory:' + userId] = 0; admSectionItems(box, d); };
  });
  $('#admItemQ').oninput = e => { adminState.itemQuery = e.target.value; pageState['admin:inventory:' + userId] = 0; drawList(); };
  box.querySelector('#admInvAdd').onclick = () => {
    const key = box.querySelector('#admInvKey').value.trim();
    if (!key) return;
    setItem(key, Number(box.querySelector('#admInvQty').value)).catch(admFail);
  };
  drawList();
}

// Pokédex: every species with seen / caught / shiny, editable per row, plus
// bulk fill (whole Pokédex or one generation). Loaded on demand.
async function admSectionDex(box, d) {
  const userId = d.user.id;
  const meta = adminState.meta;
  box.innerHTML = `<div class="card muted">${tr('admin.loading')}</div>`;
  let dex;
  try { dex = await admApi(admUserUrl(userId) + '/dex'); }
  catch (e) { box.innerHTML = `<div class="card">${tr('header.error', { message: esc(e.message) })}</div>`; return; }
  if (!box.isConnected) return;  // the view was redrawn while loading
  const genOpts = admOpt('', tr('admin.dex_all_generations'), !adminState.dexGen) +
    meta.generations.map(g => admOpt(g, tr('admin.generation', { gen: g }), String(g) === adminState.dexGen)).join('');
  const states = ['none', 'seen', 'caught', 'shiny'];
  const stateOf = e => e.shiny_caught ? 'shiny' : e.caught_count ? 'caught' : e.seen_count ? 'seen' : 'none';
  box.innerHTML = `
    <div class="card">
      <h3 style="margin-top:0">${tr('admin.section_dex')}</h3>
      <div class="muted">${tr('admin.dex_summary', { seen: dex.seen, caught: dex.caught, shiny: dex.shiny, total: dex.entries.length })}</div>
      <div class="row" style="margin-top:8px">
        <select id="admDexBulkGen">${genOpts}</select>
        <select id="admDexBulkState">${states.map(st => admOpt(st, tr('admin.dex_state.' + st), st === 'caught')).join('')}</select>
        <button class="ghost action" id="admDexBulk">${tr('admin.dex_bulk_apply')}</button>
      </div>
      <div class="muted">${tr('admin.dex_bulk_hint')}</div>
    </div>
    <div class="card row">
      <input class="grow" id="admDexQ" placeholder="${tr('admin.box_filter_placeholder')}" value="${esc(adminState.dexQuery)}">
      <select id="admDexGen">${genOpts}</select>
      <select id="admDexState">${admOpt('', tr('shop.section_all'), !adminState.dexState)}${states.map(st => admOpt(st, tr('admin.dex_state.' + st), st === adminState.dexState)).join('')}</select>
    </div>
    <div id="admDexList"></div>`;

  const drawList = () => {
    const q = adminState.dexQuery.trim().toLocaleLowerCase().replace(/^#/, '');
    const list = dex.entries.filter(e =>
      (!adminState.dexGen || String(e.generation) === adminState.dexGen) &&
      (!adminState.dexState || stateOf(e) === adminState.dexState) &&
      (!q || [e.name, e.name_en, e.name_de, String(e.species_id)].some(v => v && String(v).toLocaleLowerCase().includes(q))));
    const key = 'admin:dex:' + userId;
    const page = pageSlice(key, list, 20);
    const el = box.querySelector('#admDexList');
    el.innerHTML = list.length ? `<div class="card">` + page.items.map(e => `
      <div class="row admDexRow" data-sid="${esc(e.species_id)}" style="padding:4px 0">
        ${e.sprite_url ? `<img class="sprite" src="${esc(e.sprite_url)}" alt="" style="width:40px;height:40px">` : ''}
        <div class="grow">#${esc(e.species_id)} ${esc(admName({ ...e, id: e.species_id }))}</div>
        <label class="muted">${tr('admin.dex_seen')} <input type="number" class="admDexSeen" min="0" step="1" value="${esc(e.seen_count)}" style="width:5em"></label>
        <label class="muted">${tr('admin.dex_caught')} <input type="number" class="admDexCaught" min="0" step="1" value="${esc(e.caught_count)}" style="width:5em"></label>
        <label class="muted">${tr('admin.shiny')} <input type="checkbox" class="admDexShiny"${e.shiny_caught ? ' checked' : ''}></label>
        <button class="ghost action admDexSave">${tr('admin.set')}</button>
      </div>`).join('') + `</div>` + pagerHtml(key, page.page, page.totalPages)
      : `<div class="card muted">${tr('common.nothing_found')}</div>`;
    wirePager(el, drawList);
    el.querySelectorAll('.admDexRow').forEach(row => {
      row.querySelector('.admDexSave').onclick = async () => {
        try {
          await admApi(admUserUrl(userId) + '/dex/' + row.dataset.sid, admSend('PUT', {
            seen_count: Number(row.querySelector('.admDexSeen').value),
            caught_count: Number(row.querySelector('.admDexCaught').value),
            shiny_caught: row.querySelector('.admDexShiny').checked,
          }));
          admSectionDex(box, d);
        } catch (e) { admFail(e); }
      };
    });
  };
  const resetPage = () => { pageState['admin:dex:' + userId] = 0; drawList(); };
  box.querySelector('#admDexQ').oninput = e => { adminState.dexQuery = e.target.value; resetPage(); };
  box.querySelector('#admDexGen').onchange = e => { adminState.dexGen = e.target.value; resetPage(); };
  box.querySelector('#admDexState').onchange = e => { adminState.dexState = e.target.value; resetPage(); };
  box.querySelector('#admDexBulk').onclick = async () => {
    const gen = box.querySelector('#admDexBulkGen').value, state = box.querySelector('#admDexBulkState').value;
    const scope = gen ? tr('admin.generation', { gen }) : tr('admin.dex_all_generations');
    if (!confirm(tr('admin.dex_bulk_confirm', { scope, state: tr('admin.dex_state.' + state), who: admUserLabel(d.user) }))) return;
    try {
      await admApi(admUserUrl(userId) + '/dex/bulk', admSend('POST', { state, generation: gen ? Number(gen) : null }));
      admSectionDex(box, d);
    } catch (e) { admFail(e); }
  };
  drawList();
}

// Achievements (gym badges, regions, Pokédex, milestones ...): grant / revoke
// one by one or every achievement currently listed, optionally with reward.
async function admSectionAchievements(box, d) {
  const userId = d.user.id;
  box.innerHTML = `<div class="card muted">${tr('admin.loading')}</div>`;
  let data;
  try { data = await admApi(admUserUrl(userId) + '/achievements'); }
  catch (e) { box.innerHTML = `<div class="card">${tr('header.error', { message: esc(e.message) })}</div>`; return; }
  if (!box.isConnected) return;  // the view was redrawn while loading
  const all = data.achievements;
  const groups = [...new Set(all.map(a => a.group))];
  if (adminState.achGroup && !groups.includes(adminState.achGroup)) adminState.achGroup = '';
  const groupLabel = g => tr('achievements.group.' + g);
  const groupBtn = (value, label, list) =>
    `<button class="ghost action secBtn admAchGroup${value === adminState.achGroup ? ' active' : ''}" data-group="${esc(value)}">${esc(label)} (${list.filter(a => a.unlocked).length}/${list.length})</button>`;
  box.innerHTML = `
    <div class="card">
      <h3 style="margin-top:0">${tr('admin.section_achievements')}</h3>
      <div class="muted">${tr('admin.achievements_hint')}</div>
      <div class="row" style="margin-top:8px">
        <label class="muted"><input type="checkbox" id="admAchReward"> ${tr('admin.achievements_with_reward')}</label>
        <button class="ghost action" id="admAchGrantAll">${tr('admin.achievements_grant_listed')}</button>
        <button class="ghost action" id="admAchRevokeAll" style="border-color:var(--accent);color:var(--accent)">${tr('admin.achievements_revoke_listed')}</button>
      </div>
    </div>
    <div class="card row" style="flex-wrap:wrap">
      ${groupBtn('', tr('shop.section_all'), all)}
      ${groups.map(g => groupBtn(g, groupLabel(g), all.filter(a => a.group === g))).join('')}
      <input class="grow" id="admAchQ" placeholder="${tr('common.filter_placeholder')}" value="${esc(adminState.achQuery)}">
    </div>
    <div id="admAchList"></div>`;

  const listed = () => {
    const q = adminState.achQuery.trim().toLocaleLowerCase();
    return all.filter(a => (!adminState.achGroup || a.group === adminState.achGroup) &&
      (!q || [a.title, a.description, a.key].some(v => v && v.toLocaleLowerCase().includes(q))));
  };
  const reward = () => box.querySelector('#admAchReward').checked;
  const send = async (url, body) => {
    try { await admApi(admUserUrl(userId) + url, admSend(url.endsWith('/bulk') ? 'POST' : 'PUT', body)); admSectionAchievements(box, d); }
    catch (e) { admFail(e); }
  };
  const drawList = () => {
    const list = listed();
    const key = 'admin:achievements:' + userId;
    const page = pageSlice(key, list, 20);
    const el = box.querySelector('#admAchList');
    el.innerHTML = list.length ? `<div class="card">` + page.items.map(a => `
      <div class="row admAchRow" data-key="${esc(a.key)}" style="padding:4px 0">
        <div class="grow">${a.tier ? trophyIcon(a.tier, a.unlocked) : ''} <strong>${esc(a.title)}</strong>
          <div class="muted">${esc(a.description || '')}${a.unlocked_at ? ' · ' + esc(new Date(a.unlocked_at).toLocaleDateString(jsLocale())) : ''}</div></div>
        <button class="${a.unlocked ? 'ghost ' : ''}action admAchToggle">${a.unlocked ? tr('admin.achievement_revoke') : tr('admin.achievement_grant')}</button>
      </div>`).join('') + `</div>` + pagerHtml(key, page.page, page.totalPages)
      : `<div class="card muted">${tr('common.nothing_found')}</div>`;
    wirePager(el, drawList);
    el.querySelectorAll('.admAchRow').forEach(row => {
      const a = all.find(x => x.key === row.dataset.key);
      row.querySelector('.admAchToggle').onclick = () =>
        send('/achievements/' + encodeURIComponent(a.key), { unlocked: !a.unlocked, reward: reward() });
    });
  };
  box.querySelectorAll('.admAchGroup').forEach(btn => {
    btn.onclick = () => { adminState.achGroup = btn.dataset.group; pageState['admin:achievements:' + userId] = 0; admSectionAchievements(box, d); };
  });
  box.querySelector('#admAchQ').oninput = e => { adminState.achQuery = e.target.value; pageState['admin:achievements:' + userId] = 0; drawList(); };
  const bulk = unlocked => {
    const keys = listed().map(a => a.key);
    if (!keys.length) return;
    if (!confirm(tr(unlocked ? 'admin.achievements_grant_confirm' : 'admin.achievements_revoke_confirm',
      { count: keys.length, who: admUserLabel(d.user) }))) return;
    send('/achievements/bulk', { keys, unlocked, reward: reward() });
  };
  box.querySelector('#admAchGrantAll').onclick = () => bulk(true);
  box.querySelector('#admAchRevokeAll').onclick = () => bulk(false);
  drawList();
}

// Raw data: every per-player database table, row by row (backend: the raw
// data editor in api/admin.py). The fallback for everything without its own
// editor - values are only type-checked, so it says so loudly.
const ADM_RAW_PAGE = 50;
async function admSectionRaw(box, d) {
  const userId = d.user.id;
  box.innerHTML = `<div class="card muted">${tr('admin.loading')}</div>`;
  let tables, data;
  try {
    tables = await admApi(admUserUrl(userId) + '/tables');
    if (!tables.some(t => t.table === adminState.rawTable)) {
      adminState.rawTable = (tables.find(t => t.rows) || tables[0] || {}).table || '';
      adminState.rawOffset = 0;
    }
    data = adminState.rawTable && await admApi(admUserUrl(userId) + '/tables/' + encodeURIComponent(adminState.rawTable) +
      `?offset=${adminState.rawOffset}&limit=${ADM_RAW_PAGE}`);
  } catch (e) { box.innerHTML = `<div class="card">${tr('header.error', { message: esc(e.message) })}</div>`; return; }
  if (!box.isConnected) return;
  const tableUrl = admUserUrl(userId) + '/tables/' + encodeURIComponent(adminState.rawTable);
  const redraw = () => admSectionRaw(box, d);
  const editable = data ? data.columns.filter(c => !data.owners.includes(c.name)) : [];
  // Long values (JSON blobs) get a textarea, everything else a one-line input.
  const field = (c, value) => {
    const v = value == null ? '' : String(value);
    const hint = `${c.type || '?'}${c.notnull ? ' · NOT NULL' : ''}${c.pk ? ' · PK' : ''}`;
    const input = v.length > 60 || /^(state|snapshot|detail|conditions|actions|exp_breakdown)$/.test(c.name)
      ? `<textarea class="admRawVal" data-col="${esc(c.name)}" rows="3" style="width:100%">${esc(v)}</textarea>`
      : `<input class="admRawVal" data-col="${esc(c.name)}" value="${esc(v)}" style="width:100%">`;
    return `<label class="muted" style="display:block;margin:4px 0">${esc(c.name)} <small>(${esc(hint)})</small>${input}</label>`;
  };
  const collect = (el, original) => {
    const values = {};
    el.querySelectorAll('.admRawVal').forEach(input => {
      const orig = original ? original[input.dataset.col] : undefined;
      const origStr = orig == null ? '' : String(orig);
      // Only changed fields (an untouched NULL stays NULL); new rows send what's filled in.
      if (original ? input.value !== origStr : input.value !== '') values[input.dataset.col] = input.value;
    });
    return values;
  };
  const summary = row => editable.slice(0, 5).map(c => `${c.name}=${row[c.name] == null ? 'NULL' : String(row[c.name]).slice(0, 30)}`).join(' · ');

  box.innerHTML = `
    <div class="card">
      <h3 style="margin-top:0">${tr('admin.section_raw')}</h3>
      <div class="muted" style="color:var(--warn)">${tr('admin.raw_warning')}</div>
      <div class="row" style="margin-top:8px">
        <select id="admRawTable" class="grow">${tables.map(t => admOpt(t.table, `${t.table} (${t.rows})`, t.table === adminState.rawTable)).join('')}</select>
        <button class="ghost action" id="admRawReload">${tr('common.reload')}</button>
      </div>
    </div>
    ${data ? `
    <div class="card">
      <div class="row">
        <strong class="grow">${tr('admin.raw_rows', { count: data.total })}</strong>
        ${data.fixed ? '' : `<button class="ghost action" id="admRawNew">${tr('admin.raw_add')}</button>`}
      </div>
      <div id="admRawNewForm" class="hidden">${editable.map(c => field(c, null)).join('')}
        <div class="row"><button class="action" id="admRawInsert">${tr('common.save')}</button>
          <span class="muted">${tr('admin.raw_new_hint')}</span></div></div>
    </div>
    ${data.rows.map(row => `
      <div class="card admRawRow" data-rowid="${esc(row._rowid)}">
        <div class="row">
          <div class="grow"><strong>#${esc(row._rowid)}</strong> <span class="muted">${esc(summary(row))}</span></div>
          <button class="ghost action admRawEdit">${tr('common.edit')}</button>
          ${data.fixed ? '' : `<button class="ghost action admRawDelete" style="border-color:var(--accent);color:var(--accent)">${tr('admin.raw_delete')}</button>`}
        </div>
        <div class="admRawEditor hidden"></div>
      </div>`).join('')}
    <div class="row">
      <button class="ghost action" id="admRawPrev"${adminState.rawOffset ? '' : ' disabled'}>‹</button>
      <span class="muted">${data.total ? `${adminState.rawOffset + 1}–${Math.min(data.total, adminState.rawOffset + ADM_RAW_PAGE)} / ${data.total}` : ''}</span>
      <button class="ghost action" id="admRawNext"${adminState.rawOffset + ADM_RAW_PAGE < data.total ? '' : ' disabled'}>›</button>
    </div>` : `<div class="card muted">${tr('admin.empty')}</div>`}`;

  box.querySelector('#admRawTable').onchange = e => { adminState.rawTable = e.target.value; adminState.rawOffset = 0; redraw(); };
  box.querySelector('#admRawReload').onclick = redraw;
  if (!data) return;
  box.querySelector('#admRawPrev').onclick = () => { adminState.rawOffset = Math.max(0, adminState.rawOffset - ADM_RAW_PAGE); redraw(); };
  box.querySelector('#admRawNext').onclick = () => { adminState.rawOffset += ADM_RAW_PAGE; redraw(); };
  const newBtn = box.querySelector('#admRawNew');
  if (newBtn) {
    const form = box.querySelector('#admRawNewForm');
    newBtn.onclick = () => form.classList.toggle('hidden');
    box.querySelector('#admRawInsert').onclick = async () => {
      try { await admApi(tableUrl, admSend('POST', { values: collect(form, null) })); redraw(); }
      catch (e) { admFail(e); }
    };
  }
  box.querySelectorAll('.admRawRow').forEach(card => {
    const row = data.rows.find(r => String(r._rowid) === card.dataset.rowid);
    const url = tableUrl + '/' + encodeURIComponent(row._rowid);
    const editor = card.querySelector('.admRawEditor');
    card.querySelector('.admRawEdit').onclick = () => {
      if (!editor.classList.contains('hidden')) { editor.classList.add('hidden'); return; }
      editor.innerHTML = editable.map(c => field(c, row[c.name])).join('') +
        `<div class="row"><button class="action admRawSave">${tr('common.save')}</button>
          <span class="muted">${tr('admin.raw_edit_hint')}</span></div>`;
      editor.classList.remove('hidden');
      editor.querySelector('.admRawSave').onclick = async () => {
        const values = collect(editor, row);
        if (!Object.keys(values).length) { alert(tr('admin.settings_nothing_changed')); return; }
        try { await admApi(url, admSend('PATCH', { values })); redraw(); }
        catch (e) { admFail(e); }
      };
    };
    const del = card.querySelector('.admRawDelete');
    if (del) del.onclick = async () => {
      if (!confirm(tr('admin.raw_delete_confirm', { table: adminState.rawTable, row: row._rowid, who: admUserLabel(d.user) }))) return;
      try { await admApi(url, { method: 'DELETE' }); redraw(); }
      catch (e) { admFail(e); }
    };
  });
}

// Edit / heal / release for every Pokémon card inside `scope`.
function admWirePokemonCards(scope, d) {
  const meta = adminState.meta;
  const who = admUserLabel(d.user);
  const reload = () => admRenderUser();
  scope.querySelectorAll('.card[data-pid]').forEach(card => {
    const p = d.pokemon.find(x => String(x.id) === card.dataset.pid);
    const url = '/api/admin/pokemon/' + encodeURIComponent(p.id);
    const title = p.nickname || admName(p.species);
    const editor = card.querySelector('.admEditor');

    card.querySelector('.admEdit').onclick = () => {
      if (!editor.classList.contains('hidden')) { editor.classList.add('hidden'); return; }
      editor.innerHTML = admPokemonEditor(p, meta);
      editor.classList.remove('hidden');
      editor.querySelector('.admSave').onclick = async () => {
        const slot = editor.querySelector('.admSlot').value;
        const payload = {
          level: Number(editor.querySelector('.admLv').value),
          nickname: editor.querySelector('.admNick').value,
          nature: editor.querySelector('.admNature').value,
          gender: editor.querySelector('.admGender').value || null,
          shiny: editor.querySelector('.admShinyP').checked,
          party_slot: slot ? Number(slot) : null,
          ivs: Object.fromEntries([...editor.querySelectorAll('.admIv')]
            .map(input => [input.dataset.stat, Number(input.value)]))
        };
        // KP nur mitschicken, wenn sie wirklich geaendert wurden - sonst
        // rechnet der Server den Schaden bei Level-/IV-Aenderung selbst um.
        const hpInput = editor.querySelector('.admHp');
        if (hpInput.value !== hpInput.dataset.orig) payload.current_hp = Number(hpInput.value);
        // EXP only when changed - it overrides the level (the level follows the EXP).
        const expInput = editor.querySelector('.admExp');
        if (expInput.value !== expInput.dataset.orig) payload.exp = Number(expInput.value);
        const speciesInput = editor.querySelector('.admSpeciesId');
        if (speciesInput.value && Number(speciesInput.value) !== p.species_id) payload.species_id = Number(speciesInput.value);
        payload.evs = Object.fromEntries([...editor.querySelectorAll('.admEv')]
          .map(input => [input.dataset.stat, Number(input.value)]));
        payload.ability = editor.querySelector('.admAbility').value || null;
        payload.held_item = editor.querySelector('.admHeld').value || null;
        payload.favorite = editor.querySelector('.admFav').checked;
        payload.locked = editor.querySelector('.admLocked').checked;
        const moves = [...editor.querySelectorAll('.admMove')].map(sel => sel.value).filter(Boolean);
        // Only send moves when the selection changed - [] means "standard moveset".
        if (JSON.stringify(moves) !== JSON.stringify(p.moves || [])) payload.moves = moves;
        try { await admApi(url, admSend('PATCH', payload)); reload(); }
        catch (e) { admFail(e); }
      };
    };
    card.querySelector('.admHeal').onclick = async () => {
      try { await admApi(url, admSend('PATCH', { full_heal: true })); reload(); }
      catch (e) { admFail(e); }
    };
    card.querySelector('.admRelease').onclick = async () => {
      if (!confirm(tr('admin.release_confirm', { title, level: p.level, who }))) return;
      try { await admApi(url, { method: 'DELETE' }); reload(); }
      catch (e) { admFail(e); }
    };
  });
}

// Klartext (fuer textContent) zu Geld + IV-Zuwachs aus /throw bzw. /auto-battle.
function economyNote(r) {
  if (!r) return '';
  const earned = (r.money_earned || 0) + ((r.battle && r.battle.money_earned) || 0);
  const lines = [];
  if (earned) lines.push(`+${fmtMoney(earned)}`);
  (r.iv_gains || []).forEach(g => {
    lines.push(tr('economy.iv_gain', {
      name: g.name, changes: g.changes.map(c => `${ivLabel(c.stat)} ${c.from}→${c.to}`).join(', '),
    }));
  });
  return lines.join('\n');
}

// Bleibt stehen, auch wenn die Warteschlange neu rendert. Klick schliesst.

  refreshMoney();
  const text = economyNote(r);

  let box = document.getElementById('econToast');
  if (!box) {
    box = document.createElement('div');
    box.id = 'econToast';
    box.className = 'card log';
    Object.assign(box.style, {
      position: 'fixed', right: '16px', bottom: '16px', maxWidth: 'min(360px, calc(100vw - 32px))',
      zIndex: '50', cursor: 'pointer', color: 'var(--text)', boxShadow: '0 4px 16px rgba(0,0,0,.35)'
    });

    box.onclick = () => box.remove();

// Feste Bereichs-Reihenfolge fuer Shop UND Beutel; alles, was hier nicht
// steht (z.B. Schluesselitems), haengt danach an, alphabetisch nach Key.
const ITEM_SECTIONS = ['ball', 'medicine', 'tm', 'evolution', 'held', 'mega', 'breeding'];
const sectionRank = cat => {
  const i = ITEM_SECTIONS.indexOf(cat);
  return i < 0 ? ITEM_SECTIONS.length : i;
};

// [[Kategorie, Items], ...] in Bereichs-Reihenfolge, innerhalb nach Preis
// (Items ohne Preis ans Ende, dann alphabetisch).
function groupByCategory(items) {
  const groups = new Map();
  items.forEach(it => {
    const cat = it.category || 'other';
    if (!groups.has(cat)) groups.set(cat, []);
    groups.get(cat).push(it);
  });
  const byPrice = (a, b) =>
    (a.price ?? Infinity) - (b.price ?? Infinity) || pick(a, 'label').localeCompare(pick(b, 'label'));
  return [...groups.entries()]
    .sort((a, b) => sectionRank(a[0]) - sectionRank(b[0]) || a[0].localeCompare(b[0]))
    .map(([cat, list]) => [cat, list.slice().sort(byPrice)]);
}

// Schnellfilter ueber den Bereichen. `active` = '' bedeutet "alle".
function sectionFilterHtml(groups, active) {
  const btn = (value, label, count) =>
    `<button class="ghost action secBtn${value === active ? ' active' : ''}" data-section="${esc(value)}">${
      esc(label)}${count === undefined ? '' : ` (${count})`}</button>`;
  return `<div class="card row span-all" style="flex-wrap:wrap">
    <span class="muted">${tr('shop.section')}</span>
    ${btn('', tr('shop.section_all'))}
    ${groups.map(([cat, list]) => btn(cat, itemCategoryLabel(cat), list.length)).join('')}
  </div>`;
}

let shopSection = '';
let shopTmType = '';
let bagSection = '';

// -------------------------------------------------------------- Seitenweise
// Generischer Pager fuer alle Listen, die mit der Zeit lang werden koennen
// (Warteschlange, Shop/Beutel je Bereich, Erfolge/Liga je Region, Admin-Listen
// je Nutzer). Bewusst NICHT fuer Dex/AttackDex verwendet - die haben eigene
// Filter/Suche und ein Grid-Layout statt Karten je Eintrag.
// `key` identifiziert die einzelne Liste (z.B. `shop:ball`), damit mehrere
// Listen auf derselben Seite unabhaengig voneinander blaettern.
// Auf breiten Bildschirmen (gleicher Breakpoint wie das Desktop-Layout im CSS)
// wird nicht geblaettert: pageSlice() liefert dann die ganze Liste und
// pagerHtml() bleibt leer. Nur die serverseitig geblaetterte Historie behaelt
// den Pager immer (siehe renderHistory), weil sie tausende Eintraege hat.
const PAGE_SIZE = 10;
const pageState = {};
const widePaging = window.matchMedia('(min-width: 900px)');

function pageSlice(key, items, pageSize = PAGE_SIZE) {
  if (widePaging.matches) return { items, page: 0, totalPages: 1 };
  const totalPages = Math.max(1, Math.ceil(items.length / pageSize));
  const page = Math.min(Math.max(pageState[key] || 0, 0), totalPages - 1);
  pageState[key] = page;
  return { items: items.slice(page * pageSize, page * pageSize + pageSize), page, totalPages };
}

// Fenster wird ueber den Breakpoint hinweg vergroessert/gedreht: aktuelle Seite
// neu zeichnen, damit Pager erscheinen bzw. verschwinden.
widePaging.addEventListener('change', () => render(currentTab));

function pagerHtml(key, page, totalPages) {
  if (totalPages <= 1) return '';
  return `<div class="row pager" style="justify-content:center;margin:10px 0">
    <button class="ghost action pagerBtn" data-key="${esc(key)}" data-dir="-1" ${page <= 0 ? 'disabled' : ''}>${tr('common.prev')}</button>
    <span class="muted">${tr('common.page_of', { page: page + 1, total: totalPages })}</span>
    <button class="ghost action pagerBtn" data-key="${esc(key)}" data-dir="1" ${page >= totalPages - 1 ? 'disabled' : ''}>${tr('common.next')}</button>
  </div>`;
}

// `rerender` erzeugt die Liste neu (meist derselbe `render('<tab>')`-Aufruf,
// den auch Bereichs-Filter benutzen) - der Pager selbst haelt keinen State
// ausser der Seitenzahl in `pageState`.
function wirePager(el, rerender) {
  el.querySelectorAll('.pagerBtn').forEach(btn => {
    btn.onclick = () => {
      pageState[btn.dataset.key] = (pageState[btn.dataset.key] || 0) + Number(btn.dataset.dir);
      rerender();
    };
  });
}

function wireSectionFilter(el, set) {
  el.querySelectorAll('.secBtn').forEach(btn => {
    btn.onclick = () => set(btn.dataset.section);
  });
}

async function renderShop() {
  const el = $('#tab-shop');
  const shop = await api('/api/shop');
  const groups = groupByCategory(shop.items);
  const shown = groups.filter(([cat]) => !shopSection || cat === shopSection);
  el.innerHTML = `
    <div class="card row span-all">

      <div class="muted">${tr('shop.money_hint')}</div>

    sectionFilterHtml(groups, shopSection) +
    shown.map(([cat, allItems]) => {
      const isTm = cat === 'tm';
      const items = isTm && shopTmType ? allItems.filter(it => it.move_type === shopTmType) : allItems;
      const pagerKey = 'shop:' + cat + (isTm ? ':' + shopTmType : '');
      const { items: page, page: pageNo, totalPages } = pageSlice(pagerKey, items);
      return `
      <h3>${esc(itemCategoryLabel(cat))}</h3>
      ${isTm ? `<div class="atk-type-bar" style="margin-bottom:8px">${TYPES.map(k =>
        `<button class="atk-type-btn${shopTmType === k ? ' active' : ''}" data-tmtype="${esc(k)}" title="${esc(typeLabel(k))}" aria-label="${esc(typeLabel(k))}">${typePill(k)}</button>`).join('')}</div>` : ''}
      ${items.length ? '' : `<div class="card muted">${tr('shop.tm_none_match_type')}</div>`}
      ${page.map(it => `<div class="card row" data-item="${esc(it.key)}">
        ${it.sprite_url ? `<img class="item-icon itemInfoTrigger" style="cursor:pointer" src="${esc(it.sprite_url)}" alt="" onerror="this.style.display='none'">` : ''}
        <div class="grow">
          <strong class="itemInfoTrigger" style="cursor:pointer">${esc(pick(it, 'label'))}</strong> <span class="pill">${esc(fmtMoney(it.price))}</span>
          <div class="muted">${esc(pick(it, 'description'))}</div>
          <div class="muted">${tr('shop.in_bag', { count: it.owned })}${it.usable_count

        </div>
        <input type="number" class="shopQty" min="1" max="99" value="1" style="width:70px" aria-label="${tr('shop.quantity')}">
        <button class="action shopBuy" ${it.price > shop.money ? 'disabled' : ''}>${tr('shop.buy')}</button>
        <span class="log shopResult"></span>
      </div>`).join('')}
      ${pagerHtml(pagerKey, pageNo, totalPages)}`;
    }).join('');

  wireSectionFilter(el, section => { shopSection = section; render('shop'); });
  el.querySelectorAll('[data-tmtype]').forEach(b => b.onclick = () => {
    shopTmType = shopTmType === b.dataset.tmtype ? '' : b.dataset.tmtype;
    render('shop');
  });
  wirePager(el, () => render('shop'));
  el.querySelectorAll('.card[data-item]').forEach(card => {
    const it = shop.items.find(x => x.key === card.dataset.item);
    card.querySelectorAll('.itemInfoTrigger').forEach(trigger => {
      trigger.onclick = () => openItemInfo(it);
    });
    const btn = card.querySelector('.shopBuy');
    btn.onclick = async () => {
      const quantity = parseInt(card.querySelector('.shopQty').value, 10) || 1;
      btn.disabled = true;
      try {
        await api('/api/shop/buy', {
          method: 'POST', body: JSON.stringify({ item_key: card.dataset.item, quantity })
        });
        refreshMoney();
        render('shop');
      } catch (e) {
        card.querySelector('.shopResult').textContent = e.message;
        btn.disabled = false;
      }
    };
  });
}

        <div class="row">
          ${it.sprite_url ? `<img class="item-icon itemInfoTrigger" style="cursor:pointer" src="${esc(it.sprite_url)}" alt="" onerror="this.style.display='none'">` : ''}
          <div class="grow">
          <strong class="itemInfoTrigger" style="cursor:pointer">${esc(pick(it, 'label'))}</strong> <span class="pill">× ${esc(it.quantity)}</span>
          ${it.description ? `<div class="muted">${esc(pick(it, 'description'))}</div>` : ''}
        </div></div>
        ${use}
        <div class="log bagResult"></div>
      </div>`;
    }).join('')}
    ${pagerHtml('bag:' + cat, pageNo, totalPages)}`;
  }).join('');

  wireSectionFilter(el, section => { bagSection = section; render('bag'); });
  wirePager(el, () => render('bag'));
  el.querySelectorAll('.card[data-item]').forEach(card => {
    const it = bag.items.find(x => x.key === card.dataset.item);
    card.querySelectorAll('.itemInfoTrigger').forEach(trigger => {
      trigger.onclick = () => openItemInfo(it);
    });
    const btn = card.querySelector('.bagUse');
    if (!btn) return;
    const qtyInput = card.querySelector('.bagQty');
    const maxBtn = card.querySelector('.bagMax');
    if (maxBtn) maxBtn.onclick = () => {
      if (it.category === 'vitamin') {
        // EV items: the server stops consuming as soon as the stat/total cap
        // is reached, so the whole stack is always a safe amount to offer.
        qtyInput.value = it.quantity;
        return;
      }
      // Rare Candy: as many as the chosen Pokémon can still use (up to level 100).
      const target = it.targets.find(t => String(t.owned_id) === card.querySelector('.bagTarget').value);
      qtyInput.value = Math.max(1, Math.min(it.quantity, target ? 100 - target.level : 1));
    };
    btn.onclick = async () => {
      const ownedId = card.querySelector('.bagTarget').value;
      const quantity = qtyInput ? Math.max(1, parseInt(qtyInput.value, 10) || 1) : 1;
      const out = card.querySelector('.bagResult');
      btn.disabled = true;
      try {
        const r = await api(`/api/pokemon/${encodeURIComponent(ownedId)}/use-item`, {
          method: 'POST', body: JSON.stringify({ item_key: card.dataset.item, quantity })
        });
        // Heil-Items (app/medicine.py) liefern ihre Meldung fertig lokalisiert.
        out.textContent = r.message !== undefined ? r.message : tr('bag.evolved', {
          name: r.nickname || r.from.name, to: r.to.name, hp: r.current_hp, max: r.max_hp,
        });
        setTimeout(() => render('bag'), r.message !== undefined ? 1500 : 2500);
      } catch (e) {
        out.textContent = e.message;
        btn.disabled = false;
      }
    };
  });
}

function typeEffectiveness(attackType, defenderTypes) {
  const row = TYPE_CHART[attackType] || {};
  return (defenderTypes || []).filter(Boolean).reduce((mult, t) => mult * (row[t] ?? 1), 1);
}

// Groups all 18 types into "weak against" / "resists" / "immune to" for a
// given defending typing - used in the Pokémon summary and the battle
// enemy popup (clicking the opponent).
function typeMatchupHtml(defenderTypes) {
  const rows = TYPES.map(atk => ({ atk, mult: typeEffectiveness(atk, defenderTypes) }));
  const weak = rows.filter(r => r.mult > 1).sort((a, b) => b.mult - a.mult);
  const resist = rows.filter(r => r.mult > 0 && r.mult < 1).sort((a, b) => a.mult - b.mult);
  const immune = rows.filter(r => r.mult === 0);
  const group = (label, list) => list.length ? `<div class="type-matchup-group">
      <div class="muted">${esc(label)}</div>
      <div class="type-matchup-row">${list.map(r =>
        `<span class="type-mult">${typePill(r.atk)}×${fmtMult(r.mult)}</span>`).join('')}</div>
    </div>` : '';
  return group(tr('type_matchup.weak_to'), weak) + group(tr('type_matchup.resists'), resist) + group(tr('type_matchup.immune_to'), immune)
    || `<span class="muted">${tr('type_matchup.neutral')}</span>`;
}

// Small icon next to a damaging move in battle, showing at a glance whether
// it's super effective / not very effective / has no effect on the current
// opponent - the type chart alone isn't obvious mid-battle.
function moveEffectivenessBadge(move, defenderTypes) {
  if (move.power == null) return '';
  const mult = typeEffectiveness(move.type, defenderTypes);
  if (mult === 0) return `<span class="eff-badge eff-none" title="${esc(tr('battle.effect_none'))}">⦸</span>`;
  if (mult > 1) return `<span class="eff-badge eff-super" title="${esc(tr('battle.effect_super'))}">▲</span>`;
  if (mult < 1) return `<span class="eff-badge eff-weak" title="${esc(tr('battle.effect_weak'))}">▼</span>`;
  return '';
}
const ivLabel = k => tr('iv.' + k) || k;
const categoryLabel = c => tr('category.' + c) || c;
const statusLabel = s => tr('status.' + s) || s;

const typeColor = t => TYPE_COLOR[t] || 'var(--line)';
// Icon instead of a coloured text pill: the type plate from the games. The
// alt text keeps the type readable if the image is missing.
const typeIconUrl = t => `${BASE}/static/img/types/${encodeURIComponent(t)}.png`;
const typePill = t => t
  ? `<img class="type-icon" src="${typeIconUrl(t)}" alt="${esc(typeLabel(t))}" title="${esc(typeLabel(t))}">`
  : '';
const statusPill = status => status
  ? `<span class="pill status-pill status-${esc(status)}" title="${esc(statusLabel(status))}">${esc(statusLabel(status))}</span>`
  : '';
// Stat stages of a fighter ({atk: 2, spe: -1}, only non-zero ones are sent) as
// coloured pills; the tooltip names the stat and the resulting multiplier.
const STAT_STAGE_ORDER = ['atk', 'def', 'spa', 'spd', 'spe'];
const statStageMultiplier = n => Math.round((n >= 0 ? (2 + n) / 2 : 2 / (2 - n)) * 100) / 100;
const statStagePills = stages => STAT_STAGE_ORDER
  .filter(k => stages && stages[k])
  .map(k => {
    const n = stages[k];
    const text = `${ivLabel(k)} ${n > 0 ? '+' : ''}${n}`;
    const title = tr('battle.stat_stage_title', { stat: ivLabel(k), stages: (n > 0 ? '+' : '') + n, multiplier: statStageMultiplier(n) });
    return `<span class="pill stage-pill ${n > 0 ? 'stage-up' : 'stage-down'}" title="${esc(title)}">${esc(text)}</span>`;
  }).join('');
// Faehigkeit: read-only (keine Auswahl - Faehigkeiten sind pro Individuum
// fix), Beschreibung als Tooltip (Hover) und - da Tooltips auf Touch-Geraeten
// nicht funktionieren - zusaetzlich per Klick als kleines Fenster (openAbilityInfo).
// Abilities without a battle effect carry `inactive` (why they do nothing here,
// see abilities.describe) - shown below the description.
const abilityDescription = info => pick(info, 'description') || tr('battle.ability_no_effect');
const abilityInactiveNote = info => (info && info.inactive ? tr('ability.inactive.' + info.inactive) : '');
const abilityPill = info => info
  ? `<span class="pill ability-pill" style="cursor:pointer" title="${esc([abilityDescription(info), abilityInactiveNote(info)].filter(Boolean).join('\n'))}">${esc(localizedName(info))}</span>`
  : '';
// Aktive Mega-/Proto-Form eines Kaempfers (Name/Sprite kommen schon aus der
// Form, siehe app/mega.py) - die Pille macht den Formwechsel sichtbar.
const megaPill = mon => mon && mon.mega_info
  ? `<span class="pill" style="background:var(--accent);color:#fff" title="${esc(localizedName(mon.mega_info))}">${tr('battle.mega_pill')}</span>`
  : '';
const hpBar = (cur, max, wide) => {
  const pct = max ? Math.max(0, Math.min(100, Math.round(100 * cur / max))) : 0;
  const color = pct > 50 ? 'var(--ok)' : pct > 20 ? '#e8b923' : 'var(--accent)';
  return `<div class="hp${wide ? ' hp-wide' : ''}" title="${esc(cur)}/${esc(max)} HP">` +
    `<span style="width:${pct}%;background:${color}"></span></div>`;
};
// PokeAPI-Sprites: Rueckansicht liegt unter /back/ (Fallback auf Frontansicht per onerror).
const backSprite = url => String(url || '').replace('/sprites/pokemon/', '/sprites/pokemon/back/');
const moveStatusNote = m => m.status
  ? ` · ${m.status_chance >= 100 ? '' : m.status_chance + '% '}${statusLabel(m.status)}`
  : '';
const moveInfo = m => `${typeLabel(m.type)} · ${m.power == null ? tr('move.no_damage') : tr('move.power', { power: m.power })} · ` +
  `${m.accuracy == null ? tr('move.always_hits') : tr('move.accuracy', { accuracy: m.accuracy })} · ${categoryLabel(m.category)}` +
  moveStatusNote(m);

// Second line on the battle move buttons: stat changes / healing (the details
// the first line has no room for), so the effect of e.g. Swords Dance is visible.
const moveEffectsLine = m => {
  const parts = [moveStatChangesInfo(m), moveHealInfo(m)].filter(Boolean);
  return parts.length ? `<small>${esc(parts.join(' · '))}</small>` : '';
};

async function openBattleConfirm(startFn, opponentFn, persistParty = true) {
  try {
    const current = await api('/api/battles/current');
    if (current.battle) { battleMenu = 'moves'; showBattle(current.battle); return; }
    const [t, bag] = await Promise.all([api('/api/team'), api('/api/bag')]);

    battleConfirmPersistParty = persistParty;
    battleConfirmOpponent = null;

    battleConfirmBag = bag.items.filter(it => it.category === 'medicine' && it.targets.length);

    renderBattleConfirm();
  } catch (e) { alert(e.message); }
}

          <strong>${tr('battle.confirm_opponent')}: ${esc(battleConfirmOpponent.name)}</strong>
          ${pvpTeamHtml(battleConfirmOpponent.team)}</div>` : ''}
        <div class="muted">${tr('battle.confirm_team_hint')}</div>
        <div class="muted">${tr('battle.confirm_heal_hint')}</div>
        ${battleConfirmAutoHeal && battleConfirmAutoHeal.auto_heal ? `<div class="card row">
          <div class="grow"><strong>${tr('team.auto_heal')}</strong>
            <div class="muted">${autoHealPlan ? tr('team.auto_heal_needs', { items: esc(autoHealPlan.items_text) }) : tr('team.auto_heal_nothing')}</div></div>
          <button class="ghost action" id="bConfirmAutoHeal" ${autoHealPlan ? '' : 'disabled'}>${tr('team.auto_heal')}</button>
        </div>` : ''}
        ${party.length ? party.map((p, i) => battleConfirmCard(p, i, party.length)).join('')
          : `<div class="card muted">${tr('team.no_pokemon_in_team')}</div>`}
        <div class="row" style="margin-top:10px">
          <button class="action grow" id="bConfirmFight" ${party.length ? '' : 'disabled'}>${tr('battle.confirm_fight')}</button>
        </div>
      </div>
    </div>`;
  el.querySelectorAll('.bConfirmUp').forEach(btn => { btn.onclick = () => moveBattleConfirm(Number(btn.dataset.id), -1); });
  el.querySelectorAll('.bConfirmDown').forEach(btn => { btn.onclick = () => moveBattleConfirm(Number(btn.dataset.id), 1); });
  el.querySelectorAll('.bConfirmHealUse').forEach(btn => {
    btn.onclick = async () => {
      const id = Number(btn.dataset.id);
      const select = el.querySelector(`.bConfirmHealPick[data-id="${id}"]`);
      btn.disabled = true;
      try {
        await api(`/api/pokemon/${id}/use-item`, { method: 'POST', body: JSON.stringify({ item_key: select.value }) });
        await refreshBattleConfirmHealing();
      } catch (e) { alert(e.message); btn.disabled = false; }
    };
  });
  if ($('#bConfirmAutoHeal')) $('#bConfirmAutoHeal').onclick = async () => {
    try {
      const r = await api('/api/team/auto-heal', { method: 'POST' });
      alert(r.message);
      await refreshBattleConfirmHealing();
    } catch (e) { alert(e.message); }
  };
  $('#bConfirmCancel').onclick = closeBattleConfirm;
  $('#bConfirmFight').onclick = runBattleConfirmStart;
  $('#bConfirmPickTeam').onclick = openBattleConfirmPicker;
}

function moveBattleConfirm(id, delta) {
  const order = battleConfirmParty;
  const i = order.findIndex(p => p.id === id);
  const j = i + delta;
  if (i < 0 || j < 0 || j >= order.length) return;
  [order[i], order[j]] = [order[j], order[i]];
  renderBattleConfirm();
}

// Box picker: pick this fight's whole lineup from team + box instead of just
// reordering the current party (a gym/league trainer or PvP opponent often
// needs different members than whatever the party happens to be). Starts
// with nothing ticked (not the current party) so the player can build the
// lineup from scratch instead of having to untick every current member
// first. Applying only updates the local `battleConfirmParty` - the real
// swap only happens via PUT /api/team/party when the player actually starts
// the fight (runBattleConfirmStart), same as plain reordering.
function openBattleConfirmPicker() {
  battleConfirmSelected.clear();
  battleConfirmRoster = [...battleConfirmParty, ...battleConfirmBox];
  battleConfirmPicker = true;
  renderBattleConfirm();
}

function applyBattleConfirmPicker() {
  const kept = battleConfirmParty.filter(p => battleConfirmSelected.has(p.id));
  const added = battleConfirmRoster.filter(p =>
    battleConfirmSelected.has(p.id) && !kept.some(x => x.id === p.id));
  battleConfirmParty = [...kept, ...added];
  battleConfirmPicker = false;
  renderBattleConfirm();
}

function renderBattleConfirmPickerScreen() {
  const el = $('#battleOverlay');
  const shown = boxSorted(battleConfirmRoster.filter(p => boxFilterMatches(p, battleConfirmPickView)), battleConfirmPickView);
  el.innerHTML = `
    <div class="battle">
      <div class="row">
        <strong class="grow">${tr('battle.pick_team_title')}</strong>
        <span class="muted">${battleConfirmSelected.size}/${battleConfirmPartySize}</span>
        <button class="ghost action" id="bPickCancel">${tr('battle.confirm_cancel')}</button>
      </div>
      <div class="battle-confirm">
        <div class="muted">${tr('battle.pick_team_hint', { max: battleConfirmPartySize })}</div>
        <div class="row card">
          ${boxFilterControlsHtml(battleConfirmPickView, 'bcp', { search: true })}
          <span class="muted">${shown.length}/${battleConfirmRoster.length}</span>
        </div>
        ${shown.length ? `<div class="box-grid">${shown.map(p => boxSlotHtml(p, true, battleConfirmSelected)).join('')}</div>`
          : `<div class="card muted">${tr('team.box_none_match')}</div>`}
        <div class="row" style="margin-top:10px">
          <button class="action grow" id="bPickApply" ${battleConfirmSelected.size ? '' : 'disabled'}>${tr('battle.pick_team_apply')}</button>
        </div>
      </div>
    </div>`;
  wireBoxFilters(el, battleConfirmPickView, 'bcp', renderBattleConfirmPickerScreen);
  $('#bPickCancel').onclick = () => { battleConfirmPicker = false; renderBattleConfirm(); };
  $('#bPickApply').onclick = applyBattleConfirmPicker;
  el.querySelectorAll('.box-slot[data-id]').forEach(slot => {
    slot.onclick = () => {
      const id = Number(slot.dataset.id);
      if (battleConfirmSelected.has(id)) {
        battleConfirmSelected.delete(id);
      } else {
        if (battleConfirmSelected.size >= battleConfirmPartySize) return;
        battleConfirmSelected.add(id);
      }
      renderBattleConfirmPickerScreen();
    };
    // See the matching comment in renderTeam(): the checkbox also needs its
    // own handler so a tap landing on it isn't swallowed before it bubbles.
    const sel = slot.querySelector('.box-sel');
    if (sel) sel.onclick = event => { event.preventDefault(); event.stopPropagation(); slot.onclick(); };
  });
}

async function runBattleConfirmStart() {
  if (battleBusy) return;
  battleBusy = true;
  try {
    const order = battleConfirmParty.map(p => p.id);
    if (battleConfirmPersistParty) await api('/api/team/party', { method: 'PUT', body: JSON.stringify({ order }) });
    const v = await battleConfirmStart(order);
    battleConfirmParty = null;
    battleConfirmStart = null;
    battleMenu = 'moves';
    showBattle(v);
  } catch (e) { alert(e.message); }
  battleBusy = false;
}

// Nach dem Laden: laufenden eigenen Kampf direkt wieder oeffnen.
async function resumeBattle() {
  try {
    const r = await api('/api/battles/current');
    if (r.battle) showBattle(r.battle);
  } catch (e) { /* App bleibt ohne Kampf nutzbar */ }
}

function showBattle(v) {
  battleState = v;
  battleError = '';
  $('#battleResume').classList.add('hidden');
  $('#battleOverlay').classList.remove('hidden');
  document.body.classList.add('no-scroll');
  renderBattle();
}

function hideBattle(finished) {
  $('#battleOverlay').classList.add('hidden');
  document.body.classList.remove('no-scroll');
  // Kampf nur minimiert -> schwebender Knopf zum Fortsetzen.
  $('#battleResume').classList.toggle('hidden', !!finished);
  if (finished) battleState = null;
  refreshStatus();
  rerenderActiveTab();
}

$('#battleResume').onclick = () => {
  if (battleState) showBattle(battleState); else resumeBattle();
};

function battleResultText(v) {
  if (isPvpBattle(v) && v.challenge) {
    if (v.outcome === 'won') {
      const reward = v.result && v.result.reward;
      return tr('challenge.battle_won', { name: v.opponent.name }) +
        (reward ? ' ' + tr('challenge.battle_reward', { money: fmtMoney(reward.money_earned), items: reward.label }) : '');
    }
    return tr('challenge.battle_lost', { name: v.opponent.name });
  }
  if (isPvpBattle(v)) {
    const name = v.opponent.name;
    if (v.outcome === 'won') return tr('battle.pvp_won', { name });
    const gotExp = v.result && Object.keys(v.result.exp || {}).length;
    return tr('battle.pvp_lost', { name }) +
      (gotExp ? ' ' + tr('battle.lost_still_got_exp') : '') + ' ' + tr('battle.heal_and_retry');
  }
  if (isTrainerBattle(v)) {
    const trainerInfo = v.trainer;
    if (v.outcome === 'won') {
      const ach = ((v.result && v.result.achievements) || []).map(a => a.title);
      return tr('battle.trainer_won', { title: trainerInfo.title, name: trainerInfo.name }) +
        (ach.length ? ' ' + tr('battle.new_achievements', { list: ach.join(', ') }) : '');
    }
    const gotExp = v.result && Object.keys(v.result.exp || {}).length;
    return tr('battle.trainer_lost', { title: trainerInfo.title, name: trainerInfo.name }) +
      (gotExp ? ' ' + tr('battle.lost_still_got_exp') : '') + ' ' + tr('battle.heal_and_retry');
  }
  const name = v.wild.name;
  switch (v.outcome) {
    case 'won': return tr('battle.wild_won', { name });
    case 'caught': return tr('battle.wild_caught', { name });
    case 'lost': return tr('battle.wild_lost', { name });
    case 'ran': return tr('battle.wild_ran', { name });
    case 'fled': return tr('battle.wild_escaped', { name });
    default: return tr('battle.over');
  }
}

// Mega-Steine passen immer nur zu einer Art (app/mega.py). Im Pokémon-Menue
// steht daher, welche Form dieses Pokémon erreichen kann - mit angelegtem
// Stein als Pille, sonst als Hinweis, welcher Stein dazu passt.

      tr('team.mega_ready', { form: esc(localizedName(p.mega_form)) })}</span></div>`;

// Mega-Entwicklung (app/mega.py): freiwillig, kostet die Runde nicht und
// geht nur einmal pro Kampf - der Knopf steht deshalb ueber den Attacken.
function megaButtonHtml(v) {

function battleActionsHtml(v, me) {
  if (v.over) {
    // Nach einem gewonnenen Arena-/Liga-Kampf kann derselbe Trainer direkt erneut herausgefordert werden.
    const refight = v.kind === 'trainer' && v.outcome === 'won'
      ? ` <button class="ghost action" id="bRefight">${tr('battle.refight')}</button>` : '';
    return `<div class="card"><strong>${esc(battleResultText(v))}</strong>
      <div style="margin-top:10px"><button class="action" id="bClose">${tr('common.close')}</button>${refight}</div></div>`;
  }
  const trainer = isTrainerBattle(v);
  const runLabel = trainer ? tr('battle.give_up') : tr('battle.flee');
  const menu = v.needs_switch ? 'switch' : battleMenu;
  const menus = [['moves', tr('battle.moves')], ['switch', tr('battle.pokemon')], ['bag', tr('nav.bag')]];
  const shiftHint = v.shift_offer && !v.needs_switch ? `<div class="muted" style="margin-top:8px">${tr('battle.shift_offer')}</div>` : '';
  const tabs = v.needs_switch
    ? `<div class="muted" style="margin-bottom:8px">${tr('battle.needs_switch', { name: esc(me.name), action: trainer ? tr('battle.give_up_lower') : tr('battle.flee_lower') })}</div>`
    : `<div class="battle-menu">
        ${menus.map(([k, label]) =>
          `<button class="ghost action bMenu${menu === k ? ' active' : ''}" data-menu="${k}">${label}</button>`).join('')}
        <button class="ghost action" id="bRun">${runLabel}</button>
      </div>`;

  let body = '';
  if (menu === 'moves') {
    const defenderTypes = v.wild.types || [];
    body = megaButtonHtml(v) + `<div class="move-grid">${me.moves.map(m => `
      <button class="move-btn bMove" data-move="${esc(m.key)}" ${m.usable ? '' : 'disabled'}
        style="border-left-color:${typeColor(m.type)}" title="${esc(m.name)}">
        <strong>${esc(localizedName(m))}${moveEffectivenessBadge(m, defenderTypes)}</strong>
        <small>${esc(moveInfo(m))}</small>
        ${moveEffectsLine(m)}
      </button>`).join('')}</div>
      ${me.choice_lock ? `<div class="muted" style="margin-top:6px">${tr('battle.choice_lock_hint')}</div>` : ''}`;
  } else if (menu === 'switch') {
    body = v.team.map(m => `
      <div class="row" style="padding:6px 0;border-top:1px solid var(--line)">
        ${m.sprite_url ? `<img class="sprite" style="width:58px;height:58px" src="${esc(m.sprite_url)}" alt="">` : ''}
        <div class="grow"><strong>${esc(m.name)}</strong> <span class="muted">${esc(lvLabel(m))}</span> ${statusPill(m.status)}
          ${hpBar(m.current_hp, m.max_hp)}<span class="muted">${esc(m.current_hp)}/${esc(m.max_hp)} HP</span></div>
        <button class="ghost action bSwitch" data-target="${esc(m.owned_id)}"
          ${m.active || m.fainted ? 'disabled' : ''}>${m.fainted ? tr('battle.fainted') : m.active ? tr('battle.in_battle') : tr('battle.switch_in')}</button>
      </div>`).join('') + (v.needs_switch ? '' : `<div class="muted">${tr(v.shift_offer ? 'battle.switch_free_shift' : 'battle.switch_costs_turn')}</div>`);
    if (v.needs_switch) body += `<div style="margin-top:8px"><button class="ghost action" id="bRun">${runLabel}</button></div>`;
  } else {
    if (!trainer) {
      const balls = v.balls.filter(b => b.count > 0);
      const notes = [];
      if (!v.wild.catchable) notes.push(tr('battle.leveled_uncatchable'));
      body = (notes.length ? `<div class="muted" style="margin-bottom:8px">${notes.map(esc).join('<br>')}</div>` : '') +
        (balls.length ? `<div class="row">${balls.map(b => `
          <button class="ghost action bBall${b.boosted ? ' boosted' : ''}" data-ball="${esc(b.key)}"
            ${b.boosted ? `title="${esc(tr('battle.ball_boosted', { multiplier: fmtMult(b.multiplier) }))}"` : ''}>
            ${b.boosted ? '★ ' : ''}${esc(pick(b, 'label'))} (${esc(b.count)})${b.boosted ? ` <span class="boost">×${esc(fmtMult(b.multiplier))}</span>` : ''}</button>`).join('')}</div>`
          : `<div class="muted">${tr('battle.no_balls')}</div>`);
    }
    body += battleMedicineHtml(v);
  }
  return tabs + body + shiftHint;
}

// Sprite animation classes for this render, derived by diffing against the
// last render of the same battle (battleAnimSnapshot). Menu clicks re-render
// without changing v, so they naturally get no classes (nothing to diff).
function battleSpriteAnimClasses(v, w, me) {
  const none = { wild: '', own: '' };
  if (currentAnimationSpeed === 'off') return none;
  // Distinguishes consecutive opponents that happen to share name+level
  // (e.g. two Lv5 Rattata on the same trainer team).
  const wildSlot = isTrainerBattle(v) && v.opponents ? v.opponents.filter(o => o.fainted).length : 0;
  const wildKey = `${wildSlot}|${w.name}|${w.level}`;
  const ownKey = me.owned_id != null ? String(me.owned_id) : `${me.name}|${me.level}`;
  const prev = battleAnimSnapshot && battleAnimSnapshot.battleId === v.id ? battleAnimSnapshot : null;
  battleAnimSnapshot = { battleId: v.id, wildKey, wildHp: w.current_hp, ownKey, ownHp: me.current_hp };
  const classFor = (key, hp, prevKey, prevHp) => {
    if (!prev || prevKey !== key) return 'anim-enter';
    if (hp <= 0 && prevHp > 0) return 'anim-faint';
    if (hp < prevHp) return 'anim-hit';
    return '';
  };
  return {
    wild: classFor(wildKey, w.current_hp, prev && prev.wildKey, prev && prev.wildHp),
    own: classFor(ownKey, me.current_hp, prev && prev.ownKey, prev && prev.ownHp),
  };
}

function renderBattle() {
  const v = battleState;
  if (!v) return;
  const w = v.wild;

          opponent: esc(isTrainerBattle(v) ? battleOpponentName(v) : w.name), turn: esc(v.turn),

            <div>${statStagePills(w.stat_stages)}</div>
            ${hpBar(w.current_hp, w.max_hp, true)}
            ${isTrainerBattle(v)
              ? `<div class="opp-balls" title="${tr('battle.opponent_pokemon', { name: esc(isPvpBattle(v) ? v.opponent.name : v.trainer.name) })}">${v.opponents.map(o =>
                  `<span class="${o.fainted ? 'down' : ''}"></span>`).join('')}</div>`
