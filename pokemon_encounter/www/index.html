<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PokeHOAS</title>
<style>
  /* Design: modelled on the Pokédex / Game Boy Color menus (see the
     css-pokemon-gameboy and NES.css frameworks) - flat panels with solid
     "ink" borders and hard offset shadows, a red device header, uppercase
     menu labels and a double-framed text box for battle logs. No gradients,
     glows or emoji decoration. */
  :root {
    --bg: #121418; --panel: #1c1f25; --panel-2: #252932; --line: #343a46;
    --ink: #07080a; --text: #ece7da; --muted: #9da3ad;
    --accent: #e3350d; --accent-ink: #fff; --ok: #3aa864; --warn: #e5b420; --info: #4d86d9;
    --gold: #e5b420; --radius: 6px; --shadow: 3px 3px 0 var(--ink);
    --mono: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #efe9da; --panel: #fffdf6; --panel-2: #f5efe0; --line: #d8cfb9;
      --ink: #23262e; --text: #1d2027; --muted: #6a675e; --gold: #b8860b;
      --shadow: 3px 3px 0 var(--line);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-variant-numeric: tabular-nums;
  }
  h2, h3 { letter-spacing: .01em; }
  h2 { font-size: 20px; }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  a { color: var(--info); }
  ::selection { background: var(--accent); color: var(--accent-ink); }
  :focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }

  /* Device header: the red top shell of a Pokédex. */
  header {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 16px; background: var(--accent); color: var(--accent-ink);
    border-bottom: 3px solid var(--ink);
  }
  header h1 { margin: 0; display: flex; align-items: center; }
  /* Wordmark banner (www/img/banner.svg, src set from BASE in the script). */
  header h1 img { height: 40px; width: auto; display: block; }
  header .grow { flex: 1; }
  header select, header button.ghost {
    background: rgba(0,0,0,.18); color: #fff; border: 2px solid rgba(0,0,0,.35); box-shadow: none;
  }
  header button.ghost:hover { background: rgba(0,0,0,.3); }
  header .pill { background: #fff; color: #1d2027; border: 2px solid var(--ink); font-weight: 700; }
  #langPick { font-size: 13px; padding: 4px 8px; }
  .status { color: var(--muted); font-size: 13px; }
  header .status { color: rgba(255,255,255,.85); }

  /* Language picker: globe button, the native select is invisible on top of it. */
  header { position: relative; }
  .langwrap { position: relative; display: inline-flex; align-items: center; justify-content: center;
    width: 38px; height: 34px; background: rgba(0,0,0,.18); border: 2px solid rgba(0,0,0,.35); }
  .langwrap > span { font-size: 18px; line-height: 1; pointer-events: none; }
  #langPick { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; padding: 0; }
  #langPick option { color: #1d2027; background: #fff; }
  /* Toast centred in the red header; replaces blocking alert() dialogs. */
  .toast { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    background: #fff; color: #1d2027; border: 2px solid var(--ink); font-weight: 700; font-size: 13px;
    padding: 4px 12px; white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis;
    opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 5; }
  .toast.show { opacity: 1; }

  /* Menu bar: flat tabs with a solid underline for the active one. */
  nav {
    display: flex; gap: 0 2px; padding: 0 12px; flex-wrap: wrap;
    background: var(--panel); border-bottom: 2px solid var(--line);
    position: sticky; top: 0; z-index: 30;
  }
  nav button {
    background: none; border: 0; border-bottom: 3px solid transparent; color: var(--muted);
    padding: 10px 10px 8px; cursor: pointer; font-size: 12px; font-weight: 700; white-space: nowrap; flex: none;
    text-transform: uppercase; letter-spacing: .07em; margin-bottom: -2px;
  }
  nav button:hover { color: var(--text); }
  nav button.active { color: var(--text); border-bottom-color: var(--accent); }
  nav .pill { background: var(--accent); color: var(--accent-ink); }
  /* Phones: the tabs wrap onto several lines instead of scrolling sideways;
     the taller bar scrolls away with the page rather than eating the screen. */
  @media (max-width: 600px) {
    nav { position: static; }
  }
  main, #starterGate { padding: 18px 16px; max-width: 920px; margin: 0 auto; }
  .card {
    background: var(--panel); border: 2px solid var(--line);
    border-radius: var(--radius); padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow);
  }
  .card .card { box-shadow: none; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .grow { flex: 1; min-width: 140px; }
  .muted { color: var(--muted); font-size: 13px; }
  .pill {
    display: inline-block; padding: 1px 8px; border-radius: 4px;
    background: var(--panel-2); border: 1px solid var(--line); font-size: 12px; margin-right: 4px;
    font-weight: 600;
  }
  /* Game-style buttons: solid fill, dark rim, presses down on click. */
  button.action {
    background: var(--accent); color: var(--accent-ink); border: 2px solid var(--ink);
    border-radius: var(--radius); padding: 7px 14px; cursor: pointer; font-size: 14px; font-weight: 700;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); transition: transform .05s;
  }
  button.action:hover { filter: brightness(1.08); }
  button.action:active:not(:disabled) { transform: translateY(1px); box-shadow: inset 0 -1px 0 rgba(0,0,0,.25); }
  button.action:disabled { opacity: .5; cursor: not-allowed; }
  button.ghost {
    background: var(--panel-2); border: 2px solid var(--line); color: var(--text);
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.12);
  }
  button.ghost:hover { border-color: var(--muted); filter: none; }
  input, select, textarea {
    background: var(--bg); color: var(--text); border: 2px solid var(--line);
    border-radius: var(--radius); padding: 6px 10px; font-size: 14px; max-width: 100%; font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--info); }
  /* HP bar as in the games: dark rimmed track, colour set by hpBar(). */
  .hp {
    height: 8px; border-radius: 4px; background: #3a3f4a; overflow: hidden; width: 140px;
    border: 2px solid var(--ink); box-sizing: content-box;
  }
  .hp > span { display: block; height: 100%; background: var(--ok); }
  /* Fixed width so a short ball name doesn't shrink the <select>, shifting
     the buttons next to it (easy to fat-finger "auto battle" on mobile). */
  .ballPick { width: 160px; flex: 0 0 auto; }
  .hidden { display: none; }
  img.sprite { width: 77px; height: 77px; image-rendering: pixelated; }
  .log { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; color: var(--muted); }
  .shiny { color: var(--gold); font-weight: 700; }

  /* ---------------------------------------------------- Battle & Team */
  body.no-scroll { overflow: hidden; }
  .type-pill { color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,.45); }
  /* Type tags are the plates from the games (www/img/types), always English -
     like the type names themselves. Height drives the size, width follows. */
  .type-icon { height: 20px; width: auto; vertical-align: -4px; margin-right: 4px; }
  /* Plate plus multiplier in the weakness/resistance grid - the plate is
     already pill-shaped, so no extra pill background around it. */
  .type-mult { display: inline-flex; align-items: center; font-size: 12px; }
  .type-mult .type-icon { margin-right: 3px; vertical-align: baseline; }
  .hp.hp-wide { width: 100%; max-width: 260px; height: 8px; margin-top: 4px; }
  #battleOverlay { position: fixed; inset: 0; background: var(--bg); z-index: 50; overflow-y: auto; }
  .battle { max-width: 720px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .battle-field { background: var(--panel); border: 2px solid var(--line); border-radius: var(--radius);
    padding: 12px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow); }
  .battle-side { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .battle-info { flex: 1; min-width: 0; }
  /* Sprites stand on the oval platforms from the battle scenes. */
  .battle-sprite { width: 134px; height: 134px; flex: none;
    background: radial-gradient(ellipse 46% 13% at 50% 86%, var(--panel-2) 0 97%, var(--line) 99% 100%, transparent 100%) no-repeat; }

  /* Battle animation speed (per user, app_user.animation_speed - see
     applyAnimationSpeed() and renderBattle() in the script below). The
     body.anim-* class only sets these durations; whether a sprite gets an
     anim-* class at all is decided in JS (renderBattle diffs against the
     previous render), so 'off' never adds the classes in the first place -
     no animation, exactly like before this feature existed. Explicitly NOT
     covered here: damage numbers - the battle log stays instant text. */
  body.anim-fast { --anim-entry: .2s; --anim-hit: .15s; --anim-faint: .25s; }
  body.anim-normal { --anim-entry: .4s; --anim-hit: .25s; --anim-faint: .4s; }
  body.anim-slow { --anim-entry: .7s; --anim-hit: .4s; --anim-faint: .7s; }
  @keyframes battleSpriteEnter {
    from { opacity: 0; transform: scale(.5); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes battleSpriteFaint {
    from { opacity: 1; transform: scale(1) translateY(0); }
    to { opacity: 0; transform: scale(.6) translateY(16px); }
  }
  @keyframes battleSpriteHit {
    0%, 100% { transform: translateX(0); filter: none; }
    25% { transform: translateX(-6px); filter: brightness(2) saturate(0); }
    75% { transform: translateX(6px); filter: brightness(2) saturate(0); }
  }
  .battle-sprite.anim-enter { animation: battleSpriteEnter var(--anim-entry, .3s) ease-out; }
  .battle-sprite.anim-faint { animation: battleSpriteFaint var(--anim-faint, .3s) ease-in forwards; }
  .battle-sprite.anim-hit { animation: battleSpriteHit var(--anim-hit, .2s) ease-in-out; }
  @media (prefers-reduced-motion: reduce) {
    .battle-sprite.anim-enter, .battle-sprite.anim-faint, .battle-sprite.anim-hit { animation: none; }
  }
  /* Double-framed text box from the games. */
  .battle-log { background: var(--panel); border: 3px solid var(--ink); border-radius: var(--radius);
    box-shadow: inset 0 0 0 2px var(--panel), inset 0 0 0 4px var(--line);
    padding: 12px 14px; height: 150px; overflow-y: auto; }
  .battle-log, .battle-log .log { font-family: var(--mono); font-size: 13px; color: var(--text); }
  .battle-menu { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .battle-menu button.active { background: var(--text); color: var(--panel); border-color: var(--text); }
  .move-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .move-btn { text-align: left; background: var(--panel); color: var(--text); border: 2px solid var(--line);
    border-left: 8px solid var(--line); border-radius: var(--radius); padding: 8px 10px; cursor: pointer;
    font-size: 14px; font-weight: 700; box-shadow: inset 0 -3px 0 rgba(0,0,0,.12); }
  .move-btn:hover:not(:disabled) { border-top-color: var(--muted); border-right-color: var(--muted); border-bottom-color: var(--muted); }
  .move-btn:active:not(:disabled) { transform: translateY(1px); }
  .move-btn:disabled { opacity: .45; cursor: not-allowed; }
  .move-btn small { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
  #battleResume { position: fixed; right: 16px; bottom: 16px; z-index: 40; box-shadow: 3px 3px 0 var(--ink); }
  .exp-bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; width: 140px; margin-top: 4px; }
  .exp-bar > span { display: block; height: 100%; background: var(--info); }
  .battle-error { color: var(--accent); font-size: 13px; }
  .dex-summary { display: flex; gap: 16px; margin-bottom: 14px; }
  .dex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .dex-entry { margin: 0; text-align: center; min-width: 0; position: relative; }
  .dex-entry img { width: 86px; height: 86px; image-rendering: pixelated; }
  .dex-entry.unseen img { filter: grayscale(1) brightness(0); opacity: .35; }
  .dex-entry.seen-only img, img.seen-only { filter: grayscale(1); }
  .dex-entry strong { display: block; overflow-wrap: anywhere; }
  /* Small pokeball badge on Dex cards whose species currently sits in the
     team or box (not just ever seen/caught). */
  .dex-owned-badge {
    position: absolute; top: 4px; right: 4px; width: 14px; height: 14px; border-radius: 50%;
    background: linear-gradient(to bottom, var(--accent) 0%, var(--accent) 48%, var(--ink) 48%, var(--ink) 52%, #fff 52%, #fff 100%);
    border: 1px solid var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.4);
  }
  .dex-owned-badge::after {
    content: ''; position: absolute; top: 50%; left: 50%; width: 4px; height: 4px;
    border-radius: 50%; background: #fff; border: 1px solid var(--ink); transform: translate(-50%, -50%);
  }
  /* Pokémon/move detail: small window over the view instead of its own
     page, so Dex/Team remain visible in the background. */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 45; overflow-y: auto;
    background: rgba(10,11,14,.7); display: flex; align-items: flex-start;
    justify-content: center; padding: 40px 16px;
  }
  .modal-backdrop.hidden { display: none; }
  .modal-backdrop .pokemon-detail, .modal-backdrop .move-detail {
    background: var(--panel); border: 3px solid var(--ink); border-radius: var(--radius); box-shadow: 6px 6px 0 var(--ink);
    max-height: 88vh; overflow-y: auto; width: 100%;
  }
  .modal-backdrop .pokemon-detail { max-width: 640px; }
  .move-detail { max-width: 360px; padding: 16px; margin: 0 auto; }
  .move-detail h3 { margin: 0 0 10px; }
  #profileOverlay { position: fixed; inset: 0; background: var(--bg); z-index: 46; overflow-y: auto; }
  .secBtn.active { border-color: var(--accent); color: var(--accent); }
  /* Auto-rule editor (Settings > Auto rules). */
  .ar-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px 14px; }
  .ar-field.ar-wide { grid-column: 1 / -1; }
  .ar-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .ar-chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border: 1px solid var(--line);
    border-radius: 4px; background: var(--panel-2); font-size: 12px; cursor: pointer; }
  .ar-chip input { margin: 0; }
  .badge-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .badge { display: inline-flex; align-items: center; gap: 6px;
    border: 2px solid var(--line); border-radius: var(--radius); padding: 3px 10px; font-size: 13px; font-weight: 600; }
  .badge.earned { border-color: var(--ok); color: var(--ok); }
  .badge.locked { opacity: .45; }
  /* Gym badge artwork (www/img/badges/<trainer id>.png); a badge that hasn't
     been earned yet is greyed out. */
  .badge-icon { width: 26px; height: 26px; object-fit: contain; flex: none; margin-left: -4px; }
  .badge.locked .badge-icon { filter: grayscale(1) brightness(.55); }
  .mini-team { display: flex; flex-wrap: wrap; gap: 10px; }
  .mini-team figure { margin: 0; text-align: center; width: 92px; cursor: pointer; border-radius: 8px; }
  .mini-team figure:hover { background: var(--line); }
  .mini-team img { width: 72px; height: 72px; image-rendering: pixelated; }
  .hist-exp { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .hist-exp .card { margin: 0; padding: 6px 10px; }
  .pokemon-detail { max-width: 760px; margin: 0 auto; padding: 16px; }
  .detail-head { display: flex; align-items: center; gap: 14px; }
  /* Only the sprite next to the heading - the type plates sit in the text
     column beside it and keep their own size. */
  .detail-head > img { width: 134px; height: 134px; image-rendering: pixelated; }
  .detail-grid { display: grid; grid-template-columns: minmax(250px, 1fr) minmax(250px, 1fr); gap: 12px; }
  .iv-chart { display: block; width: 100%; max-width: 330px; margin: 0 auto; }
  .move-choice { display: flex; flex-direction: column; gap: 8px; }
  .move-choice input[type="checkbox"] { display: none; }
  .move-choice label { display: flex; align-items: center; gap: 10px; border: 2px solid var(--line);
    border-left: 8px solid var(--line); border-radius: var(--radius); padding: 10px 12px; cursor: pointer;
    background: var(--panel); transition: background .15s, border-color .15s; }
  .move-choice label.checked { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .move-choice label.disabled { opacity: .45; cursor: not-allowed; }
  .move-name { font-weight: 600; }
  .move-meta { color: var(--muted); font-size: 13px; margin-left: 6px; }
  .move-type-dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--ink); flex: none; margin-left: auto; }
  .evo-line { display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px 8px; padding-bottom: 4px; }
  /* A branch of the line stays together where it fits; otherwise it wraps too. */
  .evo-step { display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px; max-width: 100%; }
  .evo-mon { min-width: 110px; text-align: center; }
  .evo-mon img { width: 86px; height: 86px; image-rendering: pixelated; }
  .evo-arrow { min-width: 100px; max-width: 150px; display: flex; flex-direction: column; justify-content: center; text-align: center; }
  @media (max-width: 600px) {
    .detail-grid { grid-template-columns: 1fr; }
    .detail-head > img { width: 106px; height: 106px; }
  }
  /* Desktop browsers: the Pokémon summary (own Pokémon + Pokédex entry) uses
     the available window instead of the phone-sized 640px column. */
  @media (min-width: 900px) {
    #pokemonOverlay, #speciesOverlay { padding: 24px 32px; }
    #pokemonOverlay .pokemon-detail, #speciesOverlay .pokemon-detail { max-width: min(1200px, 100%); max-height: none; padding: 20px 24px; }
    #pokemonOverlay .detail-head > img, #speciesOverlay .detail-head > img { width: 176px; height: 176px; }
    #pokemonOverlay .detail-grid { grid-template-columns: minmax(260px, 1fr) minmax(260px, 1fr) minmax(320px, 1.3fr); align-items: start; }
    #pokemonOverlay .iv-chart { max-width: 380px; }
    #speciesOverlay .pokemon-detail { max-width: min(960px, 100%); }
    .modal-backdrop .evo-line { justify-content: safe center; }
  }
  @media (min-width: 900px) and (max-width: 1199px) {
    #pokemonOverlay .detail-grid { grid-template-columns: 1fr 1fr; }
    #pokemonOverlay .detail-grid > :nth-child(3) { grid-column: 1 / -1; }
  }
  /* Desktop browsers: the app itself (tabs, battle, profile) uses the window
     instead of the phone-sized 920px / 720px columns. Card lists flow into
     as many columns as fit; everything that is not a card (headings, filters,
     pagers) and cards marked .span-all keep the full row. Below 900px
     nothing changes (mobile / HA companion app). */
  @media (min-width: 900px) {
    header { padding: 12px 32px; }
    nav { padding: 0 28px; }
    nav button { font-size: 13px; padding: 12px 14px 10px; }
    main, #starterGate { max-width: min(1680px, 100%); padding: 24px 32px; }
    #tab-settings, #tab-guide { max-width: 1200px; margin: 0 auto; }
    #tab-queue, #tab-shop, #tab-bag, #tab-league, #tab-achievements, #teamViewBody {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(min(460px, 100%), 1fr));
      gap: 0 14px;
    }
    #tab-queue.hidden, #tab-shop.hidden, #tab-bag.hidden, #tab-league.hidden, #tab-achievements.hidden { display: none; }
    #tab-queue > :not(.card), #tab-shop > :not(.card), #tab-bag > :not(.card), #tab-league > :not(.card),
    #tab-achievements > :not(.card), #teamViewBody > :not(.card),
    #tab-queue > .span-all, #tab-shop > .span-all, #tab-bag > .span-all, #tab-league > .span-all,
    #tab-achievements > .span-all, #teamViewBody > .span-all,
    #tab-queue > .card:only-child, #teamViewBody > .card:only-child { grid-column: 1 / -1; }
    .league-region-body { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(460px, 100%), 1fr)); gap: 0 14px; }
    .league-region-body > :not(.card) { grid-column: 1 / -1; }
    .dex-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    .box-grid { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 12px; }
    #profileOverlay .pokemon-detail { max-width: min(1100px, 100%); }
    #battleOverlay .battle { max-width: min(1000px, 100%); padding: 24px 32px; }
    .battle-sprite { width: 176px; height: 176px; }
    .battle-log { height: 190px; }
    .move-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  }
  /* Wide windows: battle field + log on the left, the action menu next to it
     so moves stay visible without scrolling. */
  @media (min-width: 1200px) {
    #battleOverlay .battle {
      max-width: min(1500px, 100%); display: grid; gap: 14px 20px; align-items: start;
      grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
    }
    #battleOverlay .battle > .row:first-child { grid-column: 1 / -1; }
    #battleOverlay .battle > .battle-field, #battleOverlay .battle > .battle-log,
    #battleOverlay .battle > .battle-error { grid-column: 1; }
    #battleOverlay .battle > #bActions { grid-column: 2; grid-row: 2 / span 3; }
    #battleOverlay .battle > .battle-confirm { grid-column: 1 / -1; }
    .battle-log { height: 240px; }
  }
  .item-icon { width: 28px; height: 28px; image-rendering: pixelated; vertical-align: middle; margin-right: 6px; }
  .stat-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .stat-row .stat-name { width: 90px; color: var(--muted); font-size: 13px; }
  .stat-row .stat-bar { flex: 1; height: 8px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .stat-row .stat-bar > span { display: block; height: 100%; background: var(--info); }
  .stat-row .stat-value { width: 34px; text-align: right; font-size: 13px; }
  .stat-row.stat-total { border-top: 1px solid var(--line); padding-top: 6px; margin-top: 8px; }
  .stat-row.stat-total .stat-name, .stat-row.stat-total .stat-value { color: var(--text); font-weight: 600; }
  .evo-ready { border-color: var(--ok); }
  .evo-ready .evo-choices { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .evo-ready .evo-choices img { width: 32px; height: 32px; image-rendering: pixelated; vertical-align: middle; margin: -6px 4px -6px -4px; }
  .pill.evo-badge { background: var(--ok); color: #fff; }
  .trainer-card.defeated { border-color: var(--ok); }
  /* Portrait of the gym leader/elite four member/champion themselves (not
     their Pokémon) - see trainers.sprite_url_for. */
  .trainer-portrait { width: 56px; height: 56px; object-fit: contain; flex: none; border-radius: 8px; }
  .battle-trainer-portrait { width: 40px; height: 40px; object-fit: contain; flex: none; border-radius: 8px; }
  /* Collapsible region (generation) sections in the gym/league tab. */
  .league-region { margin: 10px 0; }
  .league-region > summary { cursor: pointer; padding: 6px 0; }
  .league-region > summary h3 { display: inline; margin: 0; }
  .league-region > summary::marker { color: var(--muted); }
  .trainer-team { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .trainer-team figure { margin: 0; text-align: center; font-size: 11px; color: var(--muted); width: 58px; cursor: pointer; border-radius: 8px; }
  .trainer-team figure:hover { background: var(--line); }
  .trainer-team img { width: 52px; height: 52px; image-rendering: pixelated; display: block; margin: 0 auto; }
  .opp-balls { display: flex; gap: 4px; margin-top: 4px; }
  .opp-balls span {
    width: 12px; height: 12px; border-radius: 50%; position: relative; flex: none;
    background: linear-gradient(to bottom, #ee1515 0 48%, #222 48% 52%, #f4f4f4 52% 100%);
    border: 1px solid #222;
  }
  .opp-balls span::after {
    content: ''; position: absolute; top: 50%; left: 50%; width: 4px; height: 4px;
    margin: -2px 0 0 -2px; border-radius: 50%; background: #f4f4f4; border: 1px solid #222;
  }
  .opp-balls span.down { background: #8a8f98; filter: grayscale(1); opacity: .55; }
  .opp-balls span.down::after { background: #ccc; }
  /* --------------------------------------------------------- Box grid */
  .box-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 10px; }
  .box-slot { text-align: center; cursor: pointer; padding: 8px 6px; position: relative; }
  .box-slot .fav-star { position: absolute; top: 2px; right: 4px; font-size: 15px; line-height: 1;
    color: var(--muted); opacity: .5; cursor: pointer; }
  .box-slot .fav-star.on { color: var(--gold); opacity: 1; }
  /* Lock symbol = a small Klefki (www/img/klefki.png, Gen 8 box icon). */
  img.lock-mark { width: 19px; height: 16px; vertical-align: middle; image-rendering: pixelated; }
  .box-slot img.lock-mark { position: absolute; bottom: 4px; left: 4px; width: 19px; height: 16px; cursor: pointer; }
  /* Egg drawn in CSS: cream shell with a few green spots. */
  .egg-icon { display: inline-block; width: 30px; height: 38px; margin: 8px 0;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; border: 2px solid var(--ink);
    background: radial-gradient(circle at 30% 40%, #7cc47a 0 4px, transparent 5px),
      radial-gradient(circle at 68% 62%, #7cc47a 0 5px, transparent 6px),
      radial-gradient(circle at 42% 78%, #7cc47a 0 3px, transparent 4px), #f6f0dc; }
  .egg-bar > span { background: var(--gold); }
  .box-slot img { width: 56px; height: 56px; image-rendering: pixelated; }
  .box-slot:hover { border-color: var(--muted); }
  .box-slot .box-slot-name { font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .box-slot .hp { margin: 4px auto 0; width: auto; max-width: 100%; }
  .box-slot.fainted { opacity: .5; }
  .box-slot.is-buddy { border-color: var(--accent); }
  .box-slot.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .box-slot .box-sel { position: absolute; top: 4px; left: 4px; margin: 0; z-index: 1; }
  .buddy-bar { width: 100%; max-width: 320px; height: 8px; }
  .buddy-bar > span { background: var(--ok); }
  .buddy-art { width: 120px; height: 120px; object-fit: contain; }
  /* ---------------------------------------------------- Type matchups */
  .type-matchup-group { margin-bottom: 8px; }
  .type-matchup-group:last-child { margin-bottom: 0; }
  .type-matchup-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  /* Full 18x18 chart in the Guide: rows attack, columns defend. Scrolls
     sideways on narrow screens instead of squeezing the cells. */
  .type-chart-wrap { overflow-x: auto; margin-top: 8px; }
  .type-chart { border-collapse: separate; border-spacing: 2px; font-size: 12px; }
  .type-chart th, .type-chart td { text-align: center; padding: 0; }
  .type-chart td { width: 26px; min-width: 26px; height: 24px; border-radius: 4px; font-weight: 600; background: rgba(255,255,255,.03); }
  .type-chart th.tc-col span { display: block; padding: 3px 0; border-radius: 4px; color: #fff; font-size: 10px; font-weight: 600; text-shadow: 0 1px 1px rgba(0,0,0,.45); }
  .type-chart th.tc-row { text-align: left; padding-right: 4px; }
  .type-chart th.tc-row .type-icon { height: 16px; margin: 0; vertical-align: middle; }
  .type-chart .tc-corner { text-align: left; font-weight: 400; font-size: 11px; color: var(--muted); vertical-align: bottom; }
  .type-chart .tc-super { background: var(--ok); color: #fff; }
  .type-chart .tc-weak { background: #d98a2b; color: #fff; }
  .type-chart .tc-none { background: var(--line); color: var(--muted); }
  .gen-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .gen-table th, .gen-table td { padding: 4px 8px; text-align: right; border-bottom: 1px solid var(--line); }
  .gen-table th:first-child, .gen-table td:first-child { text-align: left; }
  .eff-badge { display: inline-block; margin-left: 4px; font-size: 11px; }
  .eff-super { color: var(--ok); }
  .eff-weak { color: var(--accent); }
  .eff-none { color: var(--muted); }
  .modal-backdrop.battle-modal { z-index: 55; }
  .bBall.boosted { border-color: var(--ok); }
  .bBall .boost { color: var(--ok); font-weight: 600; }
  .ach { display: flex; align-items: center; gap: 10px; }
  .ach.locked { opacity: .5; }
  /* Achievement trophy (inline SVG, see trophyIcon): bronze / silver / gold, grey when locked. */
  .trophy { width: 30px; height: 30px; flex: none; color: var(--ink); }
  /* Status conditions as coloured tags like in the games. */
  .status-pill { color: #fff; border-color: transparent; text-transform: uppercase; letter-spacing: .04em; font-size: 11px; }
  .status-burn { background: #e0662f; }
  .status-poison, .status-toxic { background: #9b4fb0; }
  .status-paralysis { background: #c9a41c; }
  .status-sleep { background: #7d8594; }
  .status-freeze { background: #4ea9d6; }
  .status-curse { background: #5a4a86; }
  /* Stat stages (+2 Atk, -1 Spe ...) next to the status tag; green = raised, red = lowered. */
  .stage-pill { color: #fff; border-color: transparent; font-size: 11px; font-variant-numeric: tabular-nums; }
  .stage-up { background: var(--ok); }
  .stage-down { background: var(--accent); }
  .dex-entry.card:hover, .trainer-card:hover { border-color: var(--muted); }
  /* AttackDex: attack cards in the games' move-list look - type-coloured edge,
     type plate, category tag, power/accuracy up front, effects small below. */
  .atk-type-bar { display: flex; flex-wrap: wrap; gap: 4px; }
  .atk-type-btn { line-height: 0; padding: 3px; border: 2px solid var(--line); border-radius: 6px;
    background: var(--panel); cursor: pointer; transition: border-color .15s, background .15s; }
  .atk-type-btn:hover { border-color: var(--muted); }
  .atk-type-btn.active { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .atk-type-btn img { height: 20px; margin: 0; }
  .atk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .atk-card { margin: 0; min-width: 0; border-left-width: 8px; cursor: pointer; }
  .atk-card:hover { background: var(--panel-2); }
  .atk-card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .atk-card-head .move-name { overflow-wrap: anywhere; }
  .atk-card-head .type-icon { margin: 0; flex: none; }
  .atk-card-tags { margin: 6px 0 2px; }
  .atk-stats { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; font-size: 13px; }
  .atk-stats b { font-size: 16px; font-variant-numeric: tabular-nums; }
  .atk-effect { margin-top: 6px; font-size: 12px; color: var(--muted); }
  /* Physical / special / status tags, like the games' category icons. */
  .cat-pill { color: #fff; border-color: transparent; text-transform: uppercase; letter-spacing: .04em; font-size: 11px; }
  .cat-physical { background: #c4572b; }
  .cat-special { background: #3d7fb8; }
  .cat-status { background: #7d8594; }
  .atk-detail-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
  .atk-detail-stats > div { border: 2px solid var(--line); border-radius: var(--radius); padding: 6px; text-align: center; }
  .atk-detail-stats b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .atk-effects { margin: 4px 0 0; padding-left: 18px; font-size: 14px; }
  .atk-learners { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  /* AbilityDex: same card grid as the AttackDex; the left edge is green for
     abilities that work in battle, neutral for inactive ones. */
  .abl-card { border-left-color: var(--line); }
  .abl-card.abl-active { border-left-color: var(--ok); }
  .pill.abl-on { background: var(--ok); color: #fff; border-color: transparent; }
  .abl-desc { margin-top: 6px; font-size: 13px; display: -webkit-box; -webkit-line-clamp: 3;
    -webkit-box-orient: vertical; overflow: hidden; }
  .abl-foot { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; }
</style>
</head>
<body>
<header>
  <h1><img id="brandLogo" alt="PokeHOAS"></h1>
  <span class="grow"></span>
  <button class="ghost action" id="userName" title="Profile"></button>
  <span class="pill hidden" id="money" title="Balance"></span>
  <span class="pill hidden" id="godMode" data-i18n="header.god_mode">God mode</span>
  <span class="status" id="status"></span>
  <button class="ghost action" id="pollNow" data-i18n="header.poll_now">Poll now</button>
  <button class="ghost action hidden" id="logoutBtn" data-i18n="login.logout">Log out</button>
  <span class="langwrap"><span aria-hidden="true">🌐</span><select id="langPick"></select></span>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</header>

<section id="starterGate" class="hidden"></section>

<div id="appShell" class="hidden">
<nav>
  <button data-tab="queue" class="active" data-i18n="nav.queue">Queue</button>
  <button data-tab="team" data-i18n="nav.pokemon">Pokémon</button>
  <button data-tab="dex" data-i18n="nav.dex">Dex</button>
  <button data-tab="league" data-i18n="nav.league">Gyms &amp; League</button>
  <button data-tab="pvp" data-i18n="nav.pvp">Player Battles</button>
  <button data-tab="challenge" data-i18n="nav.challenge">Challenges</button>
  <button data-tab="trade"><span data-i18n="nav.trade">Trading</span> <span class="pill hidden" id="tradeBadge"></span></button>
  <button data-tab="achievements" data-i18n="nav.achievements">Achievements</button>
  <button data-tab="history" data-i18n="nav.history">History</button>
  <button data-tab="bag" data-i18n="nav.bag">Bag</button>
  <button data-tab="shop" data-i18n="nav.shop">Shop</button>
  <button data-tab="guide" data-i18n="nav.guide">Guide</button>
  <button data-tab="settings" data-i18n="nav.settings">Settings</button>
</nav>

<main>
  <section id="tab-queue"></section>
  <section id="tab-settings" class="hidden"></section>
  <section id="tab-shop" class="hidden"></section>
  <section id="tab-bag" class="hidden"></section>
  <section id="tab-team" class="hidden"></section>
  <section id="tab-dex" class="hidden"></section>
  <section id="tab-league" class="hidden"></section>
  <section id="tab-pvp" class="hidden"></section>
  <section id="tab-challenge" class="hidden"></section>
  <section id="tab-trade" class="hidden"></section>
  <section id="tab-achievements" class="hidden"></section>
  <section id="tab-history" class="hidden"></section>
  <section id="tab-guide" class="hidden"></section>
</main>
</div>

<div id="battleOverlay" class="hidden"></div>
<div id="pokemonOverlay" class="modal-backdrop hidden"></div>
<div id="speciesOverlay" class="modal-backdrop hidden"></div>
<div id="moveOverlay" class="modal-backdrop hidden"></div>
<div id="abilityOverlay" class="modal-backdrop hidden"></div>
<div id="itemOverlay" class="modal-backdrop hidden"></div>
<div id="enemyOverlay" class="modal-backdrop battle-modal hidden"></div>
<div id="tradePickOverlay" class="modal-backdrop hidden"></div>
<div id="profileOverlay" class="hidden"></div>
<button id="battleResume" class="action hidden" data-i18n="header.resume_battle">Resume battle</button>

<script>
// Ingress-compatible: everything relative to current path.
const BASE = window.location.pathname.replace(/\/$/, '');
document.getElementById('brandLogo').src = `${BASE}/static/img/banner.svg`;
const api = (path, options) => fetch(BASE + path, {
  headers: { 'Content-Type': 'application/json' }, ...options
}).then(async r => {
  const body = await r.json().catch(() => ({}));
  if (!r.ok) {
    // Auth mode ha_oauth (Docker without Supervisor): no session -> log in with HA.
    if (r.status === 401 && body.detail && body.detail.code === 'login_required') {
      showLoginGate();
      const err = new Error(tr('login.required'));
      err.loginRequired = true;
      throw err;
    }
    const detail = typeof body.detail === 'object' && body.detail !== null
      ? (body.detail.message || JSON.stringify(body.detail)) : body.detail;
    throw new Error(detail || r.statusText);
  }
  return body;
});

// Login page for auth mode ha_oauth. Inside an iframe (HA "Webpage" dashboard)
// HA's login page refuses to be framed, so it opens in a popup instead and the
// popup reports back via postMessage (see app/api/login.py).
let loginGateShown = false;
function showLoginGate() {
  if (loginGateShown) return;
  loginGateShown = true;
  const framed = window.top !== window.self;
  $('#appShell').classList.add('hidden');
  const gate = $('#starterGate');
  gate.classList.remove('hidden');
  gate.innerHTML = `
    <div class="card">
      <h2 style="margin-top:0">${esc(tr('login.title'))}</h2>
      <p>${esc(tr('login.text'))}</p>
      <button class="action" id="loginBtn">${esc(tr('login.button'))}</button>
      ${framed ? `<p class="muted">${esc(tr('login.popup_hint'))}</p>` : ''}
    </div>`;
  $('#loginBtn').onclick = () => {
    if (!framed) { window.location.href = BASE + '/auth/login'; return; }
    window.open(BASE + '/auth/login?popup=1', 'pokehoas-login', 'width=520,height=720');
  };
  window.addEventListener('message', e => {
    if (e.data === 'pokehoas-login') window.location.reload();
  });
}

const $ = sel => document.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ------------------------------------------------------------------ i18n
// Single source of truth: app/data/i18n/<lang>.json on the server (same
// files the backend uses for battle-log/error text). Adding a language
// means adding ONE json file there - nothing to change here. English is
// the default and the fallback for any key missing from another language
// (see GET /api/i18n/<lang>, which already merges that fallback in).
let LANG = localStorage.getItem('poke_lang') || 'en';
let STRINGS = {};
let AVAILABLE_LANGS = ['en'];

const LOCALE_FOR_LANG = { en: 'en-US', de: 'de-AT', es: 'es-ES', fr: 'fr-FR', it: 'it-IT', pl: 'pl-PL', ja: 'ja-JP', ko: 'ko-KR' };
const jsLocale = () => LOCALE_FOR_LANG[LANG] || 'en-US';

function tr(key, vars) {
  let s = STRINGS[key] ?? key;
  if (vars) for (const [k, v] of Object.entries(vars)) s = s.replaceAll(`{${k}}`, v);
  return s;
}

var toastTimer;
function toast(message) {
  const el = $('#toast');
  if (!el) return;
  el.textContent = message;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

function applyStaticTranslations() {
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = tr(el.dataset.i18n); });
  if ($('#langPick')) {
    $('#langPick').title = tr('admin.field.language');
    $('#langPick').setAttribute('aria-label', tr('admin.field.language'));
    $('#langPick').innerHTML = AVAILABLE_LANGS
      .map(l => `<option value="${l}" ${l === LANG ? 'selected' : ''}>${esc(tr('language.' + l))}</option>`)
      .join('');
  }
}

async function loadStrings(lang) {
  const data = await fetch(BASE + '/api/i18n/' + encodeURIComponent(lang)).then(r => r.json());
  STRINGS = data.strings;
  AVAILABLE_LANGS = data.available;
  LANG = data.language;
  localStorage.setItem('poke_lang', LANG);
  applyStaticTranslations();
}

// Name selection: species have name_en (actual display name, seed.py) instead
// of the raw PokeAPI key in `name`; moves/abilities/items are ALWAYS already
// set up with English `name` in the catalog (see moves.json etc.), so "name"
// alone suffices. Both fall back to name_de/name if the current language
// (or English) is missing.
function speciesName(sp) {
  if (!sp) return '?';
  if (LANG === 'de') return sp.name_de || sp.name_en || sp.name || '?';
  return sp.name_en || sp.name_de || sp.name || '?';
}

function localizedName(obj) {
  if (!obj) return '?';
  if (LANG === 'de') return obj.name_de || obj.name || '?';
  return obj.name || obj.name_de || '?';
}
// Generic counterpart to localizedName/speciesName for any field pairs
// (e.g. "label"/"label_de", "description"/"description_de") - so new
// bilingual fields don't need their own helper each time.
function pick(obj, field) {
  if (!obj) return '';
  const en = obj[field], de = obj[field + '_de'];
  return (LANG === 'de' ? (de || en) : (en || de)) || '';
}
// Ball multiplier localized (3.5 -> "3.5" in English, "3,5" in German).
const fmtMult = m => Number(m).toLocaleString(jsLocale(), { maximumFractionDigits: 1 });
const OUTCOME_KEY = { won: 'outcome.won', lost: 'outcome.lost', timeout: 'outcome.timeout',
                      caught: 'outcome.caught', ran: 'outcome.ran', fled: 'outcome.fled',
                      no_party: 'outcome.no_party' };
const outcomeLabel = outcome => tr(OUTCOME_KEY[outcome] || outcome);
// Natures are a vanilla Pokémon concept with 25 fixed values from spawn.py -
// deliberately only prettified here (capitalization), not translated: a wrong
// German nature translation would be worse than the raw English name.
const natureLabel = n => n ? n.charAt(0).toUpperCase() + n.slice(1) : n;
const genderLabel = g => g === 'male' ? tr('gender.male') : g === 'female' ? tr('gender.female') : tr('gender.genderless');

// The Master Ball is a one-off league/region reward and can never be bought
// (economy.py NEVER_BUYABLE), so a mis-click is unrecoverable. Both throw paths
// (queue card and manual battle) ask twice; false means the user backed out.
const MASTER_BALL = 'master_ball';
function confirmMasterBall(ball, name, count) {
  if (ball !== MASTER_BALL) return true;
  return confirm(tr('common.master_ball_confirm', { name, count }))
      && confirm(tr('common.master_ball_confirm_again', { name }));
}

let currentTab = 'queue';
async function setLanguage(lang, opts) {
  if (lang === LANG && !(opts && opts.force)) return;
  await loadStrings(lang);
  try { await api('/api/users/me/language', { method: 'PUT', body: JSON.stringify({ language: lang }) }); }
  catch (e) { /* not signed in yet (dev fallback etc.) - local display still works */ }
  refreshStatus();
  render(currentTab);
}

// ------------------------------------------------------------------ Tabs
document.querySelectorAll('nav button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b === btn));
    currentTab = btn.dataset.tab;
    ['queue','team','dex','league','pvp','challenge','trade','achievements','history','bag','shop','guide','settings'].forEach(t =>
      $('#tab-' + t).classList.toggle('hidden', t !== btn.dataset.tab));
    render(btn.dataset.tab);
  };
});

// ---------------------------------------------------------------- Status
// The header no longer shows queue/dex/trigger stats; this only refreshes the trade badge.
function refreshStatus() {
  return refreshTradeBadge();
}
$('#pollNow').onclick = async () => {
  $('#pollNow').disabled = true;
  try { const r = await api('/api/poll', { method: 'POST' }); await refreshStatus(); render('queue');
        if (!r.created) toast(tr('queue.poll_nothing')); }
  catch (e) { alert(e.message); }
  finally { $('#pollNow').disabled = false; }
};

// ------------------------------------------------------------ Warteschlange
// Options of a queue card's ball picker: only balls in stock, special balls
// marked with their boost for this encounter.
function queueBallOptions(inv, boosts) {
  const options = Object.entries(inv.balls)
    .filter(([k]) => (inv.items[k] || 0) > 0)
    .map(([k, b]) => `<option value="${k}">${boosts[k] ? '★ ' : ''}${esc(pick(b, 'label'))} (${inv.items[k]})${
      boosts[k] ? ' – ×' + esc(fmtMult(boosts[k])) : ''}</option>`).join('');
  return options || `<option value="">${tr('queue.no_balls')}</option>`;
}

async function renderQueue() {
  const el = $('#tab-queue');
  const list = await api('/api/encounters?status=waiting');
  let inv = await api('/api/inventory');
  // Auto rules: which rule would take each card (dry run) + toolbar.
  let rules = null;
  try { rules = await api('/api/auto-rules/preview'); } catch (e) { /* toolbar is optional */ }
  const ruleFor = {};
  (rules ? rules.encounters : []).forEach(p => { if (p.rule_name) ruleFor[p.encounter_id] = p; });

  if (!list.length) {
    el.innerHTML = `<div class="card muted">${tr('queue.empty')}</div>`;
    return;
  }

  const { items: shown, page, totalPages } = pageSlice('queue', list);
  const matched = Object.keys(ruleFor).length;
  // Always shown (when the rules API answered) so the feature stays
  // discoverable; the household switch only disables "Run rules".
  const rulesOn = rules && rules.settings.household_enabled;
  const toolbar = rules ? `<div class="card">
    <div class="row">
      <span class="grow muted">${esc(rulesOn ? tr('queue.rules_hint', { count: matched, total: rules.encounters.length })
        : tr('queue.rules_off'))}</span>
      <button class="action" id="qRunRules"${rulesOn && matched ? '' : ' disabled'}>${esc(tr('queue.run_rules'))}</button>
      <button class="ghost action" id="qManageRules">${esc(tr('queue.manage_rules'))}</button>
    </div>
    <div class="log" id="qRulesResult"></div>
  </div>` : '';
  el.innerHTML = toolbar + shown.map(enc => {
    const sp = enc.species || {};
    const name = speciesName(sp) !== '?' ? speciesName(sp) : ('#' + enc.species_id);
    const types = [sp.type1, sp.type2].filter(Boolean).map(typePill).join('');
    return `<div class="card" data-id="${enc.id}" data-name="${esc(name)}">
      <div class="row">
        ${sp.sprite_url ? `<img class="sprite" src="${esc(sp.sprite_url)}" alt="">` : ''}
        <div class="grow">
          <strong>${esc(name)}</strong> ${enc.shiny ? shinyMark() : ''}
          <span class="muted">${tr('common.level_short', { level: enc.level })}</span>
          ${ruleFor[enc.id] ? `<span class="pill" title="${esc(tr('queue.rule_pill_hint'))}">⚙ ${esc(ruleFor[enc.id].rule_name)} → ${esc(tr('auto_rules.mode.' + ruleFor[enc.id].mode))}</span>` : ''}<br>${types}
          <div class="muted" title="${esc(enc.source_entity || '')}">${tr('queue.source', {
            source: esc(enc.source_label || enc.source_entity || tr('common.unknown')) })}${enc.biome ? ' · ' + esc(enc.biome) : ''}
            · ${tr('queue.expires', { date: new Date(enc.expires_at).toLocaleDateString(jsLocale()) })}</div>
        </div>
        ${hpBar(enc.current_hp, enc.max_hp)}
      </div>
      <div class="row" style="margin-top:10px">
        <button class="action fight">${tr('queue.fight')}</button>
        <select class="ballPick" data-boosts="${esc(JSON.stringify(enc.ball_boosts || {}))}">${queueBallOptions(inv, enc.ball_boosts || {})}</select>
        <button class="action throw">${tr('queue.throw_ball')}</button>
        <button class="ghost action auto">${tr('queue.auto_battle')}</button>
        <button class="ghost action flee">${tr('queue.let_flee')}</button>
        <span class="log result"></span>
      </div>
    </div>`;
  }).join('') + pagerHtml('queue', page, totalPages);

  wirePager(el, () => render('queue'));
  if ($('#qManageRules')) {
    $('#qManageRules').onclick = () => {
      settingsView = 'auto';
      document.querySelector('nav button[data-tab="settings"]').click();
    };
    $('#qRunRules').onclick = async () => {
      $('#qRunRules').disabled = true;
      try {
        const r = await api('/api/auto-rules/run', { method: 'POST' });
        const lines = r.results.filter(x => x.outcome !== 'skipped').map(x => `${x.rule_name}: ${x.message}`);
        $('#qRulesResult').textContent = [r.message, ...lines].join('\n');
        economyToast({ money_earned: r.results.reduce((sum, x) => sum + (x.money_earned || 0), 0),
                       iv_gains: r.results.flatMap(x => x.iv_gains || []) });
        await refreshStatus(); setTimeout(() => render('queue'), 2500);
      } catch (e) { $('#qRulesResult').textContent = e.message; $('#qRunRules').disabled = false; }
    };
  }
  // A throw spends a ball even when it misses: refresh the stock shown on
  // every card (and the Master Ball check) without re-rendering the queue.
  async function refreshBallPickers() {
    inv = await api('/api/inventory');
    el.querySelectorAll('.ballPick').forEach(picker => {
      const chosen = picker.value;
      picker.innerHTML = queueBallOptions(inv, JSON.parse(picker.dataset.boosts));
      picker.value = chosen;
    });
  }
  el.querySelectorAll('.card[data-id]').forEach(card => {
    const id = card.dataset.id;
    const out = card.querySelector('.result');
    card.querySelector('.fight').onclick = () => openBattle(id);
    card.querySelector('.throw').onclick = async () => {
      try {
        const ball = card.querySelector('.ballPick').value;
        if (!confirmMasterBall(ball, card.dataset.name, inv.items[ball] || 0)) return;
        const r = await api(`/api/encounters/${id}/throw`, {
          method: 'POST', body: JSON.stringify({ ball })
        });
        out.textContent = r.caught
          ? (r.critical ? tr('queue.critical_catch') : tr('queue.caught'))
          : r.fled ? tr('queue.escaped')
          : tr('queue.broke_free', { shakes: r.shakes, probability: Math.round(r.probability * 100) });
        economyToast(r);
        if (r.caught) { await refreshStatus(); setTimeout(() => render('queue'), 900); }
        else if (r.fled) setTimeout(() => render('queue'), 900);
        else await refreshBallPickers();
      } catch (e) { out.textContent = e.message; }
    };
    card.querySelector('.auto').onclick = async () => {
      try {
        const r = await api(`/api/encounters/${id}/auto-battle`, { method: 'POST' });
        out.textContent = tr('queue.result', { outcome: outcomeLabel(r.outcome) });
        economyToast(r);
        await refreshStatus(); setTimeout(() => render('queue'), 900);
      } catch (e) { out.textContent = e.message; }
    };
    card.querySelector('.flee').onclick = async () => {
      await api(`/api/encounters/${id}/flee`, { method: 'POST' });
      render('queue'); refreshStatus();
    };
  });
}

// ---------------------------------------------------------------- Trigger
// Two sources: automatically from add-on config (categories, source='config')
// and manually added here (source='manual'). Since it quickly becomes hundreds
// of entities, grouped by category and collapsible.
const triggerView = { open: new Set(), source: 'all', q: '' };

async function renderTriggers() {
  const el = $('#tab-triggers');
  const [triggers, tcfg] = await Promise.all([api('/api/triggers'), api('/api/triggers/config')]);
  const active = tcfg.categories.filter(c => c.active);
  const sync = tcfg.last_sync || {};
  const syncTime = sync.at ? new Date(sync.at).toLocaleTimeString(jsLocale()) : '';
  const skipped = Object.values(sync.skipped || {}).reduce((a, b) => a + b, 0);
  const syncLine = !sync.at ? tr('triggers.sync_never')
    : sync.ok
      ? tr('triggers.sync_ok', { time: syncTime, selected: sync.selected }) +
        (sync.added || sync.removed ? tr('triggers.sync_changes', { added: sync.added, removed: sync.removed }) : '') +
        (skipped ? tr('triggers.sync_skipped', { count: skipped }) : '')
      : tr('triggers.sync_failed', { time: syncTime, error: sync.error });

  el.innerHTML = `
    <div class="card">
      <strong>${tr('triggers.auto_title')}</strong>
      <div style="margin-top:6px">${active.length
        ? active.map(c => `<span class="pill">${esc(c.label)}</span>`).join('')
        : `<span class="muted">${tr('triggers.no_category_active')}</span>`}</div>
      ${tcfg.extra_entities.length ? `<div class="muted">${tr('triggers.extra')} ${tcfg.extra_entities.map(esc).join(', ')}</div>` : ''}
      ${tcfg.exclude_entities.length ? `<div class="muted">${tr('triggers.excluded')} ${tcfg.exclude_entities.map(esc).join(', ')}</div>` : ''}
      <div class="muted" style="margin-top:6px">${tr('triggers.config_hint')}</div>
      <div class="row" style="margin-top:6px">
        <div class="muted grow" id="triggerSyncLine">${esc(syncLine)}</div>
        <button class="ghost action" id="triggerSyncBtn">${tr('triggers.sync_now')}</button>
      </div>
    </div>
    <div class="card">
      <strong>${tr('triggers.add_manual_title')}</strong>
      <div class="row" style="margin-top:6px">
        <input class="grow" id="entitySearch" placeholder="${tr('triggers.search_placeholder')}">
        <button class="action" id="entitySearchBtn">${tr('common.search')}</button>
      </div>
      <div class="muted" style="margin-top:6px">${tr('triggers.add_manual_hint')}</div>
      <div id="entityResults"></div>
    </div>
    <div class="row" style="margin:16px 0 8px">
      <h3 class="grow" style="margin:0">${tr('triggers.title')} (${triggers.length})</h3>
      <input id="triggerFilter" placeholder="${tr('common.filter_placeholder')}" value="${esc(triggerView.q)}">
      <select id="triggerSource">
        <option value="all">${tr('triggers.source_all')}</option>
        <option value="config">${tr('triggers.source_config')}</option>
        <option value="manual">${tr('triggers.source_manual')}</option>
      </select>
    </div>
    <div id="triggerGroups"></div>
  `;

  $('#triggerSource').value = triggerView.source;
  $('#triggerFilter').oninput = e => { triggerView.q = e.target.value; drawTriggerGroups(triggers, tcfg); };
  $('#triggerSource').onchange = e => { triggerView.source = e.target.value; drawTriggerGroups(triggers, tcfg); };
  drawTriggerGroups(triggers, tcfg);

  $('#triggerSyncBtn').onclick = async () => {
    $('#triggerSyncBtn').disabled = true;
    try { await api('/api/triggers/sync', { method: 'POST' }); render('triggers'); refreshStatus(); }
    catch (e) { $('#triggerSyncLine').textContent = e.message; $('#triggerSyncBtn').disabled = false; }
  };

  $('#entitySearch').onkeydown = e => { if (e.key === 'Enter') $('#entitySearchBtn').click(); };
  $('#entitySearchBtn').onclick = async () => {
    const q = $('#entitySearch').value.trim();
    let res;
    try { res = await api('/api/ha/entities?q=' + encodeURIComponent(q)); }
    catch (e) { $('#entityResults').innerHTML = `<div class="muted">${tr('header.error', { message: esc(e.message) })}</div>`; return; }
    $('#entityResults').innerHTML = res.entities.slice(0, 40).map(e => `
      <div class="row" style="padding:6px 0;border-top:1px solid var(--line)">
        <div class="grow"><strong>${esc(e.friendly_name)}</strong>
          <div class="muted">${esc(e.entity_id)} · ${esc(e.state)}</div></div>
        <button class="ghost action addEntity" data-e="${esc(JSON.stringify(e))}"
          ${e.already_configured ? 'disabled' : ''}>
          ${e.already_configured ? tr('triggers.already_active') : tr('common.add')}</button>
      </div>`).join('') || `<div class="muted">${tr('common.nothing_found')}</div>`;

    $('#entityResults').querySelectorAll('.addEntity').forEach(btn => {
      btn.onclick = async () => {
        const e = JSON.parse(btn.dataset.e);
        await api('/api/triggers/' + encodeURIComponent(e.entity_id), {
          method: 'PUT',
          body: JSON.stringify({
            entity_id: e.entity_id, friendly_name: e.friendly_name, enabled: true,
            trigger_states: e.suggested_trigger_states || ['on'],
            spawn_chance: e.suggested_spawn_chance ?? 0.25,
            type_weights: e.suggested_type_weights || {}, cooldown_minutes: 0
          })
        });
        render('triggers'); refreshStatus();
      };
    });
  };
}

function triggerCard(t) {
  const src = t.source === 'config'
    ? `<span class="pill" title="${tr('triggers.from_config_title')}">${tr('triggers.source_config')}</span>`
    : `<span class="pill">${tr('triggers.source_manual')}</span>`;
  return `<div class="trigger" data-entity="${esc(t.entity_id)}" data-name="${esc(t.friendly_name || '')}"
      style="padding:10px 0;border-top:1px solid var(--line)">
    <div class="row">
      <div class="grow">
        <strong>${esc(t.friendly_name || t.entity_id)}</strong> ${src}
        <div class="muted">${esc(t.entity_id)}</div>
      </div>
      <label class="muted">${tr('triggers.active')} <input type="checkbox" class="tEnabled" ${t.enabled ? 'checked' : ''}></label>
    </div>
    <div class="row" style="margin-top:8px">
      <label class="muted">${tr('triggers.states')} <input class="tStates" value="${esc(t.trigger_states.join(','))}" size="10"></label>
      <label class="muted">${tr('triggers.spawn_chance')} <input class="tChance" type="number" step="0.01" min="0" max="1" value="${t.spawn_chance}" size="4"></label>
      <label class="muted">${tr('triggers.cooldown')} <input class="tCooldown" type="number" min="0" value="${t.cooldown_minutes}" size="4"></label>
    </div>
    <div class="row" style="margin-top:8px">
      <label class="muted grow">${tr('triggers.type_bonus')}
        <input class="tWeights grow" value="${esc(JSON.stringify(t.type_weights))}"></label>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="action tSave">${tr('common.save')}</button>
      <button class="ghost action tFire" ${t.enabled ? '' : 'disabled'}>${tr('triggers.fire_now')}</button>
      ${t.source === 'config'
        ? `<span class="muted">${tr('triggers.remove_config_hint')}</span>`
        : `<button class="ghost action tDelete">${tr('common.remove')}</button>`}
      <span class="muted tResult"></span>
    </div>
  </div>`;
}

function drawTriggerGroups(triggers, tcfg) {
  const box = $('#triggerGroups');
  const q = triggerView.q.trim().toLowerCase();
  const visible = triggers.filter(t =>
    (triggerView.source === 'all' || t.source === triggerView.source) &&
    (!q || `${t.entity_id} ${t.friendly_name || ''}`.toLowerCase().includes(q)));
  if (!triggers.length) { box.innerHTML = `<div class="card muted">${tr('triggers.none_yet')}</div>`; return; }
  if (!visible.length) { box.innerHTML = `<div class="card muted">${tr('triggers.none_match_filter')}</div>`; return; }

  const order = [...tcfg.categories.map(c => c.key), 'other'];
  const rank = key => { const i = order.indexOf(key); return i < 0 ? order.length : i; };
  const groups = {};
  visible.forEach(t => { (groups[t.category] = groups[t.category] || []).push(t); });
  const keys = Object.keys(groups).sort((a, b) => rank(a) - rank(b));
  const byId = Object.fromEntries(triggers.map(t => [t.entity_id, t]));

  box.innerHTML = keys.map(key => {
    const list = groups[key];
    const label = list[0].category_label || key;
    // Beim Textfilter alle Treffer aufgeklappt zeigen.
    const open = q || triggerView.open.has(key);
    return `<details class="card" data-group="${esc(key)}" ${open ? 'open' : ''}>
      <summary style="cursor:pointer">
        <strong>${esc(label)}</strong>
        <span class="muted gCount">${tr('triggers.group_count', { total: list.length, active: list.filter(t => t.enabled).length })}</span>
      </summary>
      <div class="row" style="margin:8px 0">
        <button class="ghost action gEnable">${tr('triggers.enable_all')}</button>
        <button class="ghost action gDisable">${tr('triggers.disable_all')}</button>
      </div>
      ${list.map(triggerCard).join('')}
    </details>`;
  }).join('');

  box.querySelectorAll('details[data-group]').forEach(details => {
    const key = details.dataset.group;
    const list = groups[key];
    const updateCount = () => {
      details.querySelector('.gCount').textContent =
        tr('triggers.group_count', { total: list.length, active: list.filter(t => t.enabled).length });
    };
    details.addEventListener('toggle', () => {
      if (q) return;
      if (details.open) triggerView.open.add(key); else triggerView.open.delete(key);
    });
    const bulk = async enabled => {
      try {
        await api('/api/triggers/bulk', {
          method: 'POST', body: JSON.stringify({ entity_ids: list.map(t => t.entity_id), enabled })
        });
        list.forEach(t => { t.enabled = enabled; });
        triggerView.open.add(key);
        drawTriggerGroups(triggers, tcfg); refreshStatus();
      } catch (e) { alert(e.message); }
    };
    details.querySelector('.gEnable').onclick = () => bulk(true);
    details.querySelector('.gDisable').onclick = () => bulk(false);

    details.querySelectorAll('.trigger[data-entity]').forEach(card => {
      const entityId = card.dataset.entity;
      const t = byId[entityId];
      const out = card.querySelector('.tResult');
      // Aktiv/inaktiv wird sofort gespeichert - bei vielen Triggern bequemer.
      card.querySelector('.tEnabled').onchange = async e => {
        try {
          await api('/api/triggers/bulk', {
            method: 'POST', body: JSON.stringify({ entity_ids: [entityId], enabled: e.target.checked })
          });
          t.enabled = e.target.checked; updateCount(); refreshStatus();
          out.textContent = t.enabled ? tr('triggers.enabled') : tr('triggers.disabled');
        } catch (err) { e.target.checked = !e.target.checked; alert(err.message); }
      };
      card.querySelector('.tSave').onclick = async () => {
        try {
          const payload = {
            entity_id: entityId,
            friendly_name: card.dataset.name || null,
            enabled: card.querySelector('.tEnabled').checked,
            trigger_states: card.querySelector('.tStates').value.split(',').map(s => s.trim()).filter(Boolean),
            spawn_chance: parseFloat(card.querySelector('.tChance').value),
            cooldown_minutes: parseInt(card.querySelector('.tCooldown').value, 10),
            type_weights: JSON.parse(card.querySelector('.tWeights').value || '{}')
          };
          await api('/api/triggers/' + encodeURIComponent(entityId), {
            method: 'PUT', body: JSON.stringify(payload)
          });
          Object.assign(t, payload, { friendly_name: t.friendly_name });
          updateCount(); refreshStatus();
          out.textContent = tr('common.saved');
        } catch (e) { alert(e.message); }
      };
      card.querySelector('.tFire').onclick = async () => {
        try {
          const r = await api('/api/triggers/' + encodeURIComponent(entityId) + '/fire', { method: 'POST' });
          out.textContent = r.created > 0
            ? tr('triggers.fired_ok', { count: r.created })
            : tr('triggers.fired_none');
          refreshStatus();
        } catch (e) { out.textContent = e.message; }
      };
      const del = card.querySelector('.tDelete');
      if (del) del.onclick = async () => {
        try {
          await api('/api/triggers/' + encodeURIComponent(entityId), { method: 'DELETE' });
          render('triggers'); refreshStatus();
        } catch (e) { alert(e.message); }
      };
    });
  });
}

// ------------------------------------------------------------------ Zonen
async function renderZones() {
  const el = $('#tab-zones');
  let haZones = [];
  try { haZones = (await api('/api/ha/entities?domain=zone')).entities; }
  catch (e) { /* HA nicht erreichbar - Zuordnung faellt auf manuelle Eingabe zurueck */ }
  const [biomes, zones] = await Promise.all([api('/api/biomes'), api('/api/zones')]);
  const nameFor = id => (haZones.find(z => z.entity_id === id) || {}).friendly_name || id;
  const options = Object.entries(biomes)
    .map(([k, v]) => `<option value="${k}">${esc(v.label)}</option>`).join('');
  const assigned = new Set(zones.map(z => z.zone_entity_id));
  const zoneOptions = haZones
    .map(z => `<option value="${esc(z.entity_id)}">${esc(z.friendly_name)} (${esc(z.entity_id)})${assigned.has(z.entity_id) ? ' · ' + tr('zones.assigned') : ''}</option>`)
    .join('');

  el.innerHTML = `
    <div class="card">
      <div class="muted">${tr('zones.biome_hint')}</div>
      <div class="row" style="margin-top:10px">
        ${zoneOptions
          ? `<select class="grow" id="zoneId">${zoneOptions}</select>`
          : `<input class="grow" id="zoneId" placeholder="zone.home or person.ash">`}
        <select id="zoneBiome">${options}</select>
        <button class="action" id="zoneAdd">${tr('zones.assign')}</button>
      </div>
      ${haZones.length === 0 ? `<div class="muted" style="margin-top:6px">${tr('zones.no_ha_zones')}</div>` : ''}
    </div>
    ${zones.map(z => `<div class="card row" data-id="${esc(z.zone_entity_id)}">
      <div class="grow">
        <strong>${esc(nameFor(z.zone_entity_id))}</strong>
        <div class="muted">${esc(z.zone_entity_id)}</div>
      </div>
      <select class="zBiome">${Object.entries(biomes).map(([k, v]) =>
        `<option value="${k}" ${k === z.biome ? 'selected' : ''}>${esc(v.label)}</option>`).join('')}</select>
      <label class="muted">${tr('triggers.active')} <input type="checkbox" class="zEnabled" ${z.enabled ? 'checked' : ''}></label>
      <button class="ghost action zSave">${tr('common.save')}</button>
      <button class="ghost action zRemove">${tr('common.remove')}</button>
    </div>`).join('') || `<div class="card muted">${tr('zones.none_yet')}</div>`}
  `;
  $('#zoneAdd').onclick = async () => {
    const id = $('#zoneId').value.trim();
    if (!id) return;
    await api('/api/zones/' + encodeURIComponent(id), {
      method: 'PUT',
      body: JSON.stringify({ zone_entity_id: id, biome: $('#zoneBiome').value, enabled: true })
    });
    render('zones');
  };
  el.querySelectorAll('.card.row[data-id]').forEach(card => {
    const id = card.dataset.id;
    card.querySelector('.zSave').onclick = async () => {
      await api('/api/zones/' + encodeURIComponent(id), {
        method: 'PUT',
        body: JSON.stringify({
          zone_entity_id: id,
          biome: card.querySelector('.zBiome').value,
          enabled: card.querySelector('.zEnabled').checked
        })
      });
      render('zones');
    };
    card.querySelector('.zRemove').onclick = async () => {
      await api('/api/zones/' + encodeURIComponent(id), { method: 'DELETE' });
      render('zones');
    };
  });
}

// ------------------------------------------------------------- Einstellungen
// Settings: "General" holds the personal settings every player may change
// (region lock). Admin is the only admin-only sub-view - the household-wide
// game settings, triggers and zones/biomes all live under Admin (server-side
// enforcement is the require_admin dependency on the mutating routes, this
// nav split is cosmetic).
let settingsView = 'general';

async function renderSettings() {
  const el = $('#tab-settings');
  const me = await api('/api/users/me');
  const sub = [['general', tr('settings.subnav_general')], ['auto', tr('auto_rules.title')]];
  if (me.is_admin) sub.push(['admin', tr('nav.admin')]);
  if (!sub.some(([key]) => key === settingsView)) settingsView = 'general';
  el.innerHTML = `
    ${sub.length > 1 ? `<div class="row" style="margin-bottom:10px">
      ${sub.map(([key, label]) => `<button class="ghost action secBtn${settingsView === key ? ' active' : ''}" data-sub="${key}">${esc(label)}</button>`).join('')}
    </div>` : ''}
    <section id="tab-settings-general" class="${settingsView === 'general' ? '' : 'hidden'}"></section>
    <section id="tab-settings-auto" class="${settingsView === 'auto' ? '' : 'hidden'}"></section>
    <section id="tab-admin" class="${settingsView === 'admin' ? '' : 'hidden'}"></section>
  `;
  el.querySelectorAll('.secBtn').forEach(btn => {
    btn.onclick = () => { settingsView = btn.dataset.sub; renderSettings(); };
  });
  if (settingsView === 'general') await renderGeneralSettings(me);
  else if (settingsView === 'auto') await renderAutoRules();
  else if (settingsView === 'admin') await renderAdmin();
}

// Region lock (per player, see achievements.unlocked_generations): dropdown +
// description of the selected option, used by the starter gate and Settings.
const REGION_LOCK_MODES = ['unlocked', 'region', 'previous_region'];
function regionLockHtml(selectId, current) {
  return `
    <label class="muted" for="${selectId}">${tr('region_lock.title')}</label>
    <div class="muted">${tr('region_lock.hint')}</div>
    <select id="${selectId}" style="margin-top:6px">
      ${REGION_LOCK_MODES.map(m => `<option value="${m}"${m === current ? ' selected' : ''}>${esc(tr('region_lock.' + m))}</option>`).join('')}
    </select>

// Applies the animation speed as a body class the battle CSS reads (see
// .battle-sprite.anim-* rules); renderBattle() also checks currentAnimationSpeed
// before adding any anim-* class, so 'off' reproduces the pre-feature behaviour
// exactly instead of relying on a zero animation-duration.
let currentAnimationSpeed = 'off';
function applyAnimationSpeed(speed) {
  currentAnimationSpeed = ANIMATION_SPEEDS.includes(speed) ? speed : 'off';
  document.body.classList.remove(...ANIMATION_SPEEDS.map(s => 'anim-' + s));

}

// Sprite styles - reward of a generation's living Pokédex (achievements
// gen_living_<n>, see GET /api/users/me sprite_styles): the PokeAPI sprites of
// that generation's games instead of the normal ones, chosen per species in its
// Pokédex entry (species_sprite_styles). `max` = last National Dex
// number of that game; newer species, a shiny without game sprite (Gen 1) and
// any missing file (Sword/Shield, Scarlet/Violet don't have every species) keep
// the normal sprite. Applied to every <img> by a MutationObserver
// (watchSpriteStyle), so no sprite call site needs to know about it.
const SPRITE_STYLES = {
  1: { path: 'generation-i/red-blue/transparent', ext: 'png', max: 151, noShiny: true },
  2: { path: 'generation-ii/crystal/transparent', ext: 'png', max: 251 },
  3: { path: 'generation-iii/emerald', ext: 'png', max: 386 },
  4: { path: 'generation-iv/platinum', ext: 'png', max: 493 },
  5: { path: 'generation-v/black-white/animated', ext: 'gif', max: 649 },
  6: { path: 'generation-vi/x-y', ext: 'png', max: 721 },
  7: { path: 'generation-vii/ultra-sun-ultra-moon', ext: 'gif', max: 807 },
  8: { path: 'generation-viii/sword-shield', ext: 'webp', max: 898 },
  9: { path: 'generation-ix/scarlet-violet', ext: 'webp', max: 1025 },
};
const SPRITE_URL_RE = /\/sprites\/pokemon\/(back\/)?(shiny\/)?(\d+)\.png$/;
let availableSpriteStyles = [];  // unlocked generations (GET /api/users/me)
let speciesSpriteStyles = {};  // species id -> generation (GET /api/users/me)

function styledSpriteUrl(url) {
  const m = String(url || '').match(SPRITE_URL_RE);
  if (!m) return url;
  const [, back = '', shiny = '', id] = m;
  const style = SPRITE_STYLES[speciesSpriteStyles[+id]];
  if (!style) return url;
  if (+id > style.max || (shiny && style.noShiny)) return url;
  return url.slice(0, m.index) + `/sprites/pokemon/versions/${style.path}/${back}${shiny}${id}.${style.ext}`;
}

function spriteStyleFallback(e) {
  const img = e.target;
  if (img.dataset.spriteSrc && img.getAttribute('src') === img.dataset.styledSrc) {
    img.dataset.styledSrc = img.dataset.spriteSrc;
    img.setAttribute('src', img.dataset.spriteSrc);
  }
}

function applySpriteStyle(img) {
  const src = img.getAttribute('src') || '';
  if (!src || src === img.dataset.styledSrc) return;  // our own rewrite / fallback
  const styled = styledSpriteUrl(src);
  if (styled === src) return;
  img.dataset.spriteSrc = src;
  img.dataset.styledSrc = styled;
  img.addEventListener('error', spriteStyleFallback);
  img.setAttribute('src', styled);
}

function watchSpriteStyle() {
  new MutationObserver(mutations => {
    if (!Object.keys(speciesSpriteStyles).length) return;
    for (const m of mutations) {
      if (m.type === 'attributes') { if (m.target.tagName === 'IMG') applySpriteStyle(m.target); continue; }
      for (const node of m.addedNodes) {
        if (node.nodeType !== 1) continue;
        if (node.tagName === 'IMG') applySpriteStyle(node);
        else node.querySelectorAll('img').forEach(applySpriteStyle);
      }
    }
  }).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['src'] });
}

const arFieldVisible = (f, a) => (!f.modes || f.modes.includes(a.mode)) && (!f.show || f.show(a));

// One "label: value" pill per set field - shared by condition and action summaries.
function arValueText(f, v) {
  if (v === null || v === undefined || v === '' || (Array.isArray(v) && !v.length)) return null;
  switch (f.kind) {
    case 'tri': case 'bool': return v ? tr('auto_rules.yes') : tr('auto_rules.no');
    case 'num': return `${v}${f.unit || ''}`;
    case 'chips': case 'select': return (Array.isArray(v) ? v : [v]).map(x => f.label(x)).join(', ');
    case 'ids': return v.map(id => '#' + id).join(', ');
    case 'text_list': return v.join(', ');
    case 'ball': case 'buy_ball': return arBallLabel(v);
    case 'ball_list': return v.map(arBallLabel).join(' → ');
    case 'lineup': return tr('auto_rules.lineup_count', { count: v.length });
    default: return String(v);
  }
}
function arCondSummary(c) {
  const pills = [];
  if (c.level_min != null || c.level_max != null) {
    pills.push(`${tr('auto_rules.cond.level')}: ${c.level_min ?? 1}–${c.level_max ?? 100}`);
  }
  AR_COND_FIELDS.forEach(f => {
    if (f.kind === 'range' || f.summary === false) return;
    let text = arValueText(f, c[f.key]);
    if (text === null || (f.kind === 'tri' && c[f.key] === null)) return;
    if (f.key === 'types' && c.types_mode === 'all') text = c.types.map(typeLabel).join(' + ');
    if (f.key === 'catch_chance_min') text += ` (${arBallLabel(c.catch_chance_ball)})`;
    pills.push(`${tr('auto_rules.cond.' + f.key)}: ${text}`);
  });
  return pills.length ? pills.map(p => `<span class="pill">${esc(p)}</span>`).join('')
    : `<span class="pill">${esc(tr('auto_rules.always'))}</span>`;
}
function arActionSummary(a) {
  const pills = [`<span class="pill">${esc(tr('auto_rules.mode.' + a.mode))}</span>`];
  AR_ACTION_FIELDS.forEach(f => {
    if (f.key === 'mode' || !arFieldVisible(f, a)) return;
    const v = a[f.key];
    if ((f.kind === 'bool' && !v) || (f.quiet !== undefined && v === f.quiet)) return;
    const text = arValueText(f, v);
    if (text === null) return;
    pills.push(`<span class="pill">${esc(`${tr('auto_rules.act.' + f.key)}: ${text}`)}</span>`);
  });
  return pills.join('');
}

      return `<div class="row" ${attrs}>${[0, 1, 2, 3, 4, 5].map(i => `<select data-slot="${i}"><option value="">—</option>${mons.map(p =>
        `<option value="${p.id}"${(value || [])[i] === p.id ? ' selected' : ''}>${esc(p.name)} (${esc(tr('common.level_short', { level: p.level }))})${p.party_slot == null ? ' · ' + esc(tr('auto_rules.in_box')) : ''}</option>`).join('')}</select>`).join('')}</div>`;
    }
  }
  return '';
}
function arFieldHtml(scope, f, value, catalog) {
  const label = f.kind === 'bool' ? '' : `<div class="muted">${esc(tr('auto_rules.' + (scope === 'cond' ? 'cond.' : 'act.') + f.key))}</div>`;
  const wide = ['chips', 'ids', 'text_list', 'lineup', 'ball_list'].includes(f.kind) ? ' ar-wide' : '';
  return `<div class="ar-field${wide}">${label}${arInputHtml(scope, f, value, catalog)}</div>`;
}

// Reads every rendered input back into the draft (hidden fields keep their value).
function arReadForm(root, draft) {
  root.querySelectorAll('[data-ar]').forEach(node => {
    const target = node.dataset.ar === 'cond' ? draft.conditions : draft.actions;
    const key = node.dataset.key, kind = node.dataset.kind;
    if (kind === 'tri') target[key] = node.value === '' ? null : node.value === 'true';
    else if (kind === 'bool') target[key] = node.checked;
    else if (kind === 'num') {
      const f = [...AR_COND_FIELDS, ...AR_ACTION_FIELDS].find(x => x.key === key);
      target[key] = node.value === '' ? (f && f.required ? target[key] : null) : Number(node.value);
    } else if (kind === 'chips') {
      const numeric = key === 'generations';
      target[key] = [...node.querySelectorAll('input:checked')].map(i => numeric ? Number(i.value) : i.value);
    } else if (kind === 'ids') target[key] = node.value.split(/[,\s]+/).map(Number).filter(n => Number.isInteger(n) && n > 0);
    else if (kind === 'text_list') target[key] = node.value.split(',').map(s => s.trim()).filter(Boolean);
    else if (kind === 'buy_ball') target[key] = node.value || null;
    else if (kind === 'ball_list') target[key] = [...node.querySelectorAll('select')].map(s => s.value).filter(Boolean);
    else if (kind === 'lineup') target[key] = [...node.querySelectorAll('select')].map(s => Number(s.value)).filter(Boolean);
    else target[key] = node.value;
  });
  const name = root.querySelector('#arName');
  if (name) draft.name = name.value;
  const enabled = root.querySelector('#arRuleEnabled');
  if (enabled) draft.enabled = enabled.checked;
  return draft;
}

      <div class="ar-grid" style="margin-top:8px">

  const actions = AR_ACTION_FIELDS.filter(f => arFieldVisible(f, a)).map(f => arFieldHtml('act', f, a[f.key], catalog)).join('');
