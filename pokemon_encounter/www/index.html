          </div>
          ${w.sprite_url ? `<img class="sprite battle-sprite ${spriteAnim.wild}" src="${esc(w.sprite_url)}" alt="">` : ''}
        </div>
        <div class="battle-side" id="bOwnInfo">
          ${me.sprite_url ? `<img class="sprite battle-sprite ${spriteAnim.own}" src="${esc(backSprite(me.sprite_url))}"
            data-front="${esc(me.sprite_url)}" alt="">` : ''}
          <div class="battle-info" style="text-align:right">
            <strong>${esc(me.name)}</strong> <span class="muted">${esc(lvLabel(me))}</span>
            <div>${(me.types || []).map(typePill).join('')}${megaPill(me)}${statusPill(me.status)}${abilityPill(me.ability_info)}${me.held_item_info
              ? `<span class="pill" title="${tr('battle.held_item_title')}">${esc(localizedName(me.held_item_info))}</span>` : ''}</div>
            <div>${statStagePills(me.stat_stages)}</div>
            <div style="display:flex;justify-content:flex-end">${hpBar(me.current_hp, me.max_hp, true)}</div>
            <div class="muted">${esc(me.current_hp)}/${esc(me.max_hp)} HP</div>
          </div>
        </div>
      </div>
      <div class="log battle-log" id="bLog">${v.log.map(line => `<div>${esc(line)}</div>`).join('')}</div>
      ${battleError ? `<div class="battle-error">${esc(battleError)}</div>` : ''}
      <div id="bActions">${battleActionsHtml(v, me)}</div>
    </div>`;

  el.querySelectorAll('img[data-front]').forEach(img => {
    img.onerror = () => { img.onerror = null; img.src = img.dataset.front; };
  });
  const log = $('#bLog');
  log.scrollTop = log.scrollHeight;

  // Faehigkeits-Pill oeffnet ihr eigenes kleines Fenster statt (bei w) den
  // Gegner-Ueberblick auszuloesen - daher stopPropagation.

  if (wildAbilityPill) wildAbilityPill.onclick = event => { event.stopPropagation(); openAbilityInfo(w.ability_info); };
  const ownAbilityPill = $('#bOwnInfo').querySelector('.ability-pill');

  on('#bHide', () => hideBattle(false));
  on('#bClose', () => hideBattle(true));
  on('#bRefight', () => {
    const trainerId = battleState.trainer.id;
    const ownedId = battleState.active != null ? battleState.active : (battleState.team[0] || {}).owned_id;
    const teamIds = battleState.team.map(m => m.owned_id).filter(id => id != null);
    hideBattle(true);
    refightTrainerBattle(trainerId, ownedId, teamIds);
  });
  on('#bEnemyInfo', () => openEnemySummary(w));
  on('.bMenu', btn => { battleMenu = btn.dataset.menu; battleError = ''; renderBattle(); });
  on('#bRun', () => battleAct({ action: 'run' }));
  on('.bMega', () => battleAct({ action: 'mega' }));
  on('.bMove', btn => battleAct({ action: 'move', move: btn.dataset.move }));
  on('.bSwitch', btn => battleAct({ action: 'switch', target: Number(btn.dataset.target) }));
  on('.bBall', btn => {
    const ball = btn.dataset.ball;
    const held = ((v.balls || []).find(b => b.key === ball) || {}).count || 0;
    if (!confirmMasterBall(ball, w.name, held)) return;
    battleAct({ action: 'ball', ball });
  });
  const medTarget = el.querySelector('#bMedTarget');
  if (medTarget) medTarget.onchange = () => { battleMedTarget = Number(medTarget.value); };
  on('.bItem', btn => battleAct({
    action: 'item', item: btn.dataset.item, target: medTarget ? Number(medTarget.value) : null,
  }));
}

async function battleAct(payload) {
  if (battleBusy || !battleState) return;
  battleBusy = true;
  document.querySelectorAll('#bActions button').forEach(b => { b.disabled = true; });
  try {
    const base = isPvpBattle(battleState) ? '/api/pvp-battles/'
      : isTrainerBattle(battleState) ? '/api/trainer-battles/' : '/api/battles/';
    const v = await api(`${base}${encodeURIComponent(battleState.id)}/action`, {
      method: 'POST', body: JSON.stringify(payload)
    });
    battleError = '';
    if (payload.action !== 'move') battleMenu = 'moves';
    battleState = v;
    if (v.over && v.result) economyToast(v.result.reward || v.result);
  } catch (e) {
    battleError = e.message;
  } finally {
    battleBusy = false;
    renderBattle();
  }
}

// ------------------------------------------------------------ Arena & Liga
const TRAINER_KIND_KEY = {
  gym_leader: 'trainer_kind.gym_leader', elite_four: 'trainer_kind.elite_four', champion: 'trainer_kind.champion',
  // Galar's Champion Cup rounds (kind elite_four, grouped by their `stage`)
  semifinal: 'trainer_kind.semifinal', finals: 'trainer_kind.finals'
};
// League tab sections in fighting order; a trainer with a `stage` is listed
// under that instead of its kind.
const LEAGUE_GROUPS = ['gym_leader', 'semifinal', 'finals', 'elite_four', 'champion'];
const trainerKindLabel = kind => tr(TRAINER_KIND_KEY[kind] || kind);

// Expanded region sections of the league tab, remembered across re-renders and
// reloads. null = the player never toggled anything: only the first region
// that is not fully cleared yet starts expanded.
let leagueOpen = null;
try {
  const saved = JSON.parse(localStorage.getItem('poke_league_open') || 'null');
  if (Array.isArray(saved)) leagueOpen = new Set(saved);
} catch (e) { /* corrupt value: fall back to the default */ }
function saveLeagueOpen() {
  try { localStorage.setItem('poke_league_open', JSON.stringify([...leagueOpen])); } catch (e) { /* storage unavailable */ }
}

async function renderLeague() {
  const el = $('#tab-league');
  const data = await api('/api/trainers');
  if (leagueOpen === null) {
    const first = data.regions.find(r => !r.cleared);
    leagueOpen = new Set(first ? [first.key] : []);
  }
  el.innerHTML = `
    <div class="card span-all">
      <strong>${tr('league.trainers_defeated', { defeated: data.defeated, total: data.total })}</strong>
      <div class="muted">${tr('league.intro')}</div>
      <div class="row" style="margin-top:8px">
        <button class="ghost action leagueExpandAll">${tr('league.expand_all')}</button>
        <button class="ghost action leagueCollapseAll">${tr('league.collapse_all')}</button>
      </div>
    </div>` +
    data.regions.map(region => {
      const done = region.trainers.filter(t => t.defeated).length;
      const groups = LEAGUE_GROUPS
        .map(kind => [kind, region.trainers.filter(t => (t.stage || t.kind) === kind)])
        .filter(([, list]) => list.length);
      // What clearing this region adds to the spawn pool depends on the
      // player's region lock (see achievements.unlock_generation).
      const ug = region.unlocks_generation;
      const okPill = text => `<span class="pill" style="background:var(--ok);color:#fff">${text}</span>`;
      const unlockNote = ug != null
        ? (region.unlock_active
          ? okPill(tr('league.gen_unlocked', { gen: ug }))
          : `<span class="pill">${tr('league.gen_unlocks', { gen: ug })}</span>`)
        : (data.region_lock === 'unlocked' || region.generation <= 1
          ? okPill(tr('league.gen_always_open', { gen: region.generation })) : '');
      const regionReward = region.reward && !region.cleared
        ? `<div class="muted">${tr('league.region_reward', { reward: esc(region.reward.label) })}</div>` : '';
      return `<details class="league-region" data-region="${esc(region.key)}" ${leagueOpen.has(region.key) ? 'open' : ''}>
        <summary><h3>${esc(regionLabel(region.key))} <span class="muted">${done}/${region.trainers.length}</span> ${unlockNote}</h3></summary>
        <div class="league-region-body">${regionReward}` +
        groups.map(([kind, list]) => {
          const key = 'league:' + region.key + ':' + kind;
          const { items: page, page: pageNo, totalPages } = pageSlice(key, list);
          return `<div class="muted" style="margin:6px 0">${esc(trainerKindLabel(kind))}</div>` +
          page.map(t => `
            <div class="card trainer-card${t.defeated ? ' defeated' : ''}">
              <div class="row">
                ${t.sprite_url ? `<img class="trainer-portrait" src="${esc(t.sprite_url)}" alt="" loading="lazy">` : ''}
                <div class="grow">
                  <strong>${esc(t.title)} ${esc(t.name)}</strong> ${t.defeated ? `<span class="pill" style="background:var(--ok);color:#fff">${tr('league.defeated')}</span>` : ''}
                  ${t.type ? typePill(t.type) : ''}
                  <div class="muted">${tr('league.max_level', { level: t.max_level })} · ${tr('league.prize', { amount: esc(fmtMoney(t.prize)) })}${
                    t.scaled ? ' · ' + tr('league.scaled_hint', { level: t.max_level }) : ''}${
                    t.gen_restricted ? ' · ' + tr('league.gen_restricted_hint') : ''}${
                    t.locked_by ? ' · ' + tr('league.locked_hint', { name: esc(t.locked_by) }) : ''}</div>
                  ${t.reward && !t.defeated
                    ? `<div class="muted">${tr('league.first_win_reward', { reward: esc(t.reward.label) })}</div>` : ''}
                  ${t.regen_bonus && !t.defeated
                    ? `<div class="muted">${tr('league.regen_bonus_reward', { percent: esc(t.regen_bonus) })}</div>` : ''}
                  ${t.cooldown_bonus && !t.defeated
                    ? `<div class="muted">${tr('league.cooldown_bonus_reward', { minutes: esc(t.cooldown_bonus) })}</div>` : ''}
                </div>
                <button class="action leagueFight" data-id="${esc(t.id)}" ${
                  data.ongoing_trainer_id === t.id || (t.available && !t.gen_restricted && !t.locked_by) ? '' : 'disabled'}>
                  ${data.ongoing_trainer_id === t.id ? tr('league.resume') : tr('league.challenge')}</button>
              </div>
              ${t.available ? `<div class="trainer-team">${t.team.map((m, i) => `
                <figure data-trainer="${esc(t.id)}" data-idx="${i}" title="${esc(tr('league.summary_hint'))}">${m.sprite_url ? `<img src="${esc(m.sprite_url)}" alt="" loading="lazy">` : ''}${tr('common.level_short', { level: m.level })}</figure>`).join('')}</div>`
                : `<div class="muted">${tr('league.pokedex_loading')}</div>`}
            </div>`).join('') + pagerHtml(key, pageNo, totalPages);
        }).join('') + '</div></details>';
    }).join('');
  const regionEls = el.querySelectorAll('details.league-region');
  regionEls.forEach(d => {
    d.addEventListener('toggle', () => {
      if (d.open) leagueOpen.add(d.dataset.region); else leagueOpen.delete(d.dataset.region);
      saveLeagueOpen();
    });
  });
  const setAll = open => { regionEls.forEach(d => { d.open = open; }); };
  el.querySelector('.leagueExpandAll').onclick = () => setAll(true);
  el.querySelector('.leagueCollapseAll').onclick = () => setAll(false);
  el.querySelectorAll('.leagueFight').forEach(btn => { btn.onclick = () => openTrainerBattle(btn.dataset.id); });
  const trainersById = Object.fromEntries(data.regions.flatMap(r => r.trainers).map(t => [t.id, t]));
  el.querySelectorAll('.trainer-team figure').forEach(fig => {
    fig.onclick = () => openGymMonSummary(trainersById[fig.dataset.trainer].team[Number(fig.dataset.idx)]);
  });
  wirePager(el, () => render('league'));
}

// Clicking a Pokémon in a gym/league team preview: types, stats, moves and
// type matchups, so the player can pick their own lineup beforehand. The
// ability is missing on purpose - it is rolled when the battle starts.
// Reuses #enemyOverlay; moves are listed inline because the move popup would
// open underneath this one (lower z-index).
function openGymMonSummary(m) {
  if (!m) return;
  if (!m.stats) { openBasicMonSummary(m); return; }
  const overlay = $('#enemyOverlay');
  const moves = (m.moves || []).map(mv => `
    <div class="row" style="justify-content:space-between;flex-wrap:nowrap">
      <span>${typePill(mv.type)} <strong>${esc(localizedName(mv))}</strong></span>
      <span class="muted">${esc(moveInfo(mv))}</span>
    </div>`).join('');
  const stats = ['hp', 'atk', 'def', 'spa', 'spd', 'spe']
    .map(k => `${esc(ivLabel(k))} ${esc(m.stats[k])}`).join(' · ');
  overlay.innerHTML = `<div class="pokemon-detail">
    <div class="row" style="justify-content:space-between;flex-wrap:nowrap">
      <h2>${esc(speciesName(m))} <span class="muted">${tr('common.level_short', { level: m.level })}</span></h2>
      <button class="ghost action" id="closeEnemySummary">${tr('common.close')}</button>
    </div>
    <div class="detail-head">
      ${m.sprite_url ? `<img src="${esc(m.sprite_url)}" alt="">` : ''}
      <div>${(m.types || []).map(typePill).join('')}
        <div class="muted">${tr('league.summary_stats', { level: m.level })}: ${stats}</div>
        <div class="muted">${tr('league.summary_ability_note')}</div>
      </div>
    </div>
    <div class="card"><h3>${tr('team.moves')}</h3>${moves}</div>
    <div class="card"><h3>${tr('pokedex.base_stats')}</h3>${statBarsHtml(m.base_stats)}</div>
    <div class="card"><h3>${tr('type_matchup.title')}</h3>${typeMatchupHtml(m.types)}</div>
  </div>`;
  overlay.classList.remove('hidden');
  $('#closeEnemySummary').onclick = closeEnemySummary;
}

// Fallback summary for Pokémon shown without stats (PvP/team-code previews,

function openBasicMonSummary(m) {

// ------------------------------------------------------- Daily challenges
// Three quests per day against level-100 opponents (app/challenge.py); your own
// team keeps its real level. The fight itself is a PvP battle (kind 'pvp' with
// `challenge` set), so it shares the battle overlay.
function openChallengeBattle(slot) {
  // persistParty=false: the picked lineup fights this quest only and is
  // never written to the real party (see challenge.py / api/challenges.py).
  openBattleConfirm(order => api(`/api/challenges/${encodeURIComponent(slot)}/battle`,
    { method: 'POST', body: JSON.stringify({ team: order }) }), async () => {
    const q = (await api('/api/challenges')).quests.find(x => x.slot === slot);
    return q ? { name: q.opponent.name, team: q.opponent.team } : null;
  }, false);
}

function challengeCountdown(iso) {
  const ms = Math.max(0, new Date(iso) - Date.now());
  const h = Math.floor(ms / 3600000), m = Math.floor((ms % 3600000) / 60000);
  return `${h}h ${String(m).padStart(2, '0')}m`;
}

    ${data.quests.map(q => {
      const done = q.status === 'won';

// Filter/sort state of the trade picker (same filters as the box plus a name
// search; kept across openings, not persisted).
const tradePickView = { query: '', sort: 'level_desc', type: '', generation: '', shiny: false,
  favorite: false, minLevel: '', stage: '', rarity: '', invert: false };

// Modal list of the user's tradable box Pokémon; resolves with the chosen
// Pokémon (summary object) or null when closed.
function pickTradePokemon(title) {
  return new Promise(async resolve => {
    const overlay = $('#tradePickOverlay');
    const finish = value => { overlay.classList.add('hidden'); overlay.innerHTML = ''; resolve(value); };
    overlay.classList.remove('hidden');
    overlay.innerHTML = `<div class="pokemon-detail muted">${tr('team.loading_pokemon')}</div>`;
    let list;
    try { list = (await api('/api/trades/tradable')).pokemon; }
    catch (e) { finish(null); alert(e.message); return; }
    pageState['trade:pick'] = 0;
    overlay.innerHTML = `<div class="pokemon-detail">
      <div class="row"><h3 class="grow" style="margin:0">${esc(title)}</h3>
        <button class="ghost action" id="tradePickClose">${tr('common.close')}</button></div>
      ${list.length ? `<div class="row card" style="margin:8px 0">
        ${boxFilterControlsHtml(tradePickView, 'tradePick', { search: true })}
        <span class="muted" id="tradePickCount"></span></div>` : ''}
      <div id="tradePickList"></div>
    </div>`;
    $('#tradePickClose').onclick = () => finish(null);
    // Only the list is redrawn, so the search field keeps its focus while typing.
    const listEl = $('#tradePickList');
    const draw = () => {
      if (!list.length) { listEl.innerHTML = `<div class="card muted">${tr('trade.no_tradable')}</div>`; return; }
      const shown = boxSorted(list.filter(p => boxFilterMatches(p, tradePickView)), tradePickView);
      $('#tradePickCount').textContent = `${shown.length}/${list.length}`;
      const { items, page, totalPages } = pageSlice('trade:pick', shown);
      listEl.innerHTML = shown.length ? items.map(p => `<div class="card" style="margin:8px 0">
          <div class="row"><div class="grow">${tradeMonHtml(p)}</div>
            <button class="action tradePick" data-id="${esc(p.id)}">${tr('trade.select')}</button></div>
        </div>`).join('') + pagerHtml('trade:pick', page, totalPages)
        : `<div class="card muted">${tr('trade.none_match')}</div>`;
      listEl.querySelectorAll('.tradePick').forEach(btn => {
        btn.onclick = () => finish(list.find(p => String(p.id) === btn.dataset.id));
      });
      wirePager(listEl, draw);
    };
    wireBoxFilters(overlay, tradePickView, 'tradePick', () => { pageState['trade:pick'] = 0; draw(); });
    draw();
    overlay.onclick = e => { if (e.target === overlay) finish(null); };
  });
}

const tradeStateText = t => {
  const withRole = ['requested', 'offered', 'declined', 'rejected'].includes(t.status);
  return tr('trade.state.' + t.status + (withRole ? '_' + t.role : ''), { name: esc(t.other_name) });
};

  return `<div class="card" data-id="${esc(t.id)}">
    <div class="row">
      <strong class="grow">${esc(t.other_name)}</strong>
      <span class="pill${t.awaiting_me ? ' evo-badge' : ''}">${tradeStateText(t)}</span>
    </div>
    <div class="row" style="align-items:flex-start;margin-top:8px">
      <div class="grow"><div class="muted">${tr('trade.you_give')}</div>${tradeMonHtml(mine)}</div>
      <div class="grow"><div class="muted">${tr('trade.you_get')}</div>${tradeMonHtml(theirs)}</div>
    </div>
    ${t.unavailable ? `<div class="battle-error" style="margin-top:6px">${tr('trade.unavailable')}</div>` : ''}

async function renderTrade() {
  const el = $('#tab-trade');
  const data = await api('/api/trades');
  const open = data.trades.filter(t => !t.actions.delete);
  const closed = data.trades.filter(t => t.actions.delete);
  const { items: closedPage, page: closedPageNo, totalPages: closedPages } = pageSlice('trade:closed', closed);
  const draft = renderTrade.draft || {};
  el.innerHTML = `
    <div class="card muted">${tr('trade.intro')}</div>
    <h3>${tr('trade.new_title')}</h3>
    ${data.partners.length ? `<div class="card">
      <div class="row">
        <label class="muted">${tr('trade.partner_label')}</label>
        <select id="tradePartner">
          <option value="">${tr('trade.choose_partner')}</option>
          ${data.partners.map(p => `<option value="${esc(p.user_id)}" ${p.user_id === draft.partner ? 'selected' : ''}>${esc(p.display_name)}</option>`).join('')}
        </select>
        <button class="ghost action" id="tradePick">${draft.pokemon ? tr('trade.change_pokemon') : tr('trade.pick_pokemon')}</button>
      </div>
      ${draft.pokemon ? `<div style="margin-top:8px">${tradeMonHtml(draft.pokemon)}</div>` : ''}
      <div class="row" style="margin-top:8px">
        <button class="action" id="tradeSend" ${draft.pokemon ? '' : 'disabled'}>${tr('trade.send_request')}</button>
      </div>
    </div>` : `<div class="card muted">${tr('trade.no_partners')}</div>`}

    <h3>${tr('trade.open_title')}</h3>
    ${open.length ? open.map(tradeCardHtml).join('') : `<div class="card muted">${tr('trade.empty')}</div>`}
    ${closed.length ? `<h3>${tr('trade.closed_title')}</h3>
      ${closedPage.map(tradeCardHtml).join('')}${pagerHtml('trade:closed', closedPageNo, closedPages)}
      <div class="muted">${tr('trade.auto_delete_hint')}</div>` : ''}`;

  const partnerSel = $('#tradePartner');
  if (partnerSel) {
    partnerSel.onchange = () => { renderTrade.draft = { ...renderTrade.draft, partner: partnerSel.value }; renderTrade().catch(() => {}); };
    $('#tradePick').onclick = async () => {
      const chosen = await pickTradePokemon(tr('trade.picker_offer'));
      if (chosen) {
        renderTrade.draft = { partner: partnerSel.value, pokemon: chosen };
        renderTrade().catch(e => alert(e.message));
      }
    };
    $('#tradeSend').onclick = async () => {
      const partner = partnerSel.value;
      if (!partner) { alert(tr('trade.choose_partner')); return; }
      try {
        await api('/api/trades', { method: 'POST', body: JSON.stringify({ partner_id: partner, pokemon_id: renderTrade.draft.pokemon.id }) });
        renderTrade.draft = null;
      } catch (e) { alert(e.message); }
      refreshTradeBadge();
      render('trade');
    };
  }

  // Every trade button: POST/DELETE, then redraw (also on error, the trade may have changed meanwhile).
  const byId = new Map(data.trades.map(t => [String(t.id), t]));
  const act = (selector, handler) => el.querySelectorAll(selector).forEach(btn => {
    btn.onclick = async () => {
      const trade = byId.get(btn.closest('[data-id]').dataset.id);
      try { await handler(trade); } catch (e) { alert(e.message); }
      refreshTradeBadge();
      refreshMoney();
      render('trade');
    };
  });
  const post = (trade, action, body) => api(`/api/trades/${trade.id}/${action}`, { method: 'POST', body: body && JSON.stringify(body) });
  act('.tradeOffer', async trade => {
    const chosen = await pickTradePokemon(tr('trade.picker_counter', { name: trade.other_name }));
    if (chosen) await post(trade, 'offer', { pokemon_id: chosen.id });
  });
  act('.tradeAccept', async trade => {
    const name = p => p.nickname || speciesName(p.species);
    if (!confirm(tr('trade.accept_confirm', { give: name(trade.initiator_pokemon), get: name(trade.partner_pokemon) }))) return;
    await post(trade, 'accept');
    alert(tr('trade.completed_message'));
  });
  act('.tradeDecline', trade => post(trade, 'decline'));
  act('.tradeCancel', trade => post(trade, 'cancel'));
  act('.tradeDelete', trade => api(`/api/trades/${trade.id}`, { method: 'DELETE' }));
  wirePager(el, () => render('trade'));
}

// Seltenheits-Bonus des Haushalts: jede besiegte Liga hebt jede Stufe
// stufenspezifisch Richtung ihres Zielgewichts an, mysterioes am staerksten
// (Backend: achievements.rarity_bonus, factors je Stufe).
function rarityBonusText(bonus) {
  if (!bonus) return '';
  const pct = f => Math.round((f - 1) * 100);
  if (!bonus.regions) return tr('achievements.rarity_bonus_none',
    { mythical_max_percent: pct(bonus.max_factors.mythical) });
  return tr('achievements.rarity_bonus', {
    regions: bonus.regions,
    legendary_percent: pct(bonus.factors.legendary),
    mythical_percent: pct(bonus.factors.mythical),
  });
}

// Further permanent bonuses unlocked by achievements (backend: achievements.perks).
// Only the ones the user actually has are listed.
function perkLines(perks, regionLock) {
  if (!perks) return [];
  const lines = [];
  if (perks.regen_bonus || perks.cooldown_reduction) lines.push(tr('achievements.perk_healing',
    { regen: perks.regen_bonus, minutes: perks.cooldown_reduction }));
  if (perks.share_all_exp) lines.push(tr('achievements.perk_share_all_exp'));
  if (perks.training) lines.push(tr('achievements.perk_training'));
  if (regionLock !== 'unlocked' && perks.generations.length > 1)
    lines.push(tr('achievements.perk_generations', { gens: perks.generations.join(', ') }));
  if (perks.sprite_styles.length)
    lines.push(tr('achievements.perk_sprite_styles', { gens: perks.sprite_styles.join(', ') }));
  return lines;
}

// guide.*-i18n-Keys, die Ballliste wird live aus /api/shop gezogen statt

function guideSectionHtml(key, count) {
  const paragraphs = Array.from({ length: count }, (_, i) => `<p class="muted">${tr(`guide.${key}.p${i + 1}`)}</p>`).join('');
  return `<div class="card"><h3 style="margin-top:0">${tr(`guide.${key}.title`)}</h3>${paragraphs}</div>`;
}

// Full attacker x defender matrix built from the client-side TYPE_CHART
// (kept in sync with app/battle.py by tests/test_type_chart.py). Neutral
// cells stay empty so the deviations stand out.
function typeChartHtml() {
  const cell = (atk, def) => {
    const mult = TYPE_CHART[atk][def] ?? 1;
    const cls = mult > 1 ? 'tc-super' : mult === 0 ? 'tc-none' : mult < 1 ? 'tc-weak' : '';
    const text = mult > 1 ? '2' : mult === 0 ? '0' : mult < 1 ? '½' : '';
    return `<td class="${cls}" title="${esc(typeLabel(atk))} → ${esc(typeLabel(def))}: ×${esc(fmtMult(mult))}">${text}</td>`;
  };
  const head = TYPES.map(t =>
    `<th class="tc-col" title="${esc(typeLabel(t))}"><span style="background:${typeColor(t)}">${esc(typeLabel(t).slice(0, 3))}</span></th>`).join('');
  const rows = TYPES.map(atk =>
    `<tr><th class="tc-row">${typePill(atk)}</th>${TYPES.map(def => cell(atk, def)).join('')}</tr>`).join('');
  return `<div class="type-chart-wrap"><table class="type-chart">
    <thead><tr><th class="tc-corner">${tr('guide.typechart.attacker')}<br>${tr('guide.typechart.defender')}</th>${head}</tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

async function renderHistory() {
  const el = $('#tab-history');
  // Historie wird serverseitig geblaettert (DB kann tausende Eintraege haben) -
  // Seitenzahl kommt aus `pageState`, aber die Slice-Arbeit macht das Backend
  // (LIMIT/OFFSET in battle_history.recent), nicht pageSlice() wie bei den
  // anderen Listen, die schon komplett geladen sind.
  const page = pageState['history'] || 0;
  const data = await api(`/api/battles/history?limit=${PAGE_SIZE}&offset=${page * PAGE_SIZE}`);
  if (!data.total) {
    el.innerHTML = `<div class="card muted">${tr('history.empty')}</div>`;
    return;
  }
  const totalPages = Math.max(1, Math.ceil(data.total / PAGE_SIZE));
  if (page >= totalPages) { pageState['history'] = totalPages - 1; return renderHistory(); }
  el.innerHTML = `<div class="card muted">${tr('history.intro', { count: data.total })}</div>` +
    data.battles.map(b => `
      <div class="card">
        <div class="row">
          <span class="pill">${esc(tr(HISTORY_KIND_KEY[b.kind] || b.kind))}</span>
          ${b.rule_name ? `<span class="pill" title="${esc(tr('history.rule_hint'))}">⚙ ${esc(b.rule_name)}</span>` : ''}
          <strong class="grow">${esc(tr('history.vs', {
            opponent: b.opponent || tr('history.unknown_opponent') }))}</strong>
          <span class="pill">${esc(outcomeLabel(b.outcome))}</span>
        </div>
        <div class="muted">${esc(new Date(b.created_at).toLocaleString(jsLocale()))}</div>
        <div class="row" style="margin-top:6px;flex-wrap:wrap">
          <span>${b.money_earned ? tr('history.money_earned', { amount: fmtMoney(b.money_earned) })
                                 : tr('history.no_money')}</span>
          ${b.kind === 'trainer' || b.kind === 'pvp' ? '' :
            `<span>${tr(b.caught ? 'history.caught' : 'history.not_caught')}</span>`}

        ${historyExpHtml(b)}

  wirePager(el, () => render('history'));
}

// Overlay hinter dem Namen in der Kopfzeile. Fremde Profile (GET
// /api/users) sind bewusst einsehbar, aber rein lesend - siehe app/profiles.py.
// Die Spielerkampf-Auswahl (Gegner/Team-Code) sitzt im eigenen Tab-pvp
// (renderPvp weiter oben); pvpTeamHtml/wirePvpSection werden von dort benutzt.
// Every figure is clickable and opens the Pokémon summary (see the
// document-level handler below), so a shown Pokémon can always be inspected.
const miniTeams = [];
function pvpTeamHtml(team) {
  const id = miniTeams.push(team) - 1;
  return `<div class="mini-team">${team.map((m, i) => `
    <figure data-mini="${id}:${i}" title="${esc(tr('league.summary_hint'))}">

}

function wirePvpSection(overlay) {
  const on = (sel, fn) => { const el = overlay.querySelector(sel); if (el) el.onclick = () => fn(el); };
  on('#pvpChallenge', btn => openPvpBattle(btn.dataset.id));
  on('#showTeamCode', async btn => {
    btn.disabled = true;
    const box = overlay.querySelector('#teamCodeBox');
    try {
      const data = await api('/api/pvp/team-code');
      box.innerHTML = `<textarea id="myTeamCode" rows="3" readonly style="width:100%;margin-top:8px">${esc(data.code)}</textarea>
        <div class="row"><button class="ghost action" id="copyTeamCode">${tr('profile.team_code_copy')}</button>
          <span class="muted" id="copyHint"></span></div>
        ${pvpTeamHtml(data.team)}`;
      overlay.querySelector('#copyTeamCode').onclick = async () => {
        const field = overlay.querySelector('#myTeamCode');
        field.select();
        try { await navigator.clipboard.writeText(data.code); } catch (e) { document.execCommand('copy'); }
        overlay.querySelector('#copyHint').textContent = tr('profile.team_code_copied');
      };
    } catch (e) {
      box.innerHTML = `<div class="muted" style="margin-top:8px">${esc(e.message)}</div>`;
    } finally { btn.disabled = false; }
  });
  on('#codePreview', async btn => {
    const code = (overlay.querySelector('#codeInput').value || '').trim();
    const box = overlay.querySelector('#codePreviewBox');
    btn.disabled = true;
    try {
      const data = await api('/api/pvp/preview', { method: 'POST', body: JSON.stringify({ code }) });
      box.innerHTML = `<div class="muted" style="margin-top:8px">${esc(data.owner || tr('pvp.code_opponent'))}</div>
        ${pvpTeamHtml(data.team)}
        <div style="margin-top:8px"><button class="action" id="codeFight">${tr('profile.team_code_fight')}</button></div>`;
      overlay.querySelector('#codeFight').onclick = () => openCodeBattle(code);
    } catch (e) {
      box.innerHTML = `<div class="battle-error" style="margin-top:8px">${esc(e.message)}</div>`;
    } finally { btn.disabled = false; }
  });
}

    <rect x="10.5" y="14" width="3" height="3" style="fill:${fill}" stroke="currentColor" stroke-width="1.2"/>
    <rect x="7" y="17" width="10" height="4" rx="1" style="fill:${fill}" stroke="currentColor" stroke-width="1.4"/>
  </svg>`;
};

// The gym badge of a gym leader (www/img/badges/<trainer id>.png, shipped with
// the add-on). A leader without artwork just keeps its name, no broken image.
const badgeIcon = badge => `<img class="badge-icon" alt=""

  onerror="this.style.display='none'">`;

// Percent with as many decimals as needed to show small shares (0.005 %).
function fmtPercent(value) {
  const digits = value >= 10 ? 1 : value >= 1 ? 2 : 3;
  return value.toLocaleString(jsLocale(), { maximumFractionDigits: digits }) + ' %';
}

// Spawn share of every rarity tier in this user's queue (backend: spawn.tier_shares).
function spawnRatesHtml(rates) {
  if (!rates) return '';
  const rows = rates.tiers.map(t => `
    <div style="margin:6px 0">
      <div class="row">
        <span class="grow">${esc(tr('rarity.' + t.tier))}</span>
        <strong>${t.in_pool ? esc(fmtPercent(t.percent)) : `<span class="muted">${tr('profile.spawn_rates_locked')}</span>`}</strong>
      </div>
      <div class="exp-bar"><span style="width:${Math.min(100, t.percent)}%"></span></div>
      ${t.in_pool && rates.regions && Math.abs(t.percent - t.base_percent) >= 0.0005
        ? `<div class="muted">${tr('profile.spawn_rates_without_bonus', { percent: esc(fmtPercent(t.base_percent).replace(' %', '')) })}</div>` : ''}

}

async function openProfile(userId) {

function closeProfile() {

// ------------------------------------------------------------ Pokédex & Detail
// Funktion statt Konstante: Konstanten wuerden VOR dem ersten loadStrings()
// ausgewertet (STRINGS ist dann noch leer) und blieben dann fuer immer bei
// den rohen Keys stehen, auch nach einem Sprachwechsel.
const genLabel = g => tr('gen.' + g);
const regionLabel = key => tr('region.' + key) || key;
// Same sort/filter state shape as the box (boxView) - species have no
// favorite/locked/level of their own, so boxFilterControlsHtml hides those
// controls here; `status` (seen/caught/undiscovered) is the one filter the
// box doesn't need and the Pokédex adds via opts.status.
const dexFilter = { query: '', sort: '', type: '', generation: '', status: '', shiny: false,
  minLevel: '', stage: '', rarity: '', invert: false };

// Dex-Menu: Unterbereiche Pokédex (Default beim Oeffnen), AttackDex und AbilityDex,
// per Schnellfilter-Buttons wie im Shop umgeschaltet (siehe sectionFilterHtml).
let dexView = 'species';

async function renderDex() {
  const el = $('#tab-dex');
  el.innerHTML = `<div class="card row" style="flex-wrap:wrap">
    <button class="ghost action secBtn${dexView === 'species' ? ' active' : ''}" id="dexViewSpecies">${tr('attackdex.subnav_pokedex')}</button>
    <button class="ghost action secBtn${dexView === 'attacks' ? ' active' : ''}" id="dexViewAttacks">${tr('attackdex.subnav_attackdex')}</button>
    <button class="ghost action secBtn${dexView === 'abilities' ? ' active' : ''}" id="dexViewAbilities">${tr('abilitydex.subnav')}</button>
  </div><div id="dexViewBody"></div>`;

  $('#dexViewAttacks').onclick = () => { dexView = 'attacks'; renderDex(); };

  if (dexView === 'attacks') await renderAttackDex($('#dexViewBody'));
  else if (dexView === 'abilities') await renderAbilityDex($('#dexViewBody'));
  else await renderSpeciesDex($('#dexViewBody'));
}

async function renderSpeciesDex(el) {
  const dex = await api('/api/pokedex');
  el.innerHTML = `
    <div class="dex-summary">
      <strong>${tr('pokedex.seen_count', { count: dex.seen })}</strong>
      <strong>${tr('pokedex.caught_count', { count: dex.caught })}</strong>
      <span class="muted" id="dexShownCount"></span>
    </div>
    <div class="row card" style="margin-bottom:10px">

    </div>
    <div id="dexGrid"></div>`;
  const draw = () => {
    const shown = boxSorted(dex.entries.filter(p => boxFilterMatches(p, dexFilter)), dexFilter);
    $('#dexShownCount').textContent = tr('pokedex.of_total_shown', { total: dex.total, shown: shown.length });
    $('#dexGrid').innerHTML = `<div class="dex-grid">${shown.map(p => {
      const seen = p.seen_count > 0;
      const seenOnly = seen && !p.caught_count;
      return `<div class="card dex-entry ${seen ? (seenOnly ? 'seen-only' : '') : 'unseen'}" data-id="${esc(p.id)}" style="${seen ? 'cursor:pointer' : ''}">
        ${p.owned_now ? `<span class="dex-owned-badge" title="${esc(tr('pokedex.owned_now'))}"></span>` : ''}
        ${p.sprite_url ? `<img src="${esc(p.sprite_url)}" alt="">` : ''}
        <span class="muted">#${esc(p.id)}</span>
        <strong>${seen ? esc(speciesName(p)) : '???'}</strong>
        <span class="muted">${p.caught_count ? tr('pokedex.caught_times', { count: p.caught_count }) + (p.shiny_caught ? ' ' + shinyMark() : '')
          : seen ? tr('pokedex.seen_times', { count: p.seen_count }) : tr('pokedex.undiscovered')}</span>
      </div>`;
    }).join('') || `<div class="muted">${tr('pokedex.none_match_filters')}</div>`}</div>`;
    $('#dexGrid').querySelectorAll('.dex-entry[data-id]').forEach(card => {
      if (!card.classList.contains('unseen')) card.onclick = () => openSpeciesDex(Number(card.dataset.id));

    Object.assign(dexFilter, { query: '', sort: '', type: '', generation: '', status: '', shiny: false,

// AttackDex: Katalog-Ansicht aller Attacken (unabhaengig von Team/Item).
// "kann gelernt werden" folgt den echten Lernlisten der Spiele (moves.learners:
// Level-Up mit Level, TM, Ei) - generelle Lernbarkeit, nicht ein konkretes
// Team-Pokémon auf Level Y. Nur bereits gesichtete Arten zaehlen/stehen zur
// Auswahl, damit nichts Unentdecktes verraten wird (wie im Pokédex-Grid).
const attackDexFilter = { search: '', type: '', category: '', minPower: '', species: '', sort: 'name' };
// Katalog + gesichtete Arten, beim Oeffnen des Tabs geladen; die Suche
// zeichnet nur die Ergebnisliste neu (Fokus im Suchfeld bleibt erhalten).
let attackDexData = null;
const ATTACKDEX_SORT = {
  name: (a, b) => localizedName(a).localeCompare(localizedName(b)),
  power: (a, b) => (b.power ?? -1) - (a.power ?? -1) || localizedName(a).localeCompare(localizedName(b)),
  level: (a, b) => a.min_level - b.min_level || localizedName(a).localeCompare(localizedName(b)),
};

// How a species learns the move (moves.learners, as in the games): a label
// like "Lv. 36", "TM" or "Egg" - null if it can't learn it at all.
function speciesLearnLabel(sp, move) {
  const learners = move.learners || {};
  const id = Number(sp.id);
  const level = (learners.level || {})[String(id)];
  if (level != null) return tr('common.level_short', { level });
  if ((learners.tm || []).includes(id)) return tr('move.via_tm');
  if ((learners.egg || []).includes(id)) return tr('move.via_egg');
  return null;
}
const speciesLearnsMove = (sp, move) => speciesLearnLabel(sp, move) != null;

function attackDexMoveMatches(move) {
  const f = attackDexFilter;
  const query = f.search.trim().toLowerCase();
  if (query && ![move.name, move.name_de].some(n => n && n.toLowerCase().includes(query))) return false;
  if (f.type && move.type !== f.type) return false;
  if (f.category && move.category !== f.category) return false;
  if (f.minPower && !(move.power != null && move.power >= Number(f.minPower))) return false;
  if (f.species) {
    const sp = attackDexData.speciesById[f.species];
    if (!sp || !speciesLearnsMove(sp, move)) return false;
  }
  return true;
}

// Karte im Stil der Pokédex-Eintraege: Typfarbe am linken Rand, Typ-Plakette,
// Kategorie-Tag, Staerke/Genauigkeit gross, Zusatzeffekte klein darunter.
const attackCardHtml = move => {
  const effects = moveEffectLines(move).join(' · ');
  return `<div class="card atk-card" data-key="${esc(move.key)}" style="border-left-color:${typeColor(move.type)}">
    <div class="atk-card-head">
      <strong class="move-name">${esc(localizedName(move))}</strong>${typePill(move.type)}
    </div>
    <div class="atk-card-tags">
      <span class="pill cat-pill cat-${esc(move.category)}">${esc(categoryLabel(move.category))}</span>${move.status ? statusPill(move.status) : ''}
    </div>
    <div class="atk-stats">
      <span><span class="muted">${tr('attackdex.stat_power')}</span> <b>${move.power == null ? '—' : esc(move.power)}</b></span>
      <span><span class="muted">${tr('attackdex.stat_accuracy')}</span> <b title="${esc(move.accuracy == null ? tr('move.always_hits') : '')}">${move.accuracy == null ? '—' : esc(move.accuracy) + '%'}</b></span>
      <span class="muted">${tr('move.tm_from_level', { level: move.min_level })}</span>
    </div>
    ${effects ? `<div class="atk-effect">${esc(effects)}</div>` : ''}
  </div>`;
};

function drawAttackDexResults() {
  const shown = attackDexData.moves.filter(attackDexMoveMatches)
    .sort(ATTACKDEX_SORT[attackDexFilter.sort]);
  $('#atkResults').innerHTML = `
    <div class="muted" style="margin-bottom:10px">${tr('attackdex.count_shown', { total: attackDexData.moves.length, shown: shown.length })}</div>
    <div class="atk-grid">${shown.map(attackCardHtml).join('') || `<div class="muted">${tr('attackdex.none_match_filters')}</div>`}</div>`;
  $('#atkResults').querySelectorAll('.atk-card').forEach(card => {
    card.onclick = () => openAttackDexMove(card.dataset.key);
  });
}

// Attacken-Fenster mit der Lernliste der gesichteten Arten (gleiche Regel wie
// der Pokémon-Filter oben), jeweils mit Lernweg (Level, TM, Ei).
function openAttackDexMove(key) {
  const move = attackDexData.moves.find(m => m.key === key);
  const learners = attackDexData.seenSpecies.filter(p => speciesLearnsMove(p, move));
  const list = learners.length
    ? `<div class="atk-learners">${learners.map(p => `<span class="pill">#${esc(p.id)} ${esc(speciesName(p))} · ${esc(speciesLearnLabel(p, move))}</span>`).join('')}</div>`
    : `<div class="muted">${tr('attackdex.learned_none')}</div>`;
  openMoveInfo(move, `<div style="margin-top:10px"><strong>${tr('attackdex.learned_by', { count: learners.length })}</strong>${list}</div>`);
}

async function renderAttackDex(el) {
  const [movedex, dex] = await Promise.all([api('/api/movedex'), api('/api/pokedex')]);
  const seenSpecies = dex.entries.filter(p => p.seen_count > 0);
  attackDexData = {
    moves: movedex.moves,
    seenSpecies,
    speciesById: Object.fromEntries(seenSpecies.map(p => [String(p.id), p])),
  };
  const f = attackDexFilter;
  const catBtn = (value, label) =>
    `<button class="ghost action secBtn${f.category === value ? ' active' : ''}" data-cat="${esc(value)}">${esc(label)}</button>`;
  const typeBtn = k =>
    `<button class="atk-type-btn${f.type === k ? ' active' : ''}" data-type="${esc(k)}" title="${esc(typeLabel(k))}" aria-label="${esc(typeLabel(k))}">${typePill(k)}</button>`;
  el.innerHTML = `
    <div class="card" style="margin-bottom:10px">
      <div class="row">
        <input type="search" id="atkFSearch" class="grow" placeholder="${esc(tr('attackdex.search_placeholder'))}" value="${esc(f.search)}">
        <span class="muted">${tr('attackdex.sort_label')}</span>
        <select id="atkFSort">
          <option value="name" ${f.sort === 'name' ? 'selected' : ''}>${tr('attackdex.sort_name')}</option>
          <option value="power" ${f.sort === 'power' ? 'selected' : ''}>${tr('attackdex.sort_power')}</option>
          <option value="level" ${f.sort === 'level' ? 'selected' : ''}>${tr('attackdex.sort_level')}</option>
        </select>
      </div>
      <div class="row" style="margin-top:8px">
        ${catBtn('', tr('attackdex.all_categories'))}${catBtn('physical', tr('category.physical'))}${catBtn('special', tr('category.special'))}${catBtn('status', tr('category.status'))}
      </div>
      <div class="atk-type-bar" style="margin-top:8px">${TYPES.map(typeBtn).join('')}</div>
      <div class="row" style="margin-top:8px">
        <label>${tr('attackdex.min_power')} <input type="number" id="atkFPower" min="0" step="5" style="width:5em" value="${esc(f.minPower)}"></label>
        <select id="atkFSpecies">
          <option value="">${tr('attackdex.all_pokemon')}</option>${seenSpecies
            .slice().sort((a, b) => a.id - b.id)
            .map(p => `<option value="${esc(p.id)}" ${f.species === String(p.id) ? 'selected' : ''}>#${esc(p.id)} ${esc(speciesName(p))}</option>`).join('')}
        </select>
        <button class="ghost" id="atkFReset">${tr('common.reset')}</button>
      </div>
    </div>
    <div id="atkResults"></div>`;
  // Kategorie/Typ/Filter per Neuaufbau der Ansicht (Katalog ist gecacht genug,
  // der Tab ist klein); nur die Suche zeichnet bloss die Ergebnisse neu.
  el.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { f.category = b.dataset.cat; renderAttackDex(el); });
  el.querySelectorAll('[data-type]').forEach(b => b.onclick = () => {
    f.type = f.type === b.dataset.type ? '' : b.dataset.type;
    renderAttackDex(el);
  });
  $('#atkFSearch').oninput = e => { f.search = e.target.value; drawAttackDexResults(); };
  $('#atkFSort').onchange = e => { f.sort = e.target.value; drawAttackDexResults(); };
  $('#atkFPower').onchange = e => { f.minPower = e.target.value; renderAttackDex(el); };
  $('#atkFSpecies').onchange = e => { f.species = e.target.value; renderAttackDex(el); };
  $('#atkFReset').onclick = () => {
    Object.assign(f, { search: '', type: '', category: '', minPower: '', species: '' });
    renderAttackDex(el);
  };
  drawAttackDexResults();
}

// AbilityDex: catalog view of all abilities. `species` from the API only
// holds species the user has already seen (no spoilers, like the Pokédex
// grid); `owned` counts the user's own Pokémon with that ability.
const abilityDexFilter = { search: '', status: '', species: '', owned: false, sort: 'name' };
// Loaded when the view opens; the search only redraws the results so the
// search field keeps its focus.
let abilityDexData = null;
const ABILITY_INACTIVE_REASONS = ['todo', 'mechanic', 'weather', 'doubles', 'overworld'];
const ABILITYDEX_SORT = {
  name: (a, b) => localizedName(a).localeCompare(localizedName(b)),
  holders: (a, b) => b.species.length - a.species.length || localizedName(a).localeCompare(localizedName(b)),
};

function abilityDexMatches(ability) {
  const f = abilityDexFilter;
  const query = f.search.trim().toLowerCase();
  if (query && ![ability.name, ability.name_de, ability.description, ability.description_de]
    .some(text => text && text.toLowerCase().includes(query))) return false;
  if (f.status === 'active' && !ability.active) return false;
  if (f.status === 'inactive' && ability.active) return false;
  if (ABILITY_INACTIVE_REASONS.includes(f.status) && ability.inactive !== f.status) return false;
  if (f.species && !ability.species.some(sp => String(sp.id) === f.species)) return false;
  if (f.owned && !ability.owned) return false;
  return true;
}

const abilityStatusPill = ability => ability.active
  ? `<span class="pill abl-on">${tr('abilitydex.active')}</span>`
  : `<span class="pill" title="${esc(abilityInactiveNote(ability))}">${tr('abilitydex.reason.' + (ability.inactive || 'unknown'))}</span>`;

const abilityCardHtml = ability => `<div class="card atk-card abl-card${ability.active ? ' abl-active' : ''}" data-key="${esc(ability.key)}">
    <div class="atk-card-head">
      <strong class="move-name">${esc(localizedName(ability))}</strong>${abilityStatusPill(ability)}
    </div>
    <div class="abl-desc">${esc(abilityDescription(ability))}</div>
    <div class="abl-foot muted">
      <span>${tr('abilitydex.seen_holders', { count: ability.species.length })}</span>
      ${ability.owned ? `<span>${tr('abilitydex.owned_count', { count: ability.owned })}</span>` : ''}
    </div>
  </div>`;

function drawAbilityDexResults() {
  const shown = abilityDexData.abilities.filter(abilityDexMatches)
    .sort(ABILITYDEX_SORT[abilityDexFilter.sort]);
  $('#ablResults').innerHTML = `
    <div class="muted" style="margin-bottom:10px">${tr('abilitydex.count_shown', { total: abilityDexData.abilities.length, shown: shown.length })}</div>
    <div class="atk-grid">${shown.map(abilityCardHtml).join('') || `<div class="muted">${tr('abilitydex.none_match_filters')}</div>`}</div>`;
  $('#ablResults').querySelectorAll('.abl-card').forEach(card => {
    card.onclick = () => openAbilityDexEntry(card.dataset.key);
  });
}

// Ability window plus the seen species that can have it (hidden ability flagged).
function openAbilityDexEntry(key) {
  const ability = abilityDexData.abilities.find(a => a.key === key);
  const holders = ability.species.map(sp => ({ ...sp, info: abilityDexData.speciesById[String(sp.id)] }))
    .filter(sp => sp.info);
  const list = holders.length
    ? `<div class="atk-learners">${holders.map(sp => `<span class="pill">#${esc(sp.id)} ${esc(speciesName(sp.info))}${sp.hidden ? ` · ${tr('admin.ability_hidden')}` : ''}</span>`).join('')}</div>`
    : `<div class="muted">${tr('abilitydex.holders_none')}</div>`;
  openAbilityInfo(ability, `
    <div style="margin-top:8px">${abilityStatusPill(ability)}</div>
    ${ability.owned ? `<div class="muted" style="margin-top:6px">${tr('abilitydex.owned_count', { count: ability.owned })}</div>` : ''}
    <div style="margin-top:10px"><strong>${tr('abilitydex.holders', { count: holders.length })}</strong>${list}</div>`);
}

async function renderAbilityDex(el) {
  const [abilitydex, dex] = await Promise.all([api('/api/abilitydex'), api('/api/pokedex')]);
  const seenSpecies = dex.entries.filter(p => p.seen_count > 0);
  abilityDexData = {
    abilities: abilitydex.abilities,
    speciesById: Object.fromEntries(seenSpecies.map(p => [String(p.id), p])),
  };
  const f = abilityDexFilter;
  const statusBtn = (value, label) =>
    `<button class="ghost action secBtn${f.status === value || (value === 'inactive' && ABILITY_INACTIVE_REASONS.includes(f.status)) ? ' active' : ''}" data-status="${esc(value)}">${esc(label)}</button>`;
  el.innerHTML = `
    <div class="card" style="margin-bottom:10px">
      <div class="row">
        <input type="search" id="ablFSearch" class="grow" placeholder="${esc(tr('abilitydex.search_placeholder'))}" value="${esc(f.search)}">
        <span class="muted">${tr('attackdex.sort_label')}</span>

const evolutionRequirement = transition => {
  const parts = [];
  if (transition.min_level) parts.push(tr('common.level_short', { level: transition.min_level }));
  if (transition.item) parts.push(transition.item.replaceAll('_', ' '));
  const labels = {
    gender: tr('admin.gender'), time_of_day: tr('evolution.time_of_day'),
    held_item: tr('evolution.holds'), trade_species: tr('evolution.trade_for'),
  };
  Object.entries(transition.conditions || {}).forEach(([key, value]) => {
    if (key === 'friendship') parts.push(tr('evolution.friendship'));
    else parts.push(`${labels[key] || key}: ${value}`);
  });
  if (!parts.length) parts.push(
    transition.trigger === 'trade' ? tr('evolution.trade')
      : transition.trigger === 'level-up' ? tr('evolution.level_up') : transition.trigger);
  return parts.join(' · ');
};

function evoLineHtml(line) {
  const byId = Object.fromEntries((line.species || []).map(item => [item.id, item]));
  const transitions = line.transitions || [];
  if (!transitions.length) return `<span class="muted">${tr('evolution.none_known')}</span>`;
  const monBox = mon => `<div class="evo-mon">${mon.sprite_url ? `<img src="${esc(mon.sprite_url)}" alt="">` : ''}<strong>${esc(speciesName(mon))}</strong></div>`;
  let html = '';
  let lastToId = null;
  transitions.forEach(edge => {
    const from = byId[edge.from_species_id] || {}, to = byId[edge.to_species_id] || {};
    // Chained transitions (A->B, B->C) share the middle stage - only render
    // it once instead of as both the previous "to" and this "from" (that
    // duplication was the bug: "Squirtle -> Wartortle Wartortle -> Blastoise").
    const chained = edge.from_species_id === lastToId;
    if (!chained) html += `${html ? '</div>' : ''}<div class="evo-step">${monBox(from)}`;
    html += `<div class="evo-arrow"><strong>→</strong><span class="muted">${esc(evolutionRequirement(edge))}</span></div>${monBox(to)}`;
    lastToId = edge.to_species_id;
  });
  return html + '</div>';
}

// Basiswerte als Balken (Skala 0-255) plus Summe - Pokédex und Pokémon-Menue.
function statBarsHtml(stats) {
  const max = 255;
  const entries = ['hp', 'atk', 'def', 'spa', 'spd', 'spe'].filter(key => stats[key] != null).map(key => [key, Number(stats[key])]);
  if (!entries.length) return '';
  const total = entries.reduce((sum, [, value]) => sum + value, 0);
  return entries.map(([key, value]) => `
    <div class="stat-row">
      <span class="stat-name">${esc(ivLabel(key))}</span>
      <div class="stat-bar"><span style="width:${Math.round(100 * Math.min(max, value) / max)}%"></span></div>
      <span class="stat-value">${esc(value)}</span>
    </div>`).join('') + `
    <div class="stat-row stat-total">
      <span class="stat-name">${tr('pokedex.base_stats_total')}</span>
      <span style="flex:1"></span>
      <span class="stat-value">${esc(total)}</span>
    </div>`;
}

// IV-Untergrenze der Art (species.min_ivs, siehe economy.py): wie statBarsHtml,
// aber gegen die IV-Skala (0-31) - zeigt, was Fänge dieser Art bereits fuer
// alle Spieler des Haushalts freigeschaltet haben.
function ivFloorBarsHtml(minIvs) {
  if (!minIvs) return '';
  const max = 31;
  return ['hp', 'atk', 'def', 'spa', 'spd', 'spe'].map(key => {
    const value = Number(minIvs[key] || 0);
    return `<div class="stat-row">
      <span class="stat-name">${esc(ivLabel(key))}</span>
      <div class="stat-bar"><span style="width:${Math.round(100 * Math.min(max, value) / max)}%"></span></div>
      <span class="stat-value">${esc(value)}${value >= max ? ' ★' : ''}</span>
    </div>`;
  }).join('');
}

// Fleisspunkte (EVs, siehe app/evs.py): wie statBarsHtml, aber gegen die
// Obergrenze pro Wert - plus den Punkte-Gewinn auf Level 100 je Wert.
function evBarsHtml(ev) {
  if (!ev || !ev.values) return '';
  const max = Math.max(1, Number(ev.max_per_stat) || 1);
  const rows = ['hp', 'atk', 'def', 'spa', 'spd', 'spe'].map(key => {
    const value = Number(ev.values[key] || 0);
    const points = Number((ev.points || {})[key] || 0);
    return `<div class="stat-row" title="${esc(tr('evs.bar_title', { stat: ivLabel(key), ev: value, points }))}">
      <span class="stat-name">${esc(ivLabel(key))}</span>
      <div class="stat-bar"><span style="width:${Math.round(100 * Math.min(max, value) / max)}%"></span></div>
      <span class="stat-value">${esc(value)}${points ? ` (+${esc(points)})` : ''}</span>
    </div>`;
  }).join('');
  return `<div style="margin-top:16px">
    <strong>${tr('evs.title')}</strong> <span class="pill">${tr('evs.total', { total: ev.total, max: ev.max_total })}</span>
    <div class="muted" style="margin:4px 0 8px">${tr('evs.hint')}</div>${rows}</div>`;
}

function drawIvChart(ivs, minIvs) {
  const canvas = $('#ivChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const keys = ['hp', 'atk', 'def', 'spd', 'spe', 'spa'];
  const center = 150, radius = 105;
  const styles = getComputedStyle(document.body);
  const pointAt = (i, value) => {
    const angle = -Math.PI / 2 + i * Math.PI / 3;
    const r = radius * Number(value || 0) / 31;
    return [center + Math.cos(angle) * r, center + Math.sin(angle) * r];
  };
  const tracePolygon = values => {
    ctx.beginPath();
    keys.forEach((key, i) => {
      const [x, y] = pointAt(i, values[key]);
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    });
    ctx.closePath();
  };
  ctx.clearRect(0, 0, 300, 300);
  ctx.font = '12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let ring = 1; ring <= 5; ring++) {
    ctx.beginPath();
    keys.forEach((_, i) => {
      const angle = -Math.PI / 2 + i * Math.PI / 3;
      const r = radius * ring / 5;
      const x = center + Math.cos(angle) * r, y = center + Math.sin(angle) * r;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    });
    ctx.closePath(); ctx.strokeStyle = styles.getPropertyValue('--line'); ctx.stroke();
  }
  // Haushaltsweite IV-Untergrenze dieser Art (species.min_ivs) als
  // gestrichelte Huelle hinter dem eigentlichen IV-Polygon.
  if (minIvs && Object.keys(minIvs).length) {
    tracePolygon(minIvs);
    ctx.setLineDash([5, 4]); ctx.strokeStyle = '#4c88ee'; ctx.lineWidth = 2; ctx.stroke();
    ctx.setLineDash([]);
  }
  tracePolygon(ivs);
  ctx.fillStyle = 'rgba(238,76,76,.28)'; ctx.fill();
  ctx.strokeStyle = '#ee4c4c'; ctx.lineWidth = 2; ctx.stroke();
  keys.forEach((key, i) => {
    const angle = -Math.PI / 2 + i * Math.PI / 3;
    ctx.fillStyle = styles.getPropertyValue('--text');
    ctx.fillText(`${ivLabel(key)} ${ivs[key]}`, center + Math.cos(angle) * 132, center + Math.sin(angle) * 132);
  });
}

      api('/api/team/party', { method: 'PUT', body: JSON.stringify({ order: [...partyIds, ownedId] }) }));
    if ($('#pokeRelease')) $('#pokeRelease').onclick = async () => {
      if (!confirm(tr('team.release_confirm', { name: p.name, level: p.level }))) return;
      try {
        const r = await api(`/api/team/${encodeURIComponent(ownedId)}`, { method: 'DELETE' });
        let msg = tr('team.released', { name: r.name });
        if (r.rare_candy_awarded) msg += ' ' + tr('team.release_candy_reward', { count: r.rare_candy_awarded });
        alert(msg);
        closePokemon();
      } catch (e) { alert(e.message); }
    };
    if ($('#pokeTraining')) $('#pokeTraining').onclick = () => startTraining(ownedId, $('#pokeTrainingMode').value);
    $('#pokeBuddy').onclick = async () => {
      if (await setBuddy(isBuddy ? null : ownedId, buddyInfo)) openPokemon(ownedId);
    };
    $('#pokeFavorite').onclick = async () => {
      await toggleFavorite(ownedId, !p.favorite);
      openPokemon(ownedId);
    };
    $('#pokeLock').onclick = async () => {
      await toggleLocked(ownedId, !p.locked);
      openPokemon(ownedId);
    };
    if ($('#pokeUnequip')) $('#pokeUnequip').onclick = () => afterTeamChange(() =>
      api(`/api/team/${encodeURIComponent(ownedId)}/held-item`, { method: 'PUT', body: JSON.stringify({ item: null }) }));
    if ($('#pokeEquip')) $('#pokeEquip').onclick = () => {
      const item = $('#pokeItemSel').value;
      if (item) afterTeamChange(() => api(`/api/team/${encodeURIComponent(ownedId)}/held-item`, { method: 'PUT', body: JSON.stringify({ item }) }));
    };
    const evoButtons = () => overlay.querySelectorAll('.evoBtn, .evoItemBtn');
    overlay.querySelectorAll('.evoBtn').forEach(btn => {
      btn.onclick = async () => {
        const target = (p.level_evolutions || []).find(e => String(e.to_species_id) === btn.dataset.to);
        const toName = target ? evoTargetName(target) : '?';
        if (!confirm(tr('evolution.confirm', { name: p.name, to: toName }))) return;
        evoButtons().forEach(b => { b.disabled = true; });
        try {
          const r = await api(`/api/team/${encodeURIComponent(ownedId)}/evolve`, {
            method: 'POST', body: JSON.stringify({ to_species_id: Number(btn.dataset.to) })
          });
          let msg = tr('evolution.evolved', { name: p.name, to: toName });
          if (r.shedinja) msg += ' ' + tr('evolution.shedinja_appeared', { name: r.shedinja.name });
          openPokemon(ownedId, msg);
        } catch (e) {
          $('#evoError').textContent = e.message;
          evoButtons().forEach(b => { b.disabled = false; });
        }
      };
    });
    overlay.querySelectorAll('.evoItemBtn').forEach(btn => {
      btn.onclick = async () => {
        const target = (p.item_evolutions || []).find(e =>
          e.item_key === btn.dataset.item && String(e.to_species_id) === btn.dataset.to);
        const toName = target ? evoTargetName(target) : '?';
        if (!confirm(tr('evolution.confirm', { name: p.name, to: toName }))) return;
        evoButtons().forEach(b => { b.disabled = true; });
        try {
          await api(`/api/pokemon/${encodeURIComponent(ownedId)}/use-item`, {
            method: 'POST', body: JSON.stringify({ item_key: btn.dataset.item })
          });
          openPokemon(ownedId, tr('evolution.evolved', { name: p.name, to: toName }));
        } catch (e) {
          $('#evoError').textContent = e.message;
          evoButtons().forEach(b => { b.disabled = false; });
        }
      };
    });
    if (canToggleShiny) {
      $('#pokeShinyToggle').onclick = () => {
        showingShiny = !showingShiny;
        $('#pokeDetailSprite').src = showingShiny ? sp.shiny_sprite_url : sp.sprite_url;
        $('#pokeShinyToggle').textContent = showingShiny ? tr('pokedex.show_normal') : tr('pokedex.show_shiny');
      };
    }
    const updateMoveLimit = () => {
      const checked = overlay.querySelectorAll('.move-choice input:checked').length;
      overlay.querySelectorAll('.move-choice label').forEach(label => {
        const input = label.querySelector('input');
        input.disabled = !input.checked && checked >= 4;
        label.classList.toggle('checked', input.checked);
        label.classList.toggle('disabled', input.disabled);
      });
      $('#moveStatus').textContent = tr('team.n_of_4_selected', { count: checked });
    };
    overlay.querySelectorAll('.move-choice input').forEach(input => { input.onchange = updateMoveLimit; });
    updateMoveLimit();
    $('#saveMoves').onclick = async () => {
      const selected = [...overlay.querySelectorAll('.move-choice input:checked')].map(input => input.value);
      if (selected.length < 1 || selected.length > 4) { $('#moveStatus').textContent = tr('team.select_1_to_4_alert'); return; }
      try {
        await api(`/api/team/${encodeURIComponent(ownedId)}/moves`, { method: 'PUT', body: JSON.stringify({ moves: selected }) });
        $('#moveStatus').textContent = tr('common.saved_period');
      } catch (e) { $('#moveStatus').textContent = e.message; }
    };
  } catch (e) {
    overlay.innerHTML = `<div class="pokemon-detail"><button class="ghost action" onclick="closePokemon()">${tr('common.back')}</button><div class="card">${tr('header.error', { message: esc(e.message) })}</div></div>`;
  }
}

// Statuswert-Aenderungen einer Attacke ("stat_changes": [{stat, stages, target}])
// als lesbare Liste, z.B. "-1 SpA (target)" oder "+2 Atk (self)".
function moveStatChangesInfo(move) {
  if (!move.stat_changes || !move.stat_changes.length) return '';
  const parts = move.stat_changes.map(c => {
    const key = c.target === 'self' ? 'move.stat_change_self' : 'move.stat_change_target';
    const stages = (c.stages > 0 ? '+' : '') + c.stages;
    return tr(key, { stat: ivLabel(c.stat), stages });
  });
  const chance = move.stat_chance != null && move.stat_chance < 100 ? ` (${move.stat_chance}%)` : '';
  return parts.join(', ') + chance;
}

// Selbstheilung einer Attacke ("heal": Anteil der Max-KP), z.B. "Heilt 50 % KP".
const moveHealInfo = move => move.heal ? tr('move.heals', { percent: Math.round(move.heal * 100) }) : '';

// Zusatzeffekte einer Attacke als Kurztexte (Drain, Rueckstoss, Crit, ...) -
// gemeinsam fuer die AttackDex-Karten und das Attacken-Fenster.
function moveEffectLines(m) {
  const stat = moveStatChangesInfo(m);
  return [
    stat ? `${tr('move.stat_changes')}: ${stat}` : '',
    moveHealInfo(m),
    m.drain ? tr('move.effect_drain', { percent: Math.round(m.drain * 100) }) : '',
    m.recoil ? tr('move.effect_recoil', { percent: Math.round(m.recoil * 100) }) : '',
    m.flinch_chance ? tr('move.effect_flinch', { chance: m.flinch_chance }) : '',
    m.high_crit ? tr('move.effect_crit') : '',
    m.priority ? tr('move.effect_priority', { priority: (m.priority > 0 ? '+' : '') + m.priority }) : '',
    m.trap ? tr('move.effect_trap') : '',
    m.curse ? tr('move.effect_curse') : '',
    m.reset_stats ? tr('move.effect_reset') : '',
  ].filter(Boolean);
}

// Attacken-Kurzinfo (Typ/Staerke/Genauigkeit/Status/Statuswert-Aenderungen)

// Attacken-Katalog fuer die Item-Kurzinfo (TMs zeigen Typ/Staerke/Genauigkeit
// ihrer Attacke) - einmal geladen und wiederverwendet, unabhaengig davon, ob

async function moveByKey(key) {
