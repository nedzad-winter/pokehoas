// Kleine Fenster (Pokemon/Species/Attacke/Faehigkeit/Item) schliessen sich per
// Klick auf den abgedunkelten Hintergrund oder Escape, ohne die Dex-/Team-Liste
// dahinter zu verlassen (anders als die frueheren vollflaechigen Overlays).
[['pokemonOverlay', closePokemon], ['speciesOverlay', closeSpeciesDex], ['moveOverlay', closeMoveInfo], ['abilityOverlay', closeAbilityInfo], ['itemOverlay', closeItemInfo], ['enemyOverlay', closeEnemySummary]]
  .forEach(([id, closeFn]) => {
    const overlay = $('#' + id);
    overlay.addEventListener('click', e => { if (e.target === overlay) closeFn(); });
  });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('#enemyOverlay').classList.contains('hidden')) closeEnemySummary();
  else if (!$('#moveOverlay').classList.contains('hidden')) closeMoveInfo();
  else if (!$('#abilityOverlay').classList.contains('hidden')) closeAbilityInfo();
  else if (!$('#itemOverlay').classList.contains('hidden')) closeItemInfo();
  else if (!$('#pokemonOverlay').classList.contains('hidden')) closePokemon();
  else if (!$('#speciesOverlay').classList.contains('hidden')) closeSpeciesDex();
});

// ------------------------------------------------------------------- Team
// Only ever used for the party list (Team sub-tab) - the box has its own
// compact grid view (boxSlotHtml), reachable via the Pokémon detail popup
// for team/box moves and held items.
function monCard(p, opts) {
  const sp = p.species || {};
  const span = p.exp_next_level ? (p.exp_next_level - p.exp_level_start) : 0;
  const expPct = span > 0 ? Math.max(0, Math.min(100, Math.round(100 * (p.exp - p.exp_level_start) / span))) : 100;
  const ivs = Object.entries(p.ivs || {}).map(([k, v]) => `${esc(ivLabel(k))} ${esc(v)}`).join(' · ');
  const ivsLine = opts.showIvs ? `<div class="muted">IVs: ${ivs}</div>` : '';
  const moves = (p.moves || []).map(m =>
    `<span class="pill type-pill move-pill" data-move-key="${esc(m.key)}" style="background:${typeColor(m.type)};cursor:pointer" title="${esc(moveInfo(m))}">${esc(localizedName(m))}</span>`
  ).join('');
  const lock = opts.locked ? 'disabled' : '';
  const info = p.held_item_info;
  const invOptions = Object.entries(opts.inventory)
    .map(([k, n]) => `<option value="${esc(k)}">${esc(localizedName(opts.catalog[k]) !== '?' ? localizedName(opts.catalog[k]) : k)} (${esc(n)})</option>`).join('');
  const held = `
    <div class="row" style="margin-top:8px">
      <span class="muted">${tr('team.item_label')}</span>
      ${info ? `<img class="item-icon" src="${esc(info.sprite_url)}" alt="" onerror="this.style.display='none'"><span class="pill" title="${esc(pick(info, 'description'))}">${esc(localizedName(info))}</span>
        <button class="ghost action tmUnequip" ${lock}>${tr('team.unequip')}</button>` : '<span class="muted">—</span>'}
      ${invOptions ? `<select class="tmItem" ${lock}>${invOptions}</select>
        <button class="ghost action tmEquip" ${lock}>${info ? tr('team.swap') : tr('team.equip')}</button>` : ''}
    </div>`;
  const buttons = `<button class="ghost action tmUp" title="${tr('team.move_up')}" ${lock || (opts.index === 0 ? 'disabled' : '')}>↑</button>
       <button class="ghost action tmDown" title="${tr('team.move_down')}" ${lock || (opts.index === opts.count - 1 ? 'disabled' : '')}>↓</button>
       <button class="ghost action tmBox" ${lock || (opts.count <= 1 ? 'disabled' : '')}>${tr('team.to_box')}</button>`;
  return `<div class="card mon" data-id="${esc(p.id)}">
    <div class="row">
      ${sp.sprite_url ? `<img class="sprite" src="${esc(p.shiny && sp.shiny_sprite_url ? sp.shiny_sprite_url : sp.sprite_url)}" alt="">` : ''}
      <div class="grow">
        <span class="pill">#${esc(p.party_slot)}</span>
        <strong>${esc(p.name)}</strong> ${p.shiny ? shinyMark() : ''}${p.favorite ? favMark() : ''} <span class="muted">${tr('common.level_short', { level: p.level })}</span>
        ${(p.level_evolutions || []).length || (p.item_evolutions || []).length ? `<span class="pill evo-badge">${tr('evolution.badge')}</span>` : ''}<br>
        ${[sp.type1, sp.type2].filter(Boolean).map(typePill).join('')}${abilityPill(p.ability_info)}
        ${hpBar(p.current_hp, p.max_hp)}
        <span class="muted">${esc(p.current_hp)}/${esc(p.max_hp)} HP${p.fainted ? ' · ' + tr('team.fainted') : ''}</span>
        <div class="exp-bar" title="${tr('team.exp_title', { exp: esc(p.exp), next: p.exp_next_level ? ' / ' + esc(p.exp_next_level) : '' })}"><span style="width:${expPct}%"></span></div>
        ${ivsLine}
      </div>
      <div class="row" style="gap:6px">${buttons}</div>
    </div>
    <div style="margin-top:8px">${moves}</div>
    ${held}
  </div>`;
}

// Compact box view (à la in-game PC box): just sprite/name/level/HP in a
// grid, no per-slot actions - clicking opens the full Pokémon detail popup,
// which has "to team"/"to box" and held-item controls (see openPokemon).
function boxSlotHtml(p, selectable, selectedIds = boxSelection) {
  const sp = p.species || {};
  const selected = selectable && selectedIds.has(p.id);
  return `<div class="card box-slot${p.fainted ? ' fainted' : ''}${selected ? ' selected' : ''}" data-id="${esc(p.id)}"
      title="${esc(p.name)} · ${esc(tr('common.level_short', { level: p.level }))}${p.locked ? ' · ' + esc(tr('team.locked_hint')) : ''}">
    ${selectable ? `<input type="checkbox" class="box-sel" aria-label="${esc(tr('team.box_select_one', { name: p.name }))}"${selected ? ' checked' : ''}>` : ''}
    <span class="fav-star${p.favorite ? ' on' : ''}" data-fav-id="${esc(p.id)}"
      title="${esc(p.favorite ? tr('team.favorite_remove') : tr('team.favorite_add'))}">${p.favorite ? '★' : '☆'}</span>
    ${p.locked ? lockMark(`data-lock-id="${esc(p.id)}"`) : ''}
    ${sp.sprite_url ? `<img src="${esc(p.shiny && sp.shiny_sprite_url ? sp.shiny_sprite_url : sp.sprite_url)}" alt="">` : ''}
    <div class="box-slot-name">${esc(p.name)}${p.shiny ? shinyMark() : ''}</div>
    <div class="muted">${tr('common.level_short', { level: p.level })}</div>
    ${hpBar(p.current_hp, p.max_hp)}
  </div>`;
}
// Box sort/filter state (kept across re-renders, not persisted). Default
// order is the National Dex.
const boxView = { sort: 'dex_asc', type: '', shiny: false, favorite: false, minLevel: '',
  stage: '', rarity: '', canEvolve: false, select: false,
  generation: '', locked: false, invert: false };
const BOX_RARITY_TIERS = ['common', 'rare', 'pseudo_legendary', 'paradox', 'legendary', 'mythical'];
// Level evolution without item and with exactly one target - those can be
// evolved together from the box selection (POST /api/team/evolve-many).
const boxBulkEvolvable = p => (p.level_evolutions || []).length === 1;
const boxCanEvolve = p => (p.level_evolutions || []).length > 0 || (p.item_evolutions || []).length > 0;
// Box Pokémon ticked for a multi-release, bulk evolution or bulk lock/unlock
// (only while boxView.select is on). Locked ones can be ticked too - release
// simply leaves them out.
const boxSelection = new Set();
const boxSortLabels = () => ({
  level_desc: tr('team.box_sort_level_desc'), level_asc: tr('team.box_sort_level_asc'),
  dex_asc: tr('team.box_sort_dex_asc'), dex_desc: tr('team.box_sort_dex_desc'),
  gen_asc: tr('team.box_sort_gen_asc'), gen_desc: tr('team.box_sort_gen_desc'),
});
function boxSorted(box, view = boxView) {
  // Box/trade/battle-picker Pokémon nest their species under `.species`;
  // Pokédex entries (passed in by renderSpeciesDex) *are* a species row, so
  // they fall through to the plain object instead.
  const dex = p => (p.species || p).id || p.species_id || 0;
  const gen = p => (p.species || p).generation || 0;
  const lvl = p => p.level ?? p.max_level ?? -1;
  const cmp = {
    level_desc: (a, b) => lvl(b) - lvl(a),
    level_asc: (a, b) => lvl(a) - lvl(b),
    dex_asc: (a, b) => dex(a) - dex(b) || lvl(b) - lvl(a),
    dex_desc: (a, b) => dex(b) - dex(a) || lvl(b) - lvl(a),
    gen_asc: (a, b) => gen(a) - gen(b) || dex(a) - dex(b),
    gen_desc: (a, b) => gen(b) - gen(a) || dex(a) - dex(b),
  }[view.sort];
  return cmp ? [...box].sort(cmp) : box;
}
// Box filters, shared by the box, the trade picker, the battle confirm picker
// and the Pokédex (species list, no owned instance behind it). `view` is the
// state object (boxView, tradePickView, ..., dexFilter); `query` (name or dex
// number) is only set where opts.search is on, `canEvolve`/`locked`/`favorite`
// only where their opt is on - the Pokédex has none of those (a species isn't
// favorited/locked/evolved, only a specific owned Pokémon is), and reads
// `shiny`/`minLevel` off `shiny_caught`/`max_level` instead of an owned
// instance's own `shiny`/`level`.
function boxFilterMatches(p, view) {
  const sp = p.species || p;
  const q = (view.query || '').trim().toLocaleLowerCase().replace(/^#/, '');
  const match = (!q || [p.nickname, p.name, sp.name, sp.name_de, sp.name_en, String(sp.id || p.species_id || '')]
      .some(v => v && String(v).toLocaleLowerCase().includes(q)))
    && (!view.type || sp.type1 === view.type || sp.type2 === view.type)
    && (!view.generation || String(sp.generation) === view.generation)
    && (!view.shiny || (p.shiny ?? p.shiny_caught))
    && (!view.favorite || p.favorite)
    && (!view.locked || p.locked)
    && (!view.minLevel || (p.level ?? p.max_level ?? -1) >= Number(view.minLevel))
    && (!view.stage || sp.stage === Number(view.stage))
    && (!view.rarity || sp.rarity_tier === view.rarity)
    && (!view.canEvolve || boxCanEvolve(p))
    && (!view.status || (view.status === 'caught' ? p.caught_count
        : view.status === 'seen' ? (p.seen_count && !p.caught_count) : !p.seen_count));
  return view.invert ? !match : match;
}
// Sort + filter controls; element ids are `prefix` + Sort/FType/FGen/...
// (wired by wireBoxFilters). opts.search adds the name search field,
// opts.evolve the "can evolve" checkbox, opts.locked the "locked only" one,
// opts.status the Pokédex-only seen/caught select. opts.favorite/opts.minLevel
// default to on (the box, trade and battle pickers all use them) and are
// turned off by the Pokédex, which has no owned instance to read them from.
function boxFilterControlsHtml(view, prefix, opts = {}) {
  return `${opts.search ? `<input type="search" class="grow" id="${prefix}FQuery" placeholder="${esc(tr('trade.search_placeholder'))}" value="${esc(view.query || '')}">` : ''}
      <select id="${prefix}Sort"><option value="">${tr('team.box_sort_default')}</option>${Object.entries(boxSortLabels())
        .map(([k, label]) => `<option value="${k}" ${view.sort === k ? 'selected' : ''}>${esc(label)}</option>`).join('')}</select>
      <select id="${prefix}FType"><option value="">${tr('pokedex.all_types')}</option>${TYPES
        .map(k => `<option value="${esc(k)}" ${view.type === k ? 'selected' : ''}>${esc(typeLabel(k))}</option>`).join('')}</select>
      <select id="${prefix}FGen"><option value="">${tr('pokedex.all_generations')}</option>${[1, 2, 3, 4, 5, 6, 7, 8, 9]
        .map(g => `<option value="${g}" ${view.generation === String(g) ? 'selected' : ''}>${esc(genLabel(g))}</option>`).join('')}</select>
      ${opts.status ? `<select id="${prefix}FStatus">
        <option value="" ${!view.status ? 'selected' : ''}>${tr('pokedex.status_all')}</option>
        <option value="caught" ${view.status === 'caught' ? 'selected' : ''}>${tr('pokedex.status_caught')}</option>
        <option value="seen" ${view.status === 'seen' ? 'selected' : ''}>${tr('pokedex.status_seen_only')}</option>
        <option value="unseen" ${view.status === 'unseen' ? 'selected' : ''}>${tr('pokedex.status_undiscovered')}</option>
      </select>` : ''}
      <label><input type="checkbox" id="${prefix}FShiny" ${view.shiny ? 'checked' : ''}> ${tr('pokedex.shiny_only')}</label>
      ${opts.favorite !== false ? `<label><input type="checkbox" id="${prefix}FFavorite" ${view.favorite ? 'checked' : ''}> ${tr('team.favorites_only')}</label>` : ''}
      ${opts.locked ? `<label><input type="checkbox" id="${prefix}FLocked" ${view.locked ? 'checked' : ''}> ${tr('team.box_locked_only')}</label>` : ''}
      <select id="${prefix}FStage"><option value="">${tr('team.box_all_stages')}</option>${[1, 2, 3]
        .map(n => `<option value="${n}" ${view.stage === String(n) ? 'selected' : ''}>${esc(tr('team.box_stage', { stage: n }))}</option>`).join('')}</select>
      <select id="${prefix}FRarity"><option value="">${tr('team.box_all_rarities')}</option>${BOX_RARITY_TIERS
        .map(k => `<option value="${k}" ${view.rarity === k ? 'selected' : ''}>${esc(tr('rarity.' + k))}</option>`).join('')}</select>
      ${opts.evolve ? `<label><input type="checkbox" id="${prefix}FEvolve" ${view.canEvolve ? 'checked' : ''}> ${tr('team.box_can_evolve')}</label>` : ''}
      ${opts.minLevel !== false ? `<label>${tr('team.box_level_at_least')} <input type="number" id="${prefix}FLevel" min="1" step="1" style="width:5em" value="${esc(view.minLevel)}"></label>` : ''}
      <label><input type="checkbox" id="${prefix}FInvert" ${view.invert ? 'checked' : ''}> ${tr('team.box_invert_filter')}</label>`;
}
// Writes control changes into `view` and calls onChange; the search field
// fires on every keystroke, so onChange must not redraw the field itself.
function wireBoxFilters(root, view, prefix, onChange) {
  const bind = (id, prop, checkbox = false) => {
    const el = root.querySelector('#' + prefix + id);
    if (el) el.onchange = () => { view[prop] = checkbox ? el.checked : el.value; onChange(); };
  };
  bind('Sort', 'sort'); bind('FType', 'type'); bind('FGen', 'generation'); bind('FStatus', 'status');
  bind('FShiny', 'shiny', true); bind('FFavorite', 'favorite', true); bind('FLevel', 'minLevel');
  bind('FStage', 'stage'); bind('FRarity', 'rarity'); bind('FEvolve', 'canEvolve', true);
  bind('FLocked', 'locked', true); bind('FInvert', 'invert', true);
  const query = root.querySelector('#' + prefix + 'FQuery');
  if (query) query.oninput = () => { view.query = query.value; onChange(); };
}
function boxGridHtml(box, locked) {
  if (!box.length) return `<div class="card muted">${tr('team.box_empty')}</div>`;
  const shown = boxSorted(box.filter(p => boxFilterMatches(p, boxView)));
  // Only visible Pokémon can be released: a selection hidden by a filter is dropped.
  for (const id of [...boxSelection]) if (!shown.some(p => p.id === id)) boxSelection.delete(id);
  const selectTools = boxView.select ? `
      <button class="ghost action" id="boxSelAll">${tr('team.box_select_all')}</button>
      <button class="ghost action" id="boxSelClear">${tr('team.box_select_clear')}</button>
      <button class="action" id="boxEvolveSel" data-locked="${locked ? 1 : 0}" disabled>${tr('team.box_evolve_selected', { count: 0 })}</button>
      <button class="ghost action" id="boxLockSel" disabled>${lockMark()} ${tr('team.box_lock_selected', { count: 0 })}</button>
      <button class="ghost action" id="boxUnlockSel" disabled>${tr('team.box_unlock_selected', { count: 0 })}</button>
      <button class="action" id="boxReleaseSel" data-locked="${locked ? 1 : 0}" disabled>${tr('team.box_release_selected', { count: 0 })}</button>` : '';
  return `<div class="row card span-all" style="margin-bottom:10px">
      ${boxFilterControlsHtml(boxView, 'box', { evolve: true, locked: true })}
      <span class="muted">${shown.length}/${box.length}</span>
      <button class="ghost action" id="boxSelToggle">${tr(boxView.select ? 'team.box_select_stop' : 'team.box_select_start')}</button>${selectTools}
    </div>
    ${shown.length ? `<div class="box-grid">${shown.map(p => boxSlotHtml(p, boxView.select)).join('')}</div>`
      : `<div class="card muted">${tr('team.box_none_match')}</div>`}`;
}
// Ticks/unticks one box slot in place (no re-render, so the grid keeps its scroll).
function setBoxSlotSelected(slot, on) {
  const id = Number(slot.dataset.id);
  if (on) boxSelection.add(id); else boxSelection.delete(id);
  slot.classList.toggle('selected', on);
  slot.querySelector('.box-sel').checked = on;
}
// Selected box Pokémon split by lock state: release/lock act on the unlocked
// ones, unlock on the locked ones.
function boxSelectedByLock(box) {
  const sel = box.filter(p => boxSelection.has(p.id));
  return { unlocked: sel.filter(p => !p.locked), locked: sel.filter(p => p.locked) };
}
function refreshBoxSelectionBar(box) {
  const btn = $('#boxReleaseSel');
  if (!btn) return;
  const { unlocked, locked } = boxSelectedByLock(box);
  btn.textContent = tr('team.box_release_selected', { count: unlocked.length });
  btn.disabled = !unlocked.length || btn.dataset.locked === '1';
  btn.title = locked.length ? tr('team.box_release_skips_locked', { count: locked.length }) : '';
  const lockBtn = $('#boxLockSel');
  lockBtn.innerHTML = `${lockMark()} ${esc(tr('team.box_lock_selected', { count: unlocked.length }))}`;
  lockBtn.disabled = !unlocked.length;
  const unlockBtn = $('#boxUnlockSel');
  unlockBtn.textContent = tr('team.box_unlock_selected', { count: locked.length });
  unlockBtn.disabled = !locked.length;
  const evo = $('#boxEvolveSel');
  const count = box.filter(p => boxSelection.has(p.id) && boxBulkEvolvable(p)).length;
  evo.textContent = tr('team.box_evolve_selected', { count });
  evo.disabled = !count || evo.dataset.locked === '1';
}

let teamView = 'team';

async function renderTeam() {
  const el = $('#tab-team');
  if (teamView !== 'box') { boxView.select = false; boxSelection.clear(); }
  const [t, me] = await Promise.all([api('/api/team'), api('/api/users/me')]);
  const heal = t.heal;
  const locked = t.in_battle;
  const healInfo = heal.available ? tr('team.heal_ready')
    : tr('team.heal_again_at', { time: new Date(heal.next_heal_at).toLocaleTimeString(jsLocale(), { hour: '2-digit', minute: '2-digit' }) });
  const autoHealPlan = t.auto_heal.plan && t.auto_heal.plan.heals ? t.auto_heal.plan : null;
  const common = { locked, inventory: t.held_inventory, catalog: t.held_items, showIvs: me.show_team_ivs };

  el.innerHTML = `
    <div class="card row span-all">
      <div class="grow"><strong>${tr('team.pokemon_center')}</strong>
        <div class="muted">${tr('team.heal_hint', { cooldown: esc(heal.cooldown_minutes), regen: esc(heal.regen_percent_per_hour) })}</div></div>
      <button class="action" id="teamHeal" ${heal.available && !locked ? '' : 'disabled'}>${tr('team.heal_team')}</button>
      <span class="muted">${esc(healInfo)}</span>
    </div>
    ${t.auto_heal.auto_heal ? `<div class="card row span-all">
      <div class="grow"><strong>${tr('team.auto_heal')}</strong>
        <div class="muted">${autoHealPlan ? tr('team.auto_heal_needs', { items: esc(autoHealPlan.items_text) }) : tr('team.auto_heal_nothing')}</div></div>
      <button class="action" id="teamAutoHeal" ${autoHealPlan && autoHealPlan.heals && !locked ? '' : 'disabled'}>${tr('team.auto_heal')}</button>
    </div>` : ''}
    ${locked ? `<div class="card muted">${tr('team.locked_in_battle')}</div>` : ''}
    <div class="row" style="margin-bottom:10px">
      <button class="ghost action secBtn${teamView === 'team' ? ' active' : ''}" id="teamViewTeam">${tr('team.subnav_team')} (${t.party.length + t.party_eggs.length}/${t.party_size})</button>
      <button class="ghost action secBtn${teamView === 'box' ? ' active' : ''}" id="teamViewBox">${tr('team.subnav_box')} (${t.box.length})</button>
      <button class="ghost action secBtn${teamView === 'eggs' ? ' active' : ''}" id="teamViewEggs">${tr('team.subnav_eggs')}</button>
      <button class="ghost action secBtn${teamView === 'buddy' ? ' active' : ''}" id="teamViewBuddy">${tr('team.subnav_buddy')}</button>
    </div>
    <div id="teamViewBody"></div>
  `;
  $('#teamHeal').onclick = async () => {
    try { await api('/api/team/heal', { method: 'POST' }); } catch (e) { alert(e.message); }
    render('team');
  };
  if ($('#teamAutoHeal')) $('#teamAutoHeal').onclick = async () => {
    try { alert((await api('/api/team/auto-heal', { method: 'POST' })).message); } catch (e) { alert(e.message); }
    refreshMoney();
    render('team');
  };
  $('#teamViewTeam').onclick = () => { teamView = 'team'; renderTeam(); };
  $('#teamViewBox').onclick = () => { teamView = 'box'; renderTeam(); };
  $('#teamViewEggs').onclick = () => { teamView = 'eggs'; renderTeam(); };
  $('#teamViewBuddy').onclick = () => { teamView = 'buddy'; renderTeam(); };

  const body = $('#teamViewBody');
  if (teamView === 'eggs') {
    await renderEggs(body, locked);
    return;
  }
  if (teamView === 'buddy') {
    await renderBuddy(body, t);
    return;
  }
  if (teamView === 'box') {
    body.innerHTML = boxGridHtml(t.box, locked);
    if ($('#boxSort')) {
      wireBoxFilters(body, boxView, 'box', () => renderTeam());
      $('#boxSelToggle').onclick = () => { boxView.select = !boxView.select; boxSelection.clear(); renderTeam(); };
    }
    body.querySelectorAll('.box-slot[data-id]').forEach(slot => {
      slot.onclick = () => {
        const id = Number(slot.dataset.id);
        if (!boxView.select) return openPokemon(id);
        setBoxSlotSelected(slot, !boxSelection.has(id));
        refreshBoxSelectionBar(t.box);
      };
      // The checkbox sits visually on top of the card; give it its own handler
      // too (some mobile browsers route the tap to the native checkbox before
      // it can bubble to the card), guarded so it doesn't double-toggle.
      const sel = slot.querySelector('.box-sel');
      if (sel) sel.onclick = event => { event.preventDefault(); event.stopPropagation(); slot.onclick(); };
    });
    if ($('#boxSelAll')) {
      $('#boxSelAll').onclick = () => {
        // Locked Pokémon are selected too (for unlocking); release skips them.
        body.querySelectorAll('.box-slot[data-id]').forEach(slot => setBoxSlotSelected(slot, true));
        refreshBoxSelectionBar(t.box);
      };
      $('#boxSelClear').onclick = () => {
        body.querySelectorAll('.box-slot[data-id]').forEach(slot => setBoxSlotSelected(slot, false));
        refreshBoxSelectionBar(t.box);
      };
      refreshBoxSelectionBar(t.box);
      $('#boxEvolveSel').onclick = async () => {
        const ids = t.box.filter(p => boxSelection.has(p.id) && boxBulkEvolvable(p)).map(p => p.id);
        if (!ids.length || !confirm(tr('team.box_evolve_selected_confirm', { count: ids.length }))) return;
        try {
          const r = await api('/api/team/evolve-many', { method: 'POST', body: JSON.stringify({ ids }) });
          let msg = tr('team.box_evolved_many', { count: r.evolved.length });
          if (r.skipped.length) msg += ' ' + tr('team.box_evolve_skipped', { count: r.skipped.length });
          r.evolved.filter(e => e.shedinja).forEach(e => {
            msg += ' ' + tr('evolution.shedinja_appeared', { name: e.shedinja.name });
          });
          alert(msg);
        } catch (e) { alert(e.message); }
        boxSelection.clear();
        renderTeam();
      };
      const lockSelected = async locked => {
        const sel = boxSelectedByLock(t.box);
        const ids = (locked ? sel.unlocked : sel.locked).map(p => p.id);
        if (!ids.length) return;
        try {
          await api('/api/team/lock-many', { method: 'POST', body: JSON.stringify({ ids, locked }) });
        } catch (e) { alert(e.message); }
        renderTeam();  // keeps the selection, so lock -> release-the-rest works in one go
      };
      $('#boxLockSel').onclick = () => lockSelected(true);
      $('#boxUnlockSel').onclick = () => lockSelected(false);
      $('#boxReleaseSel').onclick = async () => {
        const ids = boxSelectedByLock(t.box).unlocked.map(p => p.id);
        if (!ids.length || !confirm(tr('team.box_release_selected_confirm', { count: ids.length }))) return;
        try {
          const r = await api('/api/team/release', { method: 'POST', body: JSON.stringify({ ids }) });
          let msg = r.released.length === 1
            ? tr('team.released', { name: r.released[0].name })
            : tr('team.box_released_many', { count: r.released.length });
          if (r.rare_candy_awarded) msg += ' ' + tr('team.release_candy_reward', { count: r.rare_candy_awarded });
          alert(msg);
        } catch (e) { alert(e.message); }
        boxSelection.clear();
        renderTeam();
      };
    }
    body.querySelectorAll('.fav-star[data-fav-id]').forEach(star => {
      star.onclick = event => {
        event.stopPropagation();
        toggleFavorite(Number(star.dataset.favId), !star.classList.contains('on')).then(() => renderTeam());
      };
    });
    body.querySelectorAll('.lock-mark[data-lock-id]').forEach(mark => {
      mark.onclick = event => {
        event.stopPropagation();
        toggleLocked(Number(mark.dataset.lockId), false).then(() => renderTeam());
      };
    });
    return;
  }

  body.innerHTML = (t.party.map((p, i) => monCard(p, { ...common, index: i, count: t.party.length })).join('')
    || `<div class="card muted">${tr('team.no_pokemon_in_team')}</div>`)
    + t.party_eggs.map(e => `<div class="card row party-egg" style="cursor:pointer">
        <span class="egg-icon"></span>
        <div class="grow"><strong>${tr('eggs.egg')}</strong> ${e.ready ? `<span class="pill evo-badge">${tr('eggs.ready_badge')}</span>` : ''}
          ${eggProgressHtml(e)}</div>
      </div>`).join('');
  body.querySelectorAll('.party-egg').forEach(card => {
    card.onclick = () => { teamView = 'eggs'; renderTeam(); };
  });

  const partyIds = t.party.map(p => p.id);
  const setParty = async order => {
    try {
      await api('/api/team/party', { method: 'PUT', body: JSON.stringify({ order }) });
    } catch (e) { alert(e.message); }
    render('team');
  };
  const setItem = async (id, item) => {
    try {
      await api(`/api/team/${encodeURIComponent(id)}/held-item`, { method: 'PUT', body: JSON.stringify({ item }) });
    } catch (e) { alert(e.message); }
    render('team');
  };

  body.querySelectorAll('.mon[data-id]').forEach(card => {
    const id = Number(card.dataset.id);
    card.style.cursor = 'pointer';
    card.onclick = event => {
      if (!event.target.closest('button, select, input, .move-pill, .ability-pill')) openPokemon(id);
    };
    const mon = t.party.find(x => x.id === id);
    card.querySelectorAll('.move-pill').forEach(pillEl => {
      const mv = (mon.moves || []).find(m => m.key === pillEl.dataset.moveKey);
      if (mv) pillEl.onclick = event => { event.stopPropagation(); openMoveInfo(mv); };
    });
    const abilityPillEl = card.querySelector('.ability-pill');
    if (abilityPillEl) abilityPillEl.onclick = event => { event.stopPropagation(); openAbilityInfo(mon.ability_info); };
    const on = (sel, fn) => { const btn = card.querySelector(sel); if (btn) btn.onclick = fn; };
    const move = delta => {
      const order = [...partyIds];
      const i = order.indexOf(id);
      const j = i + delta;
      if (i < 0 || j < 0 || j >= order.length) return;
      [order[i], order[j]] = [order[j], order[i]];
      setParty(order);
    };
    on('.tmUp', () => move(-1));
    on('.tmDown', () => move(1));
    on('.tmBox', () => setParty(partyIds.filter(x => x !== id)));
    on('.tmUnequip', () => setItem(id, null));
    on('.tmEquip', () => {
      const item = card.querySelector('.tmItem').value;
      if (item) setItem(id, item);
    });
  });
}

// ------------------------------------------------------------ Eier & Pension
// Zucht wie im Hauptspiel (Backend: app/breeding.py). Eier sammeln Schritte
// nur im Team oder im Inkubator; Art und Werte bleiben bis zum Schluepfen geheim.
// Gold star after a shiny's name (replaces the old emoji sparkle).
const shinyMark = () => `<span class="shiny" title="${esc(tr('admin.shiny'))}">★</span>`;
const favMark = () => `<span class="fav-star on" style="position:static" title="${esc(tr('team.favorite_remove'))}">★</span>`;
// Lock symbol: a small Klefki (www/img/klefki.png, its Gen 8 box icon).
const lockMark = (attrs = '') => `<img class="lock-mark" src="${BASE}/static/img/klefki.png" alt="${esc(tr('team.locked_hint'))}" title="${esc(tr('team.locked_hint'))}" ${attrs}>`;
const genderSymbol = g => g === 'male' ? '♂' : g === 'female' ? '♀' : '';
const EGG_LOCATION_KEY = { box: 'eggs.location_box', party: 'eggs.location_party', incubator: 'eggs.location_incubator' };

function eggProgressHtml(e) {
  return `<div class="exp-bar egg-bar"><span style="width:${esc(e.progress_percent)}%"></span></div>
    <span class="muted">${e.ready ? tr('eggs.ready') : tr('eggs.steps_left', { steps: e.steps_left.toLocaleString(jsLocale()) })}</span>`;
}

function eggCardHtml(e, o) {
  const parents = e.parents.map(speciesName).join(' × ');
  const btn = (cls, label, disabled) =>
    `<button class="ghost action ${cls}" data-egg="${esc(e.id)}" ${o.locked || disabled ? 'disabled' : ''}>${label}</button>`;
  return `<div class="card row">
    <span class="egg-icon"></span>
    <div class="grow"><strong>${tr('eggs.egg')}</strong> <span class="pill">${tr(EGG_LOCATION_KEY[e.location] || e.location)}</span>
      ${parents ? `<div class="muted">${tr('eggs.parents', { parents: esc(parents) })}</div>` : ''}
      ${eggProgressHtml(e)}</div>
    <div class="row" style="gap:6px">
      ${e.ready ? `<button class="action eggHatch" data-egg="${esc(e.id)}" ${o.locked ? 'disabled' : ''}>${tr('eggs.hatch')}</button>` : ''}
      ${e.location !== 'party' ? btn('eggToParty', tr('team.to_team'), o.partyFull) : ''}
      ${e.location !== 'incubator' ? btn('eggToIncubator', tr('eggs.to_incubator'), !o.incubatorAvailable) : ''}
      ${e.location !== 'box' ? btn('eggToBox', tr('team.to_box'), false) : ''}
    </div>
  </div>`;
}

// Gleiche Regel wie breeding.compatibility() in Python, nur ohne den
// Geschlechts-Check (den erledigt schon die Trennung weiblich/maennlich
// in den beiden Dropdowns).
function eggGroupsCompatible(a, b) {
  const ga = a.egg_groups || [], gb = b.egg_groups || [];
  if (ga.includes('no-eggs') || gb.includes('no-eggs')) return false;
  const dittoA = ga.includes('ditto'), dittoB = gb.includes('ditto');
  if (dittoA && dittoB) return false;
  if (dittoA || dittoB) return true;
  return ga.some(g => gb.includes(g));
}

// Ditto has no gender but pairs with anything, so it is offered in both dropdowns.
const dittoLike = c => (c.egg_groups || []).includes('ditto');
// Both dropdowns are sorted by name (nickname or species), then by level.
const daycareName = c => c.nickname || speciesName(c);
const byDaycareName = (a, b) =>
  daycareName(a).localeCompare(daycareName(b), jsLocale(), { sensitivity: 'base' }) || a.level - b.level;
const daycareFemales = list => list.filter(c => c.gender === 'female' || dittoLike(c)).sort(byDaycareName);
const daycareMales = list => list.filter(c => c.gender === 'male' || dittoLike(c)).sort(byDaycareName);
const daycareLabel = c => `${daycareName(c)} ${genderSymbol(c.gender)} · ${tr('common.level_short', { level: c.level })}`;
const daycareOptions = (list, selected) => list.map(c =>
  `<option value="${esc(c.id)}" ${c.id === selected ? 'selected' : ''}>${esc(daycareLabel(c))}</option>`).join('');

function daycareHtml(d, candidates, locked) {
  const byId = Object.fromEntries(candidates.map(c => [c.id, c]));
  const females = daycareFemales(candidates);
  const males = daycareMales(candidates);

  // The daycare stores the female-slot parent first (see the PUT /api/daycare call).
  let femaleId = null, maleId = null;
  if (d && females.some(f => f.id === d.parent_a)) { femaleId = d.parent_a; maleId = d.parent_b; }
  if (femaleId == null && females[0]) femaleId = females[0].id;
  const maleOptionList = femaleId != null && byId[femaleId]
    ? males.filter(m => eggGroupsCompatible(byId[femaleId], m)) : males;
  if (maleId == null || !maleOptionList.some(m => m.id === maleId)) {
    maleId = maleOptionList[0] ? maleOptionList[0].id : null;
  }

  let status = `<div class="muted">${tr('eggs.daycare_hint')}</div>`;
  if (d) {
    const names = [d.parent_a, d.parent_b].map(id => byId[id] ? daycareLabel(byId[id]) : '?').join(' + ');
    const when = new Date(d.ready_at).toLocaleString(jsLocale(), { weekday: 'short', hour: '2-digit', minute: '2-digit' });
    status = `<div><strong>${esc(names)}</strong></div>
      <div class="muted">${d.egg_ready ? tr('eggs.daycare_egg_waiting')
        : tr('eggs.daycare_next_egg', { time: esc(when), minutes: esc(d.interval_minutes) })}</div>
      ${d.egg_ready ? `<button class="action" id="daycareCollect" ${locked ? 'disabled' : ''}>${tr('eggs.daycare_collect')}</button>` : ''}
      <button class="ghost action" id="daycareClear">${tr('eggs.daycare_clear')}</button>`;
  }
  return `<div class="card">
    <h3>${tr('eggs.daycare')}</h3>
    ${status}
    <div class="row" style="margin-top:10px;flex-wrap:wrap">
      <label class="muted">${tr('eggs.daycare_female')}<br>
        <select id="daycareFemale" ${locked ? 'disabled' : ''}>${daycareOptions(females, femaleId)}</select>
      </label>
      <label class="muted">${tr('eggs.daycare_male')}<br>
        <select id="daycareMale" ${locked ? 'disabled' : ''}>${daycareOptions(maleOptionList, maleId)}</select>
      </label>
      <button class="ghost action" id="daycareSet" ${(!females.length || !males.length) ? 'disabled' : ''}>${tr('eggs.daycare_leave')}</button>
    </div>
    <div class="muted" id="daycareError"></div>
  </div>`;
}

async function renderEggs(body, locked) {
  const o = await api('/api/eggs');
  const partyFull = o.party_pokemon + o.party_eggs >= o.party_size;
  const inc = o.incubators;
  const freeIncubators = inc.active.filter(i => i.egg_id == null).length;
  const incubatorAvailable = freeIncubators > 0 || inc.in_bag > 0;
  const incubatorInfo = tr('eggs.incubators_info', { bag: esc(inc.in_bag), uses: esc(inc.uses_per_item) })
    + inc.active.map(i => ` <span class="pill">${tr('eggs.incubator_uses_left', { uses: esc(i.uses_left) })}${i.egg_id == null ? ' · ' + tr('eggs.incubator_free') : ''}</span>`).join('');
  body.innerHTML = `
    ${daycareHtml(o.daycare, o.candidates, locked)}
    <div class="card">
      <h3>${tr('eggs.title')}</h3>
      <div class="muted">${tr('eggs.hatch_hint', { passive: esc(o.passive_steps_per_hour) })}</div>
      <div class="muted">${o.step_sensor ? tr('eggs.sensor_active', { sensor: esc(o.step_sensor) }) : tr('eggs.sensor_none')}
        <button class="ghost action" id="eggSensorPick">${tr('eggs.sensor_choose')}</button></div>
      <div id="eggSensorBox"></div>
      ${o.step_boost ? `<div class="muted">${tr('eggs.boost_active')}</div>` : ''}
      <div class="muted" style="margin-top:6px">${incubatorInfo}</div>
    </div>
    ${o.eggs.map(e => eggCardHtml(e, { locked, partyFull, incubatorAvailable })).join('')
      || `<div class="card muted">${tr('eggs.none')}</div>`}
  `;
  const rerender = () => renderTeam();
  const call = async (path, options) => {
    try { return await api(path, options); } catch (e) { alert(e.message); return null; }
  };
  const move = (id, location) => call(`/api/eggs/${encodeURIComponent(id)}/location`,
    { method: 'PUT', body: JSON.stringify({ location }) }).then(rerender);
  body.querySelectorAll('.eggToParty').forEach(b => { b.onclick = () => move(b.dataset.egg, 'party'); });
  body.querySelectorAll('.eggToBox').forEach(b => { b.onclick = () => move(b.dataset.egg, 'box'); });
  body.querySelectorAll('.eggToIncubator').forEach(b => { b.onclick = () => move(b.dataset.egg, 'incubator'); });
  body.querySelectorAll('.eggHatch').forEach(b => {
    b.onclick = async () => {
      const r = await call(`/api/eggs/${encodeURIComponent(b.dataset.egg)}/hatch`, { method: 'POST' });
      if (!r) return;
      await renderTeam();
      openPokemon(r.hatched.owned_id, r.hatched.message);
    };
  });
  const byId = Object.fromEntries(o.candidates.map(c => [c.id, c]));
  const males = daycareMales(o.candidates);
  const femaleSel = $('#daycareFemale'), maleSel = $('#daycareMale');
  if (femaleSel && maleSel) {
    femaleSel.onchange = () => {
      const female = byId[Number(femaleSel.value)];
      const compatible = female ? males.filter(m => eggGroupsCompatible(female, m)) : males;
      maleSel.innerHTML = daycareOptions(compatible, null);
    };
  }
  $('#daycareSet').onclick = async () => {
    try {
      await api('/api/daycare', { method: 'PUT', body: JSON.stringify({
        parent_a: Number($('#daycareFemale').value), parent_b: Number($('#daycareMale').value) }) });
      rerender();
    } catch (e) { $('#daycareError').textContent = e.message; }
  };
  if ($('#daycareClear')) $('#daycareClear').onclick = () => call('/api/daycare', { method: 'DELETE' }).then(rerender);
  if ($('#daycareCollect')) $('#daycareCollect').onclick = async () => {
    const r = await call('/api/daycare/collect', { method: 'POST' });
    if (r) alert(r.egg.location === 'party' ? tr('eggs.collected_party') : tr('eggs.collected_box'));
    rerender();
  };
  // Schritt-Sensor: derselbe wie beim Buddy (PUT /api/buddy/sensor).
  $('#eggSensorPick').onclick = () => openStepSensorPicker($('#eggSensorBox'), o.step_sensor, rerender);
}

// ------------------------------------------------------------------- Buddy
// Ein Buddy pro Nutzer (Backend: app/buddy.py), gespiegelt als HA-Sensor und
// per Schritt-Sensor levelbar. Der Schritt-Sensor ist derselbe wie fuer Eier.
async function openStepSensorPicker(box, current, onSaved) {
  box.innerHTML = `<span class="muted">${tr('eggs.sensor_loading')}</span>`;
  try {
    const { sensors } = await api('/api/buddy/sensors');
    box.innerHTML = `<div class="row" style="margin-top:6px">
      <select id="stepSensorSel"><option value="">${tr('eggs.sensor_off')}</option>${sensors.map(s =>
        `<option value="${esc(s.entity_id)}" ${s.entity_id === current ? 'selected' : ''}>${esc(s.name)} (${esc(s.state)} ${esc(s.unit || '')})</option>`).join('')}</select>
      <button class="ghost action" id="stepSensorSave">${tr('common.save')}</button></div>`;
    $('#stepSensorSave').onclick = async () => {
      try {
        await api('/api/buddy/sensor', { method: 'PUT', body: JSON.stringify({ entity_id: $('#stepSensorSel').value || null }) });
        onSaved();
      } catch (e) { alert(e.message); }
    };
  } catch (e) { box.innerHTML = `<span class="muted">${esc(e.message)}</span>`; }
}

// Favoriten-Markierung eines eigenen Pokemon setzen/entfernen (Team oder Box) -
// rein kosmetisch, dient nur als Box-Filter (siehe boxView).
async function toggleFavorite(ownedId, favorite) {
  try {
    await api(`/api/team/${encodeURIComponent(ownedId)}/favorite`, {
      method: 'PUT', body: JSON.stringify({ favorite }),
    });
  } catch (e) { alert(e.message); }
}

// Sperr-Markierung eines eigenen Pokemon setzen/entfernen (Team oder Box) -
// ein gesperrtes Pokemon kann nicht freigelassen werden (siehe api/team.py
// `_release`); legendaere/mystische Faenge kommen automatisch so an.
async function toggleLocked(ownedId, locked) {
  try {
    await api(`/api/team/${encodeURIComponent(ownedId)}/locked`, {
      method: 'PUT', body: JSON.stringify({ locked }),
    });
  } catch (e) { alert(e.message); }
}

// Buddy setzen (pokemonId) oder entfernen (null); fragt nach, wenn dabei
// angesparte Schritte verfallen. Rueckgabe: true = geaendert.
async function setBuddy(pokemonId, info) {
  const current = info.pokemon;
  if (current && current.id !== pokemonId) {
    if (pokemonId === null && !confirm(tr('buddy.remove_confirm', { name: current.name }))) return false;
    if (pokemonId !== null && info.steps > 0 && !confirm(tr('buddy.change_hint'))) return false;
  }
  try {
    const r = await api('/api/buddy', { method: 'PUT', body: JSON.stringify({ pokemon_id: pokemonId }) });
    if (!r.pushed) alert(tr('buddy.not_pushed'));
    return true;
  } catch (e) { alert(e.message); return false; }
}

async function renderBuddy(body, t) {
  const b = await api('/api/buddy');
  const mon = b.pokemon;
  const atMax = mon && mon.level >= 100;
  const percent = atMax ? 100 : Math.min(100, Math.round(100 * b.steps / b.steps_per_level));
  const fmt = n => Number(n).toLocaleString(jsLocale());
  const sensorInfo = !b.sensor ? tr('buddy.sensor_none')
    : tr('eggs.sensor_active', { sensor: esc(b.sensor) }) + (b.has_baseline ? '' : ` <div>${tr('buddy.baseline_pending')}</div>`);
  const all = [...t.party, ...t.box];
  body.innerHTML = `
    <div class="card">
      <h3>${tr('buddy.badge')}</h3>
      <div class="muted">${tr('buddy.hint', { steps: fmt(b.steps_per_level) })}</div>
      ${mon ? `<div class="row" style="margin-top:10px;flex-wrap:nowrap">
        <img class="buddy-art" src="${esc(mon.artwork_url)}" alt="" onerror="this.onerror=null;this.src='${esc(mon.sprite_url || '')}'">
        <div class="grow">
          <h2 style="margin:0">${esc(mon.name)} ${mon.shiny ? shinyMark() : ''}</h2>
          <strong>${tr('common.level_short', { level: mon.level })}</strong> ${mon.types.map(typePill).join('')}
          <div class="exp-bar buddy-bar"><span style="width:${percent}%"></span></div>
          <div class="muted">${atMax ? tr('buddy.max_level') : tr('buddy.progress', { steps: fmt(b.steps), total: fmt(b.steps_per_level) })}</div>
          <div class="muted">${tr('buddy.steps_total', { steps: fmt(b.steps_total) })}</div>
          <div class="muted">${tr('buddy.entity', { entity: `<code>${esc(b.entity_id)}</code>` })}</div>
          <div style="margin-top:8px"><button class="ghost action" id="buddyRemove">${tr('buddy.remove')}</button></div>
        </div>
      </div>` : `<div class="muted" style="margin-top:10px">${tr('buddy.none')}</div>`}
    </div>
    <div class="card">
      <h3>${tr('buddy.sensor_title')}</h3>
      <div class="muted">${tr('buddy.sensor_hint')}</div>
      <div class="muted">${sensorInfo}
        <button class="ghost action" id="buddySensorPick">${tr('eggs.sensor_choose')}</button></div>
      <div id="buddySensorBox"></div>
    </div>
    <div class="card" style="margin-top:10px">
      <h3>${tr('buddy.finds_title')}</h3>
      <div class="muted">${tr('buddy.finds_hint')}</div>
      ${(b.finds || []).length ? (b.finds || []).map(f => `<div class="row">${esc(f.label)}${f.tier === 'rare' ? ` <span class="pill">${tr('buddy.found_rare')}</span>` : ''}<span class="muted grow" style="text-align:right">${esc(f.found_at)}</span></div>`).join('')
        : `<div class="muted">${tr('buddy.finds_none')}</div>`}
    </div>
    <h3>${tr('buddy.choose_title')}</h3>
    ${all.length ? `<div class="box-grid">${all.map(p => boxSlotHtml(p).replace('class="card box-slot',
        `class="card box-slot${mon && mon.id === p.id ? ' is-buddy' : ''}`)).join('')}</div>`
      : `<div class="card muted">${tr('buddy.no_pokemon')}</div>`}
  `;
  const rerender = () => renderTeam();
  body.querySelectorAll('.box-slot[data-id]').forEach(slot => {
    const id = Number(slot.dataset.id);
    slot.onclick = async () => {
      if (mon && mon.id === id) return openPokemon(id);
      if (await setBuddy(id, b)) rerender();
    };
  });
  if ($('#buddyRemove')) $('#buddyRemove').onclick = async () => { if (await setBuddy(null, b)) rerender(); };
  $('#buddySensorPick').onclick = () => openStepSensorPicker($('#buddySensorBox'), b.sensor, rerender);
}

// ------------------------------------------------------------------- Boot
function render(tab) {
  const fn = { queue: renderQueue, triggers: renderTriggers, zones: renderZones, settings: renderSettings,
               team: renderTeam, dex: renderDex, shop: renderShop, bag: renderBag, admin: renderAdmin,
               league: renderLeague, pvp: renderPvp, challenge: renderChallenge, trade: renderTrade, achievements: renderAchievements, history: renderHistory,
               guide: renderGuide }[tab];
  fn && fn().catch(e => { $('#tab-' + tab).innerHTML = `<div class="card">${tr('header.error', { message: esc(e.message) })}</div>`; });
}

function startApp() {
  $('#appShell').classList.remove('hidden');
  $('#starterGate').classList.add('hidden');
  refreshStatus();
  refreshMoney();
  render('queue');
  setInterval(refreshStatus, 60000);
  resumeBattle();
}

// Frisch erkannter HA-Nutzer (siehe app/auth.py) hat noch kein Team -
// erst den Starter waehlen, generationsuebergreifend, bevor es losgeht.
let starterRegionLock = null;   // survives the gate's periodic re-render while seeding
async function showStarterGate() {
  const gate = $('#starterGate');
  gate.classList.remove('hidden');
  gate.innerHTML = `<div class="card muted">${tr('starter.loading')}</div>`;

  const data = await api('/api/starters');
  if (starterRegionLock === null) starterRegionLock = (await api('/api/users/me')).region_lock;
  const anyLoaded = data.generations.some(g => g.starters.length);
  if (!anyLoaded) {
    gate.innerHTML = `<div class="card muted">${tr('starter.first_load')}</div>`;
    setTimeout(showStarterGate, 3000);
    return;
  }
  // Aeltere Generationen (niedrige Dex-Nummern) sind meist zuerst da - solange
  // noch nicht alle 27 Starter geladen sind, hier weiter im Hintergrund
  // aktualisieren, statt den Nutzer manuell neu laden zu lassen.
  if (data.seeding) setTimeout(showStarterGate, 5000);

  gate.innerHTML = `
    <div class="card">
      <h2 style="margin-top:0">${tr('starter.title')}</h2>
      <div class="muted">${tr('starter.subtitle')}</div>
    </div>
    <div class="card">${regionLockHtml('starterRegionLock', starterRegionLock)}</div>
    ${data.generations.filter(g => g.starters.length).map(g => `
      <div class="card">
        <div class="muted">${tr('pokedex.generation_label', { gen: g.generation })}</div>
        <div class="row" style="gap:16px;flex-wrap:wrap;margin-top:8px">
          ${g.starters.map(sp => `
            <button class="ghost action starterPick" data-id="${sp.id}"
              style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px;min-width:96px">
              ${sp.sprite_url ? `<img class="sprite" src="${esc(sp.sprite_url)}" alt="">` : ''}
              <span>${esc(speciesName(sp))}</span>
              <span class="muted">${[sp.type1, sp.type2].filter(Boolean).map(typeLabel).join(' / ')}</span>
            </button>`).join('')}
        </div>
      </div>`).join('')}
    ${data.seeding ? `<div class="card muted">${tr('starter.more_loading')}</div>` : ''}
  `;

  wireRegionLockSelect('starterRegionLock', async mode => { starterRegionLock = mode; });
  gate.querySelectorAll('.starterPick').forEach(btn => {
    btn.onclick = async () => {
      gate.querySelectorAll('.starterPick').forEach(b => b.disabled = true);
      try {
        await api('/api/users/me/starter', {
          method: 'POST',
          body: JSON.stringify({ species_id: Number(btn.dataset.id), region_lock: starterRegionLock })
        });
        startApp();
      } catch (e) {
        alert(e.message);
        gate.querySelectorAll('.starterPick').forEach(b => b.disabled = false);
      }
    };
  });
}

// ------------------------------------------------------------- Tutorial
// Same new-player gate as showStarterGate above, but paged and with a bit of
// explanation first - opt-in, since a returning HA user who already knows
// the game just wants to skip straight to starter.starterPick. Only shown
// once, because has_starter flips to true as soon as the walkthrough's
// starter page succeeds (same mandatory gate as the plain flow).
function tutorialNavHtml(showNext) {
  return `
    <div class="row" style="justify-content:flex-end;margin-top:12px">
      <button class="ghost action" id="tutorialCancel">${tr('tutorial.cancel')}</button>
      ${showNext ? `<button class="action" id="tutorialNext">${tr('tutorial.next')}</button>` : ''}
    </div>`;
}

function wireTutorialNav(onNext) {
  $('#tutorialCancel').onclick = cancelTutorial;
  if (onNext) $('#tutorialNext').onclick = onNext;
}

// Leaving mid-tutorial must still respect the mandatory starter choice.
async function cancelTutorial() {
  const me = await api('/api/users/me');
  if (me.has_starter) startApp(); else showStarterGate();
}

async function showTutorialOffer() {
  const gate = $('#starterGate');
  gate.classList.remove('hidden');
  gate.innerHTML = `
    <div class="card">
      <h2 style="margin-top:0">${tr('tutorial.offer_title')}</h2>
      <p>${tr('tutorial.offer_text')}</p>
      <div class="row">
        <button class="action" id="tutorialStart">${tr('tutorial.offer_start')}</button>
        <button class="ghost action" id="tutorialSkip">${tr('tutorial.offer_skip')}</button>
      </div>
    </div>`;
  $('#tutorialStart').onclick = () => showTutorialSummary();

function showTutorialSummary() {

    <div class="card">

// The starter page itself - same species grid as showStarterGate, minus the
// region lock choice (kept out of the walkthrough on purpose, see commit

async function showTutorialStarter() {

  if (!anyLoaded) {
    gate.innerHTML = `<div class="card muted">${tr('starter.first_load')}</div>`;

  }

  gate.innerHTML = `
    <div class="card">
      <h2 style="margin-top:0">${tr('starter.title')}</h2>
      <div class="muted">${tr('tutorial.starter_note')}</div>
    </div>
    ${data.generations.filter(g => g.starters.length).map(g => `
      <div class="card">
        <div class="muted">${tr('pokedex.generation_label', { gen: g.generation })}</div>
        <div class="row" style="gap:16px;flex-wrap:wrap;margin-top:8px">
          ${g.starters.map(sp => `
            <button class="ghost action tutorialStarterPick" data-id="${sp.id}"
              style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px;min-width:96px">

              <span>${esc(speciesName(sp))}</span>

  $('#tutorialCancel').onclick = cancelTutorial;

        showTutorialCatching();
      } catch (e) {
        alert(e.message);
        gate.querySelectorAll('.tutorialStarterPick').forEach(b => b.disabled = false);
      }
    };
  });
}

// Optional extension scripts (www/<name>.js) the backend reports as installed;
// they register themselves, e.g. via registerAdminView(). The public build has none.
async function loadExtensions() {
  const { scripts } = await fetch(BASE + '/api/extensions').then(r => r.json());
  for (const name of scripts) {
    await new Promise(resolve => {
      const el = document.createElement('script');
      el.src = `${BASE}/static/${encodeURIComponent(name)}`;
      el.onload = el.onerror = resolve;
      document.head.appendChild(el);
    });
  }
}

(async function boot() {
  // Sofort mit der zwischengespeicherten Sprache rendern (kein Warten auf
  // das Netzwerk), dann bei Bedarf auf die tatsaechliche Server-Praeferenz
  // umschalten, sobald /api/users/me zurueck ist.
  try { await loadStrings(LANG); } catch (e) { /* Netzwerkfehler - tr() faellt auf Keys zurueck */ }
  try { await loadExtensions(); } catch (e) { /* no extensions */ }
  $('#langPick').onchange = e => setLanguage(e.target.value);
  watchSpriteStyle();

  try {
    const me = await api('/api/users/me');
    $('#userName').textContent = me.display_name || me.name || '';
    $('#userName').title = tr('profile.title');
    $('#userName').onclick = () => openProfile('me');
    // God mode (app/god_mode.py): admin plays without costs, cooldowns and unlock gates.
    $('#godMode').classList.toggle('hidden', !me.god_mode);
    $('#godMode').title = tr('header.god_mode_hint');
    applyAnimationSpeed(me.animation_speed);
    speciesSpriteStyles = me.species_sprite_styles || {};
    availableSpriteStyles = me.sprite_styles || [];
    if (me.language && me.language !== LANG) await loadStrings(me.language);
    // Logout only makes sense with an own session (auth mode ha_oauth).
    fetch(BASE + '/auth/status').then(r => r.json()).then(st => {
      if (st.mode !== 'ha_oauth') return;
      $('#logoutBtn').classList.remove('hidden');
      $('#logoutBtn').onclick = () => { window.location.href = BASE + '/auth/logout'; };
    }).catch(() => {});
    if (!me.has_starter) { await showTutorialOffer(); return; }
  } catch (e) {
    if (e.loginRequired) return;
    $('#status').textContent = tr('header.error', { message: e.message });
  }
  startApp();
})();
</script>
