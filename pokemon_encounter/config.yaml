# Home Assistant add-on configuration
#
# Deliberately minimal: the actual game configuration (trigger tuning, type
# bonuses, retention, auto-battle) is managed in the web app and persisted in
# SQLite - not here. This file only holds things that must be fixed before the
# first start, plus the choice of which entity CATEGORIES automatically become
# triggers (trigger_categories & co.).
name: PokeHOAS
version: "1.2-beta"
slug: pokemon_encounter
description: Random Pokémon encounters triggered by Home Assistant events. Battle and catch them in a built-in web app.
url: https://github.com/nedzad-winter/pokehoas
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto

# Ingress: the web app runs directly inside the HA UI, no port needs to be
# exposed.
ingress: true
ingress_port: 8099
panel_icon: mdi:pokeball
panel_title: Pokémon
panel_admin: false

# Optional direct port (e.g. for development / access from a phone outside the
# HA app). Disabled by default.
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Direct access to the web app (optional, otherwise use Ingress)

# Access to the Core API via the supervisor token.
homeassistant_api: true
hassio_api: true

# /data is included in supervisor backups automatically -> SQLite lives here.
map:
  - addon_config:rw

options:
  log_level: info
  poll_interval_minutes: 5
  # HA usernames or user IDs with access to the admin panel - in addition to
  # all HA administrators, who are detected automatically.
  admin_users: []
  http_port: 8099
  # Automatic triggers (see DOCS.md / app/trigger_sync.py).
  trigger_categories:
    - motion
    - door_window
    - lights_switches
  extra_entities: []
  exclude_entities: []
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  poll_interval_minutes: int(1,60)
  admin_users:
    - str
  http_port: port
  trigger_categories:
    - "list(motion|door_window|lights_switches|media_player|vacuum|climate|cover|lock|fan|person)?"
  extra_entities:
    - "str?"
  exclude_entities:
    - "str?"
